<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game UI Diary</title>
<style>
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; background:#0b0b0b; color:#fff; font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; font-weight:900; overflow-x:hidden;
    background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 2px,transparent 2px 28px); }
  main { max-width:620px; margin:0 auto; padding:40px 16px; }
  h1 { font-size:clamp(36px,9vw,64px); font-style:italic; letter-spacing:-.02em; transform:rotate(-2deg); margin-bottom:6px; animation:in .6s cubic-bezier(.2,.9,.3,1) both; }
  p.sub { letter-spacing:.3em; font-size:12px; opacity:.7; margin-bottom:28px; }
  a.card { display:flex; align-items:center; gap:18px; margin-bottom:14px; padding:18px 22px; color:#fff; text-decoration:none; background:#171717;
    border-left:14px solid var(--a); clip-path:polygon(0 0,100% 0,calc(100% - 22px) 100%,0 100%);
    animation:in .5s calc(var(--i)*100ms + .2s) cubic-bezier(.2,.9,.3,1) both; transition:.15s; }
  a.card:hover { background:var(--a); color:var(--b); padding-left:40px; }
  a.card i { width:48px; height:48px; flex:none; background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%); border:3px solid #fff; transform:skew(-10deg); }
  a.card b { display:block; font-size:26px; letter-spacing:.1em; }
  a.card span { font-size:13px; opacity:.85; }
  a.card em { margin-left:auto; font-style:normal; font-size:11px; letter-spacing:.2em; background:#fff; color:#111; padding:2px 10px; transform:skew(-12deg); }
  #last { display:none; margin-top:20px; font-size:13px; opacity:.8; }
  @keyframes in { from { opacity:0; transform:translateX(-70px) skewX(8deg); } }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<main>
  <h1>GAME UI DIARY</h1>
  <p class="sub">SELECT THEME ─ 好きなゲームのUIで日記を書く</p>
  <div id="cards"></div>
  <div id="last"></div>
</main>
<script>
const THEMES = [
  { id:"p5",  file:"persona5.html",  name:"PERSONA 5",  sub:"ペルソナ5風 ─ 赤と黒",      c1:"#e60012", c2:"#0b0b0b" },
  { id:"p3",  file:"persona3.html",  name:"PERSONA 3",  sub:"ペルソナ3風 ─ 蒼い影時間",  c1:"#5ec8ff", c2:"#0a58c8" },
  { id:"mgs3", file:"mgs3.html", name:"METAL GEAR SOLID 3", sub:"MGS3風 ─ スネークイーター", c1:"#e8a23a", c2:"#14110a" }
];
let last = null; try { last = localStorage.getItem("diary-theme"); } catch {}
document.getElementById("cards").innerHTML = THEMES.map((t, i) =>
  `<a class="card" href="${t.file}" style="--a:${t.c1};--b:${t.c2};--i:${i}"><i></i><div><b>${t.name}</b><span>${t.sub}</span></div>${t.id === last ? "<em>前回</em>" : ""}</a>`).join("");
</script>
</body>
</html>
