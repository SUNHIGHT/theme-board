<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persona Diary</title>
<style>
  :root { --red:#e60012; --dark:#0b0b0b; --white:#fff; --gray:#1c1c1c; }
  * { box-sizing:border-box; margin:0; }
  body {
    background:var(--red); color:var(--white); min-height:100vh;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Impact,sans-serif; font-weight:900;
    overflow-x:hidden;
  }
  /* diagonal black shapes in the background */
  body::before, body::after { content:""; position:fixed; z-index:0; background:var(--dark); }
  body::before { left:-10%; top:-20%; width:70%; height:80%; transform:rotate(-12deg) skewX(-20deg); }
  body::after  { right:-15%; bottom:-25%; width:75%; height:60%; transform:rotate(-12deg) skewX(-20deg); }
  main { position:relative; z-index:1; max-width:880px; margin:0 auto; padding:20px 16px 60px; }

  .tag { display:inline-block; background:var(--white); color:var(--dark); padding:2px 14px;
    transform:skew(-14deg) rotate(-2deg); font-size:14px; letter-spacing:.15em; }
  h1 { font-size:clamp(40px,10vw,84px); line-height:1; font-style:italic; letter-spacing:-.02em;
    text-shadow:5px 5px 0 var(--dark); transform:rotate(-3deg); margin:8px 0 18px; }
  h1 span { color:var(--dark); background:var(--white); padding:0 10px; text-shadow:none; display:inline-block; transform:skew(-10deg); }

  .panel { background:var(--dark); border:3px solid var(--white); padding:16px 20px; margin-bottom:22px;
    clip-path:polygon(0 0,100% 6px,calc(100% - 14px) 100%,10px calc(100% - 6px)); }
  .stats { display:flex; flex-wrap:wrap; gap:14px; }
  .stat { flex:1 1 140px; background:var(--white); color:var(--dark); padding:8px 14px;
    transform:skew(-8deg); }
  .stat b { display:block; font-size:12px; color:var(--red); letter-spacing:.15em; }
  .stat i { font-style:italic; font-size:34px; line-height:1.1; }
  .bar { height:14px; background:#444; margin-top:4px; }
  .bar div { height:100%; background:var(--red); width:0; transition:width .6s; }

  label.h { display:block; margin:12px 0 6px; font-size:14px; letter-spacing:.2em; color:var(--red);
    background:var(--white); width:max-content; padding:0 12px; transform:skew(-14deg); }
  .moods { display:flex; gap:8px; flex-wrap:wrap; }
  .moods button { font:inherit; cursor:pointer; border:2px solid var(--white); background:var(--dark); color:var(--white);
    padding:6px 14px; transform:skew(-12deg); transition:.12s; }
  .moods button:hover { background:var(--gray); }
  .moods button.on { background:var(--red); transform:skew(-12deg) scale(1.12); }
  textarea, input[type=text] { width:100%; background:var(--white); color:var(--dark); border:0; padding:12px;
    font-size:16px; line-height:1.7; font-family:inherit; font-weight:700; resize:vertical; outline:3px solid transparent; }
  textarea { min-height:160px; }
  textarea:focus, input:focus { outline-color:var(--red); }

  .save { display:block; margin:18px 0 0 auto; font:inherit; font-size:26px; font-style:italic; cursor:pointer;
    background:var(--red); color:var(--white); border:3px solid var(--white); padding:8px 38px;
    transform:skew(-12deg) rotate(-2deg); box-shadow:6px 6px 0 var(--white); transition:.1s; }
  .save:hover { transform:skew(-12deg) rotate(-2deg) translate(-2px,-2px); box-shadow:9px 9px 0 var(--white); }

  h2 { font-size:28px; font-style:italic; margin:6px 0 12px; text-shadow:3px 3px 0 var(--dark); transform:rotate(-1.5deg); }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal div { aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:13px;
    background:#2a2a2a; transform:skew(-8deg); }
  .cal .dow { aspect-ratio:auto; background:none; color:var(--red); }
  .cal .done { background:var(--red); }
  .cal .today { outline:3px solid var(--white); }
  .cal .sel { box-shadow:inset 0 0 0 3px var(--white); }

  .entry { background:var(--white); color:var(--dark); padding:12px 18px; margin-bottom:14px;
    transform:skew(-2deg); border-left:14px solid var(--red); }
  .entry small { color:var(--red); letter-spacing:.15em; }
  .entry p { white-space:pre-wrap; font-weight:700; margin-top:4px; }

  /* "all out attack" style stamp */
  #stamp { position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.75); }
  #stamp.show { display:flex; }
  #stamp .box { background:var(--red); border:6px solid var(--white); padding:24px 50px; text-align:center;
    transform:skew(-12deg) rotate(-4deg); animation:pop .5s cubic-bezier(.2,1.8,.4,1); box-shadow:12px 12px 0 var(--dark); }
  #stamp .big { font-size:clamp(40px,12vw,90px); font-style:italic; line-height:1; text-shadow:5px 5px 0 var(--dark); }
  #stamp .sub { font-size:20px; margin-top:8px; background:var(--dark); padding:2px 12px; }
  @keyframes pop { from { transform:skew(-12deg) rotate(-30deg) scale(.1); } }
  .hint { font-size:12px; opacity:.7; margin-top:6px; }
</style>
</head>
<body>
<main>
  <span class="tag">DAILY LOG ─ 日記</span>
  <h1>TAKE YOUR <span>DIARY</span></h1>

  <section class="panel">
    <div class="stats">
      <div class="stat"><b>LEVEL</b><i id="lv">1</i><div class="bar"><div id="xp"></div></div></div>
      <div class="stat"><b>STREAK 連続</b><i id="streak">0</i></div>
      <div class="stat"><b>TOTAL 記録</b><i id="total">0</i></div>
    </div>
  </section>

  <section class="panel">
    <label class="h" for="date">DATE</label>
    <input type="text" id="date" readonly>
    <label class="h">MOOD 今日の気分</label>
    <div class="moods" id="moods"></div>
    <label class="h" for="body">TODAY'S STORY</label>
    <textarea id="body" placeholder="今日はどんな一日だった？"></textarea>
    <div class="hint" id="hint"></div>
    <button class="save" id="save">SAVE!</button>
  </section>

  <h2>CALENDAR</h2>
  <section class="panel">
    <div class="cal" id="cal"></div>
  </section>

  <h2>MEMORIES</h2>
  <div id="list"></div>
</main>

<div id="stamp"><div class="box"><div class="big" id="stampBig">RECORDED!</div><div class="sub" id="stampSub"></div></div></div>

<script>
const KEY = "persona-diary-v1";
const MOODS = ["最高","良い","普通","微妙","最悪"];
const XP_PER = 100, XP_BONUS_PER_STREAK = 10; // level up every 100xp
const $ = id => document.getElementById(id);

const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
const store = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let data = load();            // { "YYYY-MM-DD": {mood, text} }
let selected = ymd(new Date());
let mood = null;

function streakCount() {
  let n = 0, d = new Date();
  if (!data[ymd(d)]) d.setDate(d.getDate() - 1); // today not written yet: count up to yesterday
  while (data[ymd(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function totalXp() {
  // 100xp per entry + small bonus that grows with the streak at the time of writing
  const days = Object.keys(data).sort();
  let xp = 0, run = 0, prev = null;
  for (const k of days) {
    const cur = new Date(k + "T00:00:00");
    run = prev && (cur - prev) / 864e5 === 1 ? run + 1 : 1;
    xp += XP_PER + Math.min(run, 30) * XP_BONUS_PER_STREAK;
    prev = cur;
  }
  return xp;
}
const levelOf = xp => 1 + Math.floor(xp / 300);

function render() {
  const xp = totalXp();
  $("lv").textContent = levelOf(xp);
  $("xp").style.width = (xp % 300) / 3 + "%";
  $("streak").textContent = streakCount();
  $("total").textContent = Object.keys(data).length;

  $("date").value = selected;
  const e = data[selected];
  $("body").value = e ? e.text : "";
  mood = e ? e.mood : null;
  $("moods").innerHTML = MOODS.map(m => `<button data-m="${m}" class="${m===mood?"on":""}">${m}</button>`).join("");
  $("hint").textContent = selected === ymd(new Date()) ? "" : "過去の日付を編集中（カレンダーで日付を選べます）";

  // calendar (current month)
  const now = new Date(), y = now.getFullYear(), mo = now.getMonth();
  const first = new Date(y, mo, 1).getDay(), last = new Date(y, mo + 1, 0).getDate();
  let h = "SMTWTFS".split("").map(c => `<div class="dow">${c}</div>`).join("");
  h += "<div style='visibility:hidden'></div>".repeat(first);
  for (let d = 1; d <= last; d++) {
    const k = ymd(new Date(y, mo, d));
    h += `<div data-d="${k}" style="cursor:pointer" class="${data[k]?"done":""} ${k===ymd(now)?"today":""} ${k===selected?"sel":""}">${d}</div>`;
  }
  $("cal").innerHTML = h;

  const keys = Object.keys(data).sort().reverse();
  $("list").innerHTML = keys.length ? keys.map(k =>
    `<div class="entry"><small>${k} ／ MOOD: ${esc(data[k].mood||"-")}</small><p>${esc(data[k].text)}</p></div>`).join("")
    : `<div class="entry"><p>まだ記録がありません。最初の一行を書こう。</p></div>`;
}

$("moods").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  mood = b.dataset.m;
  [...$("moods").children].forEach(x => x.classList.toggle("on", x === b));
};
$("cal").onclick = e => {
  const c = e.target.closest("[data-d]"); if (!c) return;
  selected = c.dataset.d; render();
};
$("save").onclick = () => {
  const text = $("body").value.trim();
  if (!text) { $("body").focus(); return; }
  const before = levelOf(totalXp()), isNew = !data[selected];
  data[selected] = { mood, text };
  store(data);
  const lvUp = levelOf(totalXp()) > before;
  $("stampBig").textContent = lvUp ? "LEVEL UP!" : "RECORDED!";
  $("stampSub").textContent = isNew ? `${streakCount()}日連続 ／ +XP` : "更新しました";
  $("stamp").classList.add("show");
  render();
};
$("stamp").onclick = () => $("stamp").classList.remove("show");
render();
</script>
</body>
</html>
