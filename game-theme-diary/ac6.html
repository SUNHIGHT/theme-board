<style>
  /* Garage-menu layout: left main menu / sub list / detail panel / hint bar (after AC6's garage screen) */
  :root { --bg:#0b0d0f; --fg:#c9d0d5; --hi:#f2f5f7; --dim:#7d868d; --line:rgba(235,240,243,.3); --panel:rgba(74,82,89,.42); --row:rgba(255,255,255,.07);
    --sel-bg:#e9edef; --sel-fg:#101214; --acc:#ff6a00; --fb:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN',sans-serif; --fh:'Michroma','Zen Kaku Gothic New',sans-serif; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body { font-family:var(--fb); color:var(--fg); overflow:hidden; background:
      radial-gradient(ellipse at 72% 28%, rgba(120,132,140,.28), transparent 58%),
      repeating-linear-gradient(100deg, rgba(255,255,255,.028) 0 2px, transparent 2px 96px),
      linear-gradient(115deg,#0c0e10 0%,#1c2125 46%,#0a0b0d 100%); }
  body::before { content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.55;
    background:linear-gradient(72deg, transparent 0 38%, rgba(255,255,255,.05) 38% 42%, transparent 42% 60%, rgba(255,255,255,.035) 60% 63%, transparent 63%); filter:blur(6px); }
  body::after { content:""; position:fixed; inset:0; z-index:40; pointer-events:none; background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.7) 100%); }
  .app { position:relative; z-index:1; height:100%; display:grid; grid-template-rows:auto 1fr auto; }

  /* top bar */
  .top { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; padding:22px 30px 12px; animation:fadeIn .5s both; }
  .crumb { font-family:var(--fh); font-size:clamp(20px,3vw,30px); letter-spacing:.2em; color:var(--hi); }
  .crumb small { display:block; font-family:var(--fb); font-size:12px; letter-spacing:.25em; color:var(--dim); margin-top:4px; }
  .res { display:flex; gap:26px; margin-right:150px; font-family:var(--fh); font-size:13px; letter-spacing:.1em; color:var(--hi); text-align:right; }
  .res b { display:block; font-family:var(--fb); font-weight:500; font-size:10px; letter-spacing:.25em; color:var(--dim); }
  .res span { font-size:18px; }

  /* middle */
  .mid { display:grid; grid-template-columns:260px 1fr; gap:22px; padding:6px 30px; min-height:0; }
  .menu { display:flex; flex-direction:column; gap:4px; align-self:start; padding-top:10px; }
  .mi { all:unset; box-sizing:border-box; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; cursor:pointer; color:var(--fg);
    border-left:3px solid transparent; font-family:var(--fh); font-size:13px; letter-spacing:.16em; animation:slideIn .45s calc(var(--i) * 70ms + .15s) cubic-bezier(.2,.9,.3,1) both; transition:background .12s; }
  .mi small { display:block; font-family:var(--fb); font-size:11px; letter-spacing:.12em; color:var(--dim); margin-top:3px; }
  .mi::after { content:"▸"; color:var(--dim); }
  .mi:hover { background:var(--row); }
  .mi.cur { color:var(--hi); border-left-color:var(--hi); background:var(--row); }
  .mi.cur::after { color:var(--hi); }
  .menu.focus .mi.cur { background:rgba(255,255,255,.16); }
  .mi:focus-visible, .row:focus-visible, button:focus-visible, textarea:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }

  .work { display:grid; grid-template-columns:minmax(230px,320px) 1fr; gap:16px; min-height:0; animation:fadeIn .4s .25s both; }
  .work.solo { grid-template-columns:1fr; }
  .work.solo .sub { display:none; }
  .pn { position:relative; display:flex; flex-direction:column; min-height:0; background:var(--panel); border:1px solid var(--line); backdrop-filter:blur(3px); }
  .pn::before, .pn::after { content:""; position:absolute; width:10px; height:10px; border:2px solid var(--hi); pointer-events:none; }
  .pn::before { top:-1px; left:-1px; border-right:0; border-bottom:0; } .pn::after { right:-1px; bottom:-1px; border-left:0; border-top:0; }
  .pn > h3 { font-family:var(--fh); font-weight:400; font-size:10px; letter-spacing:.24em; color:var(--dim); padding:9px 14px; border-bottom:1px solid var(--line); }
  .pn > h3::before { content:"▪ "; color:var(--hi); }
  .pn .body { padding:12px 14px 14px; overflow:auto; min-height:0; }
  .panel-in { animation:panelIn .3s cubic-bezier(.2,.9,.3,1); }

  /* list rows (sub menu) */
  .list { display:flex; flex-direction:column; gap:3px; padding:10px; overflow:auto; min-height:0; }
  .row { all:unset; box-sizing:border-box; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 14px; cursor:pointer; color:var(--hi); background:var(--row);
    font-family:var(--fh); font-size:12px; letter-spacing:.14em; transition:background .1s; }
  .row small { font-family:var(--fb); font-size:11px; letter-spacing:.08em; color:var(--dim); }
  .row:hover { background:rgba(255,255,255,.16); }
  .row.sel { background:var(--sel-bg); color:var(--sel-fg); } .row.sel small { color:#4b5359; }
  .row.sel.flash { animation:flash .25s; }
  .empty { padding:18px 14px; color:var(--dim); font-size:13px; line-height:1.8; }

  /* detail */
  .head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
  .head b { font-family:var(--fh); font-weight:400; font-size:16px; letter-spacing:.14em; color:var(--hi); }
  .chip { font-family:var(--fh); font-size:10px; letter-spacing:.2em; padding:3px 10px; border:1px solid var(--line); color:var(--hi); }
  textarea { width:100%; min-height:min(34vh,300px); resize:vertical; padding:12px 14px; font:500 16px/1.9 var(--fb); color:var(--hi); background:rgba(0,0,0,.35); border:1px solid var(--line); outline:none; }
  textarea:focus { border-color:var(--hi); }
  textarea::placeholder { color:var(--dim); }
  .acts { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:12px; flex-wrap:wrap; }
  .hintx { font-size:12px; color:var(--acc); min-height:1.2em; }
  .btn { all:unset; box-sizing:border-box; cursor:pointer; font-family:var(--fh); font-size:13px; letter-spacing:.3em; padding:11px 30px; color:var(--sel-fg); background:var(--sel-bg); transition:.12s; }
  .btn:hover { background:#fff; box-shadow:0 0 16px rgba(255,255,255,.45); } .btn:active { transform:scale(.96); }
  .btn.ghost { background:transparent; color:var(--hi); border:1px solid var(--hi); } .btn.ghost:hover { background:rgba(255,255,255,.14); box-shadow:none; }
  .text { white-space:pre-wrap; line-height:1.9; color:var(--hi); }

  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px; }
  .card { border:1px solid var(--line); background:rgba(0,0,0,.28); padding:8px 12px 10px; }
  .card b { display:block; font-family:var(--fh); font-weight:400; font-size:9px; letter-spacing:.24em; color:var(--dim); }
  .card span { display:block; font-family:var(--fh); font-size:26px; color:var(--hi); margin-top:4px; }
  .card span.sm { font-size:15px; letter-spacing:.08em; padding-top:8px; }
  .gauge { margin-bottom:12px; }
  .gauge b { display:flex; justify-content:space-between; font-family:var(--fh); font-weight:400; font-size:10px; letter-spacing:.2em; color:var(--dim); margin-bottom:5px; }
  .gauge b em { font-style:normal; color:var(--hi); }
  .track { height:12px; border:1px solid var(--line); padding:2px; transform:skewX(-20deg); }
  .track i { display:block; height:100%; width:0; background:repeating-linear-gradient(90deg,var(--hi) 0 6px,transparent 6px 8px); transition:width .8s cubic-bezier(.2,.9,.3,1); }

  .mhead { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; font-family:var(--fh); font-size:13px; letter-spacing:.16em; color:var(--hi); }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; max-width:620px; }
  .cal div { aspect-ratio:1.25; display:flex; align-items:center; justify-content:center; font-family:var(--fh); font-size:12px; border:1px solid var(--line); background:rgba(0,0,0,.22); color:var(--fg); }
  .cal .dow { aspect-ratio:auto; border:0; background:none; color:var(--dim); font-size:10px; letter-spacing:.2em; }
  .cal .d { cursor:pointer; animation:rise .3s calc(var(--i) * 14ms) both; transition:.12s; }
  .cal .d:hover { background:rgba(255,255,255,.2); color:var(--hi); }
  .cal .done { background:var(--sel-bg); color:var(--sel-fg); }
  .cal .today { outline:1px solid var(--hi); outline-offset:2px; }
  .cal .sel { box-shadow:0 0 0 2px var(--acc); }

  /* bottom hint bar */
  .bottom { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:12px 30px 18px; border-top:1px solid var(--line); background:linear-gradient(transparent, rgba(0,0,0,.45)); font-size:13px; animation:fadeIn .5s .4s both; }
  .desc { color:var(--fg); line-height:1.6; }
  .keys { display:flex; gap:16px; flex:none; font-size:12px; color:var(--dim); letter-spacing:.08em; }
  .keys i { display:inline-block; min-width:22px; padding:0 6px; margin-right:6px; text-align:center; border:1px solid var(--fg); border-radius:50%; font-style:normal; color:var(--hi); line-height:20px; }

  /* mission complete overlay */
  #ov { position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.72); }
  #ov.show { display:flex; animation:fadeIn .2s; }
  #ov .ln { position:absolute; left:0; right:0; top:50%; height:1px; background:var(--hi); animation:grow .6s cubic-bezier(.2,.9,.3,1); box-shadow:0 0 12px #fff; }
  #ov .tx { position:relative; text-align:center; padding:0 16px; }
  #ovT { font-family:var(--fh); font-size:clamp(22px,5.4vw,52px); letter-spacing:.28em; color:var(--hi); text-shadow:0 0 24px rgba(255,255,255,.55); animation:zoomIn .6s .2s cubic-bezier(.2,.9,.3,1) both; }
  #ovS { margin-top:12px; font-size:13px; letter-spacing:.3em; color:var(--dim); animation:fadeIn .4s .6s both; }

  @keyframes fadeIn { from { opacity:0; } }
  @keyframes slideIn { from { opacity:0; transform:translateX(-28px); } }
  @keyframes panelIn { from { opacity:0; transform:translateX(18px); } }
  @keyframes flash { 0% { background:#fff; transform:translateX(5px); } }
  @keyframes rise { from { opacity:0; transform:scale(.7); } }
  @keyframes grow { from { transform:scaleX(0); } }
  @keyframes zoomIn { from { opacity:0; letter-spacing:.7em; transform:scale(1.4); } }

  @media (max-width:820px) {
    html, body { height:auto; } body { overflow:auto; } .app { height:auto; min-height:100%; }
    .top { padding:70px 16px 8px; } .res { margin-right:0; }
    .mid { grid-template-columns:1fr; padding:6px 16px; gap:12px; }
    .menu { flex-direction:row; overflow-x:auto; padding:0; gap:6px; } .mi { flex:none; border-left:0; border-bottom:3px solid transparent; padding:10px 14px; } .mi::after { content:none; }
    .mi.cur { border-bottom-color:var(--hi); }
    .work { grid-template-columns:1fr; } .bottom { flex-direction:column; align-items:flex-start; padding:12px 16px 20px; } .keys { display:none; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>

<script src="theme-switch.js" data-theme="ac6"></script>
<script>
const KEY = "diary-shared-v1";
const LEGACY = ["persona-diary-v1", "persona3-diary-v1"];
const MOODS = [["最高","AP FULL"],["良い","STABLE"],["普通","DAMAGED"],["微妙","ACS OVERLOAD"],["最悪","STAGGERED"]];
const RANKS = ["ROOKIE","INDEPENDENT","MERCENARY","RANKER","ELITE","ACE","LEGEND"];
const XP_PER = 100, XP_BONUS_PER_STREAK = 10, XP_PER_RANK = 300;
const MENU = [
  { id: "write",    en: "MISSION LOG", jp: "日記を書く",   desc: "今日の作戦を記録します。気分を選び、本文を入力して出撃(保存)します。" },
  { id: "archive",  en: "ARCHIVES",    jp: "過去の記録",   desc: "これまでの作戦記録を閲覧します。選んだ記録は、そのまま編集できます。" },
  { id: "schedule", en: "SCHEDULE",    jp: "カレンダー",   desc: "月間の出撃スケジュールを確認します。日付を選ぶと、その日の記録を開きます。" },
  { id: "license",  en: "LICENSE",     jp: "ライセンス",   desc: "傭兵ライセンスを確認します。ランク、連続出撃日数、累計の記録数を表示します。" }
];
const $ = id => document.getElementById(id);
const load = () => {
  try {
    let d = JSON.parse(localStorage.getItem(KEY));
    if (!d) { d = {}; for (const k of LEGACY) { const o = JSON.parse(localStorage.getItem(k) || "{}"); for (const day in o) if (!d[day]) d[day] = o[day]; } }
    return d;
  } catch { return {}; }
};
const store = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate = k => k.replace(/-/g, ".");

let data = load(), selected = ymd(new Date()), mood = null, draft = "";
let mi = 0, si = 0, focus = "main", calOff = 0, overlayTimer, typeTimer;
const DOW = ["SUN","MON","TUE","WED","THU","FRI","SAT"];

function streakCount() { let n = 0, d = new Date(); if (!data[ymd(d)]) d.setDate(d.getDate() - 1); while (data[ymd(d)]) { n++; d.setDate(d.getDate() - 1); } return n; }
function totalXp() {
  let xp = 0, run = 0, prev = null;
  for (const k of Object.keys(data).sort()) { const cur = new Date(k + "T00:00:00"); run = prev && (cur - prev) / 864e5 === 1 ? run + 1 : 1; xp += XP_PER + Math.min(run, 30) * XP_BONUS_PER_STREAK; prev = cur; }
  return xp;
}
const rankOf = xp => Math.min(Math.floor(xp / XP_PER_RANK), RANKS.length - 1);
const archiveKeys = () => Object.keys(data).sort().reverse();
const loadDay = () => { const e = data[selected]; mood = e ? e.mood : null; draft = e ? e.text : ""; };

function renderTop() {
  const xp = totalXp();
  $("coam").textContent = (xp * 180).toLocaleString();
  $("chip").textContent = streakCount();
  $("crumb").firstChild.textContent = "GARAGE ▸ " + MENU[mi].en;
  $("crumb2").textContent = MENU[mi].jp + " ─ " + fmtDate(selected) + " " + DOW[new Date(selected + "T00:00:00").getDay()];
  $("desc").textContent = MENU[mi].desc;
}
function renderMenu() {
  const m = $("menu"); m.classList.toggle("focus", focus === "main");
  m.innerHTML = MENU.map((x, i) => `<button class="mi ${i === mi ? "cur" : ""}" data-m="${i}" style="--i:${i}"><span>${x.en}<small>${x.jp}</small></span></button>`).join("");
}

function subList(items, selIdx) {
  return items.map((it, i) => `<button class="row ${i === selIdx ? "sel" : ""}" data-s="${i}">${it}</button>`).join("");
}
function renderWork(animate) {
  const id = MENU[mi].id, work = $("work"), det = $("det");
  work.classList.toggle("solo", id === "schedule" || id === "license");
  [$("sub").parentElement, $("det").parentElement].forEach(p => { if (animate) { p.classList.remove("panel-in"); void p.offsetWidth; p.classList.add("panel-in"); } });

  if (id === "write") {
    $("subT").textContent = "CONDITION ─ 今日の機体状態";
    const mi2 = MOODS.findIndex(x => x[0] === mood);
    $("sub").innerHTML = subList(MOODS.map(([m, t]) => `<span>${t}</span><small>${m}</small>`), mi2);
    $("detT").textContent = "ENTRY ─ 作戦記録";
    const today = selected === ymd(new Date());
    det.innerHTML = `<div class="head"><b>${fmtDate(selected)}</b><span class="chip" id="moodChip">${mood ? MOODS.find(x => x[0] === mood)[1] : "NO DATA"}</span></div>
      <textarea id="body" placeholder="作戦内容を記録せよ…"></textarea>
      <div class="acts"><span class="hintx">${today ? "" : "過去の日付を編集中です(SCHEDULE で日付を選べます)"}</span><button class="btn" id="save">SORTIE</button></div>`;
    $("body").value = draft;
    $("body").addEventListener("input", e => { draft = e.target.value; });
  } else if (id === "archive") {
    const keys = archiveKeys();
    if (si >= keys.length) si = Math.max(0, keys.length - 1);
    $("subT").textContent = "COMBAT LOG ─ 作戦一覧";
    $("sub").innerHTML = keys.length ? subList(keys.map(k => `<span>${fmtDate(k)}</span><small>${esc((data[k].mood) || "-")}</small>`), si) : `<div class="empty">記録はまだありません。</div>`;
    $("detT").textContent = "REPORT ─ 作戦詳細";
    const k = keys[si];
    det.innerHTML = k ? `<div class="head"><b>${fmtDate(k)}</b><span class="chip">${esc((MOODS.find(x => x[0] === data[k].mood) || ["", "NO DATA"])[1])}</span></div>
      <div class="text">${esc(data[k].text)}</div><div class="acts"><span></span><button class="btn ghost" id="edit" data-k="${k}">EDIT</button></div>`
      : `<div class="empty">MISSION LOG で最初の作戦を記録しましょう。</div>`;
  } else if (id === "schedule") {
    const now = new Date(), base = new Date(now.getFullYear(), now.getMonth() + calOff, 1), y = base.getFullYear(), mo = base.getMonth();
    const first = base.getDay(), last = new Date(y, mo + 1, 0).getDate();
    $("detT").textContent = "SCHEDULE ─ 月間予定";
    let h = DOW.map(d => `<div class="dow">${d[0]}</div>`).join("") + "<div style='visibility:hidden;border:0'></div>".repeat(first);
    for (let d = 1; d <= last; d++) {
      const k = ymd(new Date(y, mo, d));
      h += `<div class="d ${data[k] ? "done" : ""} ${k === ymd(now) ? "today" : ""} ${k === selected ? "sel" : ""}" data-d="${k}" style="--i:${d}">${d}</div>`;
    }
    det.innerHTML = `<div class="mhead"><button class="btn ghost" data-cal="-1" style="padding:6px 16px">◂</button><span>${y}.${String(mo + 1).padStart(2, "0")}</span><button class="btn ghost" data-cal="1" style="padding:6px 16px">▸</button></div><div class="cal">${h}</div>`;
  } else {
    const xp = totalXp(), rk = rankOf(xp), st = streakCount(), n = Object.keys(data).length;
    const pct = rk >= RANKS.length - 1 ? 100 : Math.round((xp % XP_PER_RANK) / XP_PER_RANK * 100), ap = 2000 + Math.min(st, 30) * 350;
    $("detT").textContent = "MERCENARY LICENSE ─ 傭兵ライセンス";
    det.innerHTML = `<div class="cards">
        <div class="card"><b>RANK</b><span class="sm">${RANKS[rk]}</span></div>
        <div class="card"><b>STREAK</b><span>${st}</span></div>
        <div class="card"><b>TOTAL</b><span>${n}</span></div>
        <div class="card"><b>HUNTER CLASS</b><span>${String(1 + Math.floor(xp / 60)).padStart(2, "0")}</span></div></div>
      <div class="gauge"><b>AP ─ 連続日数<em>${ap.toLocaleString()}</em></b><div class="track"><i style="width:0" data-w="${Math.round(ap / 12500 * 100)}"></i></div></div>
      <div class="gauge"><b>ACS ─ 次のランクまで<em>${pct}%</em></b><div class="track"><i style="width:0" data-w="${pct}"></i></div></div>`;
    requestAnimationFrame(() => det.querySelectorAll("[data-w]").forEach(el => el.style.width = el.dataset.w + "%"));
  }
}

function renderAll(animate) { renderTop(); renderMenu(); renderWork(animate); }

function showOverlay(title, sub) {
  const ov = $("ov"); ov.classList.remove("show"); void ov.offsetWidth; ov.classList.add("show");
  $("ovT").textContent = title; $("ovS").textContent = sub;
  clearTimeout(overlayTimer); overlayTimer = setTimeout(() => ov.classList.remove("show"), 2300);
}
$("ov").onclick = () => $("ov").classList.remove("show");

function saveEntry() {
  const text = $("body").value.trim();
  if (!text) { $("body").focus(); return; }
  const before = rankOf(totalXp()), isNew = !data[selected];
  data[selected] = { mood, text }; draft = text; store(data);
  const up = rankOf(totalXp()) > before;
  showOverlay(up ? "RANK UP" : "MISSION COMPLETE", (up ? RANKS[rankOf(totalXp())] + " ─ " : "") + (isNew ? streakCount() + " DAYS" : "UPDATED"));
  renderTop();
}

function setMood(i) {
  mood = MOODS[i][0]; si = i;
  document.querySelectorAll("#sub .row").forEach((r, k) => { r.classList.toggle("sel", k === i); if (k === i) { r.classList.remove("flash"); void r.offsetWidth; r.classList.add("flash"); } });
  const c = $("moodChip"); if (c) c.textContent = MOODS[i][1];
}
function goWrite(dateKey) { selected = dateKey; loadDay(); mi = 0; focus = "sub"; si = Math.max(0, MOODS.findIndex(x => x[0] === mood)); renderAll(true); }

// ---- events ----
$("menu").addEventListener("click", e => { const b = e.target.closest("[data-m]"); if (!b) return; mi = +b.dataset.m; si = 0; focus = "main"; if (MENU[mi].id === "write") loadDay(); renderAll(true); });
$("sub").addEventListener("click", e => {
  const b = e.target.closest("[data-s]"); if (!b) return; focus = "sub";
  const i = +b.dataset.s;
  if (MENU[mi].id === "write") setMood(i); else { si = i; renderWork(false); renderMenu(); }
});
$("det").addEventListener("click", e => {
  if (e.target.closest("#save")) return saveEntry();
  const ed = e.target.closest("#edit"); if (ed) return goWrite(ed.dataset.k);
  const dd = e.target.closest("[data-d]"); if (dd) return goWrite(dd.dataset.d);
  const c = e.target.closest("[data-cal]"); if (c) { calOff += +c.dataset.cal; renderWork(false); }
});
document.addEventListener("keydown", e => {
  if (e.target.matches("textarea, input")) { if (e.key === "Escape") { e.target.blur(); focus = "sub"; } return; }
  const id = MENU[mi].id, hasSub = id === "write" || id === "archive";
  const subLen = id === "write" ? MOODS.length : archiveKeys().length;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); const d = e.key === "ArrowDown" ? 1 : -1;
    if (focus === "main") { mi = (mi + d + MENU.length) % MENU.length; si = 0; if (MENU[mi].id === "write") loadDay(); renderAll(true); }
    else if (hasSub && subLen) { si = (si + d + subLen) % subLen; if (id === "write") setMood(si); else { renderWork(false); } renderMenu(); }
  } else if (e.key === "ArrowRight" || e.key === "Enter") {
    if (focus === "main" && hasSub) { focus = "sub"; si = id === "write" ? Math.max(0, MOODS.findIndex(x => x[0] === mood)) : 0; renderMenu(); }
    else if (focus === "sub" && e.key === "Enter") { if (id === "write") { $("body").focus(); } else { const k = archiveKeys()[si]; if (k) goWrite(k); } }
  } else if (e.key === "ArrowLeft" || e.key === "Escape") { focus = "main"; renderMenu(); }
});

loadDay();
renderAll(false);
</script>
</body>
</html>
