<style>
  /* Ink-shooter lobby: LED triangle wall, glitchy neon match card with drips, ink tank on a platform, currency/rank pills,
     rule + stage panel; battle-HUD editor that splats ink while typing; turf-judging results with awards */
  :root { --fd:'Dela Gothic One','M PLUS Rounded 1c',sans-serif; --fl:'Lilita One','M PLUS Rounded 1c',sans-serif; --fb:'M PLUS Rounded 1c',sans-serif;
    --c:#c6f000; --cd:#2a3a00; --wall:#b8e600; --enemy:#7a2bff; --panel:rgba(20,20,26,.92); --line:#3a3a44; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body { font-family:var(--fb); color:#fff; background:#07070a; overflow:hidden; }
  button { font:inherit; color:inherit; }

  /* ---------- LED wall + platform ---------- */
  .wall { position:fixed; inset:0; overflow:hidden; background:#050506; }
  .wall svg { position:absolute; left:50%; top:46%; width:max(140vw,1500px); translate:-50% -50%; transform:perspective(900px) rotateX(8deg); }
  .wall::after { content:""; position:absolute; inset:0; background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.16) 45%,transparent 60%) 0 0/250% 100%; animation:sweep 6s linear infinite; mix-blend-mode:overlay; pointer-events:none; }
  .wall::before { content:""; position:absolute; inset:0; z-index:1; background:radial-gradient(ellipse 60% 55% at 50% 45%,transparent 30%,rgba(0,0,0,.78) 100%); pointer-events:none; }
  .floor { position:fixed; left:0; right:0; bottom:0; height:30vh; z-index:1; background:radial-gradient(ellipse 80% 100% at 50% 100%,#1a1a20,#08080a 70%); }
  .plat { position:fixed; z-index:2; left:50%; bottom:6vh; width:min(46vw,72vh); aspect-ratio:3.2; translate:-50% 0; border-radius:50%;
    background:radial-gradient(ellipse at 50% 40%,#3a3a44,#1a1a20 60%,#0a0a0e); box-shadow:0 0 0 4px #2a2a32, 0 0 0 10px #121216, 0 0 0 12px rgba(255,255,255,.08), 0 18px 40px rgba(0,0,0,.8); }
  .plat::before { content:""; position:absolute; inset:14% 18%; border-radius:50%; border:3px solid rgba(255,255,255,.08); box-shadow:inset 0 0 30px color-mix(in srgb,var(--c) 30%,transparent); }
  .plat::after { content:""; position:absolute; inset:-30% 10% 30%; border-radius:50%; background:radial-gradient(ellipse,color-mix(in srgb,var(--c) 35%,transparent),transparent 65%); filter:blur(10px); animation:pulse 3s ease-in-out infinite; }

  /* ink tank (stands where a character would) */
  .tank { position:fixed; z-index:3; left:50%; bottom:13vh; width:min(22vw,36vh); translate:-50% 0; animation:bob 3.2s ease-in-out infinite; cursor:pointer; }
  .tank svg { width:100%; display:block; filter:drop-shadow(0 18px 18px rgba(0,0,0,.6)); overflow:visible; }
  .tank .tdate { position:absolute; left:-40%; right:-40%; bottom:100%; padding-bottom:.6vh; text-align:center; font:400 min(5.2vh,3vw)/1 var(--fd); text-shadow:0 3px 0 #000; }
  .tank .np { display:inline-block; margin-top:.8vh; padding:.3vh 1vw; border-radius:6px; background:rgba(0,0,0,.6); box-shadow:0 0 0 2px rgba(255,255,255,.25); font:900 min(1.7vh,.95vw) var(--fb); letter-spacing:.06em; white-space:nowrap; }
  .tank .tdate small { display:block; font:800 min(1.8vh,1vw) var(--fb); letter-spacing:.2em; color:#ddd; margin-top:.4vh; }

  /* ---------- top-left: tabs + match card ---------- */
  .tabs { position:fixed; z-index:6; left:2.2vw; top:3vh; display:flex; align-items:center; gap:.5vw; padding:.6vh .6vw; background:rgba(20,20,26,.9); border-radius:999px; box-shadow:0 0 0 2px #2a2a32; }
  .tabs .lr { display:grid; place-items:center; width:min(4.2vh,2.4vw); aspect-ratio:1; border-radius:8px; background:#6a5ae8; font:400 min(2.2vh,1.2vw) var(--fl); clip-path:polygon(30% 0,100% 0,100% 100%,30% 100%,0 50%); }
  .tabs .lr.r { clip-path:polygon(0 0,70% 0,100% 50%,70% 100%,0 100%); }
  .tab { all:unset; cursor:pointer; display:grid; place-items:center; width:min(4.4vh,2.5vw); aspect-ratio:1; border-radius:50%; background:#2a2a32; transition:.15s; }
  .tab svg { width:60%; } .tab.on { background:#fff; box-shadow:0 0 0 3px var(--c); } .tab.on svg * { stroke:#111; fill:#111; }
  .tab:focus-visible { outline:3px solid var(--c); }
  .sub { position:fixed; z-index:6; left:3vw; top:calc(3vh + min(5.6vh,3.2vw) + 1.2vh); display:flex; align-items:center; gap:.6vw; font:900 min(1.9vh,1.05vw) var(--fb); color:#ddd; }
  .sub i { width:min(3.4vh,1.9vw); aspect-ratio:1; border-radius:6px; background:var(--c); display:grid; place-items:center; font-style:normal; color:#111; font:400 min(2vh,1.1vw) var(--fl); }
  .cardWrap { position:fixed; z-index:6; left:2.6vw; top:16vh; width:min(36vw,58vh); }
  .card { all:unset; box-sizing:border-box; cursor:pointer; position:relative; display:grid; grid-template-columns:auto 1fr; align-items:center; gap:1.4vw; width:100%; aspect-ratio:1.55; padding:2.4vh 2vw 5.6vh 2.2vw; border-radius:min(5vh,2.8vw);
    background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 50%), var(--c); color:#121212; box-shadow:0 0 0 min(.8vh,.45vw) #fff, 0 0 30px color-mix(in srgb,var(--c) 70%,transparent); transition:transform .2s cubic-bezier(.3,1.6,.5,1); }
  .card::before, .card::after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; mix-blend-mode:screen; }
  .card::before { box-shadow:0 0 0 min(.8vh,.45vw) #ff2fa8; translate:-.7vw .5vh; opacity:.85; animation:glitchA 3.4s steps(1) infinite; }
  .card::after { box-shadow:0 0 0 min(.8vh,.45vw) #19e0ff; translate:.7vw -.4vh; opacity:.85; animation:glitchB 3.4s steps(1) infinite; }
  .card:hover { transform:scale(1.02) rotate(-.6deg); } .card:focus-visible { outline:none; box-shadow:0 0 0 min(.8vh,.45vw) #fff, 0 0 0 min(1.4vh,.8vw) #111, 0 0 30px var(--c); }
  .card.swap { animation:cardIn .4s cubic-bezier(.3,1.6,.5,1); }
  .card .emb { width:min(16vh,9vw); aspect-ratio:1; } .card .emb svg { width:100%; display:block; }
  .card .nm { font:400 min(5.4vh,3vw)/1.15 var(--fd); letter-spacing:.04em; }
  .card .ds { position:absolute; left:0; right:0; bottom:3vh; text-align:center; font:900 min(2.1vh,1.15vw) var(--fb); }
  .card .drip { position:absolute; left:6%; right:6%; top:96%; height:min(10vh,5.6vw); color:var(--c); pointer-events:none; }
  .card .drip svg { width:100%; height:100%; display:block; overflow:visible; }
  .modeBadge { position:absolute; left:-1vw; bottom:-12vh; width:min(10vh,5.6vw); aspect-ratio:1; border-radius:50%; background:#d85a2a; display:grid; place-items:center; box-shadow:0 0 0 4px #2a1208, 0 0 0 7px #ffb08a; animation:spin 12s linear infinite; }
  .modeBadge svg { width:60%; }
  .hintL { position:fixed; z-index:6; left:2.6vw; bottom:4vh; display:flex; align-items:center; gap:1.2vw; font:900 min(1.9vh,1.05vw) var(--fb); }
  .hintL button { all:unset; cursor:pointer; display:flex; align-items:center; gap:.5vw; padding:.4vh 1vw .4vh .4vw; border-radius:999px; background:rgba(20,20,26,.9); box-shadow:0 0 0 2px #2a2a32; }
  .hintL i { font-style:normal; display:grid; place-items:center; width:min(3vh,1.7vw); aspect-ratio:1; border-radius:50%; background:#fff; color:#111; font:400 min(1.8vh,1vw) var(--fl); }
  .hintL button:hover, .hintL button:focus-visible { box-shadow:0 0 0 2px var(--c); outline:0; }
  #bSe.off { opacity:.55; } #bSe.off i { background:#555; color:#ddd; }

  /* ---------- top-right: pills ---------- */
  .pills { position:fixed; z-index:6; right:1.6vw; top:2vh; margin-right:min(130px,11vw); display:flex; flex-direction:column; align-items:flex-end; gap:.8vh; }
  .prow { display:flex; gap:.6vw; }
  .pill { display:flex; align-items:center; gap:.5vw; padding:.4vh 1vw .4vh .5vw; border-radius:999px; background:rgba(20,20,26,.92); box-shadow:0 0 0 2px #2a2a32; font:400 min(2.6vh,1.45vw) var(--fl); letter-spacing:.04em; }
  .pill .ic { width:min(3vh,1.7vw); aspect-ratio:1; border-radius:50%; display:grid; place-items:center; }
  .pill .ic.ink { background:#6a3cff; } .pill .ic.coin { background:radial-gradient(circle at 35% 30%,#fff3a8,#ffcc00 55%,#b88a00); color:#4a3400; font:400 min(1.8vh,1vw) var(--fl); }
  .rank { display:flex; align-items:center; gap:.6vw; padding:.4vh .5vw .4vh 1vw; border-radius:999px; background:rgba(20,20,26,.92); box-shadow:0 0 0 2px #2a2a32; font:900 min(1.8vh,1vw) var(--fb); }
  .rank b { font:400 min(3vh,1.7vw) var(--fl); margin-right:.4vw; }
  .xp { position:relative; width:min(22vh,12vw); height:min(3.2vh,1.8vw); border-radius:999px; background:#1a2a10; overflow:hidden; display:grid; place-items:center; font:400 min(1.8vh,1vw) var(--fl); }
  .xp i { position:absolute; inset:0 auto 0 0; width:var(--v); background:linear-gradient(180deg,#9aff5a,#3ad01a); transition:width 1s cubic-bezier(.2,.9,.3,1); }
  .xp span { position:relative; text-shadow:0 1px 2px #000; }
  .chal { width:min(30vh,17vw); padding:.8vh .8vw; border-radius:12px; background:rgba(20,20,26,.92); box-shadow:0 0 0 2px #2a2a32; }
  .chal h4 { display:flex; align-items:center; gap:.5vw; font:900 min(1.7vh,.95vw) var(--fb); padding:.3vh .6vw; border-radius:6px; background:#2a2a32; }
  .chal h4::before { content:""; width:min(1.6vh,.9vw); aspect-ratio:1; background:var(--c); clip-path:polygon(0 0,100% 50%,0 100%); }
  .chal .row { display:flex; align-items:center; gap:.6vw; margin-top:.8vh; }
  .chal .row svg { width:min(3.4vh,1.9vw); }
  .chal .bar { flex:1; position:relative; height:min(3vh,1.7vw); border-radius:6px; background:#121216; overflow:hidden; display:grid; place-items:center; font:400 min(2vh,1.1vw) var(--fl); }
  .chal .bar i { position:absolute; inset:0 auto 0 0; width:var(--v); background:repeating-linear-gradient(-45deg,var(--c) 0 8px,color-mix(in srgb,var(--c) 70%,#000) 8px 16px); transition:width 1s; }
  .chal .bar span { position:relative; text-shadow:0 1px 3px #000; }

  /* ---------- right: rule + stages ---------- */
  .rule { position:fixed; z-index:6; right:2vw; top:44vh; width:min(30vw,50vh); padding:1.4vh 1vw 1.4vh; border-radius:14px; background:var(--panel); box-shadow:0 0 0 2px #2a2a32, 0 12px 30px rgba(0,0,0,.6); }
  .rule .hd { display:flex; align-items:center; justify-content:space-between; font:900 min(1.7vh,.95vw) var(--fb); }
  .rule .hd span:last-child { padding:.2vh .8vw; border-radius:999px; background:#2a2a32; }
  .rule .rn { margin:.6vh 0 1vh; font:400 min(3.4vh,1.9vw) var(--fd); background:linear-gradient(transparent 62%,color-mix(in srgb,var(--c) 70%,transparent) 62% 90%,transparent 90%); display:inline-block; padding:0 .4vw; }
  .rule .lb { font:900 min(1.6vh,.9vw) var(--fb); color:#ccc; margin:.4vh 0 .6vh; }
  .stage { all:unset; box-sizing:border-box; cursor:pointer; display:grid; grid-template-columns:min(13vh,7.4vw) minmax(0,1fr); align-items:center; gap:.8vw; width:100%; padding:.5vh .4vw; border-radius:10px; }
  .stage + .stage { margin-top:.6vh; } .stage:hover, .stage:focus-visible { background:#24242c; outline:0; }
  .stage canvas { width:100%; aspect-ratio:16/9; border-radius:6px; display:block; box-shadow:0 0 0 2px #121216; }
  .stage b { display:block; font:900 min(1.9vh,1.05vw) var(--fb); } .stage small { display:block; font:700 min(1.5vh,.85vw) var(--fb); color:#aaa; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ---------- overlays ---------- */
  .ov { position:fixed; inset:0; z-index:20; display:none; }
  .ov.show { display:block; animation:fadeIn .25s both; }
  .ov .bg { position:absolute; inset:0; background:rgba(5,5,8,.82); backdrop-filter:blur(6px); }

  /* history (recent battles style) */
  .hist { position:absolute; inset:64px 3vw 7vh; display:grid; grid-template-columns:minmax(0,.95fr) minmax(0,1.25fr); gap:2vw; }
  .hl { display:flex; flex-direction:column; gap:1vh; min-height:0; }
  .hsum { display:flex; align-items:center; justify-content:space-between; padding:1vh 1.6vw; border-radius:12px; background:var(--panel); box-shadow:0 0 0 2px #2a2a32; font:900 min(2vh,1.1vw) var(--fb); }
  .hsum b { font:400 min(4.4vh,2.4vw)/1 var(--fl); } .hsum .w b { color:var(--c); } .hsum small { display:block; font:400 min(1.4vh,.8vw) var(--fl); color:#aaa; text-align:center; }
  .hlist { flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; gap:.9vh; list-style:none; padding:.4vh .4vw; }
  .hr { all:unset; box-sizing:border-box; cursor:pointer; width:100%; display:grid; grid-template-columns:min(15vh,8.4vw) 1fr auto; align-items:center; gap:1vw; padding:.6vh 1vw .6vh .6vw; border-radius:12px; background:rgba(40,40,48,.95); transition:transform .12s; }
  .hr .res { text-align:center; padding:.5vh 0; border-radius:8px; font:400 min(2.6vh,1.45vw) var(--fl); letter-spacing:.04em; background:#4a4a54; color:#ddd; }
  .hr.win .res { background:var(--c); color:#111; }
  .hr b { display:block; font:900 min(1.8vh,1vw) var(--fb); color:#ddd; } .hr span { font:400 min(2.2vh,1.2vw) var(--fl); }
  .hr .mi { width:min(3.4vh,1.9vw); aspect-ratio:1; border-radius:50%; background:var(--mc,#444); box-shadow:0 0 0 2px #111; }
  .hr.cur { box-shadow:0 0 0 3px #fff, 0 0 0 6px #ff2fa8, 0 0 16px #19e0ff; transform:translateX(.6vw); }
  .hd2 { display:flex; flex-direction:column; min-height:0; border-radius:14px; overflow:hidden; background:var(--panel); box-shadow:0 0 0 2px #2a2a32; }
  .hd2 .img { position:relative; height:28%; min-height:90px; } .hd2 .img canvas { width:100%; height:100%; display:block; object-fit:cover; }
  .hd2 .img .t { position:absolute; left:1vw; top:1vh; display:flex; flex-direction:column; gap:.4vh; }
  .hd2 .img .t span { align-self:flex-start; padding:.2vh .8vw; background:#111; font:900 min(1.6vh,.9vw) var(--fb); }
  .hd2 .img .t b { align-self:flex-start; padding:.3vh 1vw; background:#fff; color:#111; font:400 min(2.6vh,1.45vw) var(--fd); }
  .hd2 .in { flex:1; min-height:0; overflow:auto; padding:1.4vh 1.4vw; display:flex; flex-direction:column; gap:1.2vh; }
  .tbar { display:flex; height:min(4vh,2.2vw); border-radius:999px; overflow:hidden; box-shadow:0 0 0 2px #111; font:400 min(2vh,1.1vw) var(--fl); }
  .tbar i { display:flex; align-items:center; padding:0 1vw; font-style:normal; } .tbar .m { background:var(--c); color:#111; } .tbar .e { flex:1; justify-content:flex-end; background:var(--enemy); }
  .team { border-radius:12px; overflow:hidden; box-shadow:0 0 0 3px var(--c); }
  .team .th { display:flex; justify-content:space-between; padding:.6vh 1vw; background:var(--c); color:#111; font:400 min(2.4vh,1.35vw) var(--fl); }
  .team .tr { display:grid; grid-template-columns:1fr auto; padding:.6vh 1vw; font:900 min(1.8vh,1vw) var(--fb); border-top:1px solid #2a2a32; } .team .tr span:last-child { font:400 min(2.2vh,1.2vw) var(--fl); }
  .htext { padding:1vh 1vw; border-radius:10px; background:#121216; font:700 min(1.9vh,1.05vw)/1.75 var(--fb); white-space:pre-wrap; word-break:break-all; }
  .ofoot { position:absolute; left:3vw; bottom:1.4vh; display:flex; gap:1vw; font:900 min(1.7vh,.95vw) var(--fb); }
  .ofoot button { all:unset; cursor:pointer; display:flex; align-items:center; gap:.5vw; padding:.3vh .9vw .3vh .3vw; border-radius:999px; background:rgba(20,20,26,.92); box-shadow:0 0 0 2px #2a2a32; }
  .ofoot i { font-style:normal; display:grid; place-items:center; width:min(2.8vh,1.6vw); aspect-ratio:1; border-radius:50%; background:#fff; color:#111; font:400 min(1.6vh,.9vw) var(--fl); }
  .ofoot button:hover, .ofoot button:focus-visible { box-shadow:0 0 0 2px var(--c); outline:0; }

  /* calendar */
  .calw { position:absolute; left:50%; top:50%; translate:-50% -50%; width:min(92vw,720px); padding:2vh 1.6vw 2.4vh; border-radius:18px; background:var(--panel); box-shadow:0 0 0 2px #2a2a32, 0 0 0 6px var(--c), 0 20px 40px rgba(0,0,0,.6); }
  .calw h3 { display:flex; align-items:center; justify-content:space-between; font:400 min(4vh,26px) var(--fd); margin-bottom:1.4vh; }
  .calw h3 button { all:unset; cursor:pointer; width:40px; text-align:center; border-radius:10px; background:#2a2a32; font:400 22px var(--fl); } .calw h3 button:hover, .calw h3 button:focus-visible { background:var(--c); color:#111; outline:0; }
  .cg { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cg span { text-align:center; font:900 12px var(--fb); color:#999; }
  .cd { all:unset; box-sizing:border-box; cursor:pointer; position:relative; aspect-ratio:1; border-radius:10px; background:#1c1c22; overflow:hidden; }
  .cd canvas { position:absolute; inset:0; width:100%; height:100%; }
  .cd b { position:absolute; left:8%; top:4%; font:400 min(2.4vh,17px) var(--fl); text-shadow:0 1px 3px #000; }
  .cd.out { opacity:.3; } .cd.fut { opacity:.35; cursor:default; } .cd.today { box-shadow:0 0 0 3px #fff; } .cd:not(.fut):hover { box-shadow:0 0 0 3px var(--c); } .cd:focus-visible { outline:3px solid var(--c); }

  /* あいぼう profile */
  .prof { position:absolute; inset:64px 3vw 7vh; display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.2fr); gap:2vw; }
  .pl { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1vh; min-height:0; border-radius:16px; background:radial-gradient(ellipse at 50% 70%,#2a2a32,#121216 70%); box-shadow:0 0 0 2px #2a2a32; padding:2vh 1vw; }
  .pl svg { width:min(100%,48vh); flex:1; min-height:0; overflow:visible; animation:bobS 3.2s ease-in-out infinite; }
  @keyframes bobS { 50% { transform:translateY(-1vh); } }
  .plate { align-self:stretch; position:relative; padding:1vh 1.4vw; border-radius:10px; overflow:hidden; color:#111; background:repeating-linear-gradient(-45deg,var(--pc) 0 14px,color-mix(in srgb,var(--pc) 80%,#fff) 14px 28px); box-shadow:0 0 0 3px #111; }

// ---------- SE: everything synthesized with WebAudio (wet squelches, bubbly UI blips, an original win jingle) ----------
const SE = (() => {

  const gap = (id, ms) => { const t = performance.now(); if (last[id] && t - last[id] < ms) return false; last[id] = t; return true; };
  const out = (node, w) => { node.connect(master); if (w) { const g = ac.createGain(); g.gain.value = w; node.connect(g); g.connect(wet); } };

  function inkHit(p = 1, v = 1, t = 0) {
    const r = .8 + Math.random() * .5;
    noise({ t, d: .07 + Math.random() * .08, v: .32 * v, f0: 2600 * r * p, f1: 260 * r, q: 2.4, w: .35 });

    // L/R mode swap: whoosh + bloop pitched per mode + squish
    swap(i = 0) { if (!ready()) return; const p = [1, 1.19, 1.33, 1.5][i % 4];

let wasLead = false, data = load(), mode = 0, hpage = 0, hcur = 0, calSel = ymd(new Date()), selected = null, mood = null, busy = false, lastLen = 0, clkT;

function streakAt(k) { let n = 0; const d = new Date(k + "T00:00:00"); while (data[ymd(d)]) { n++; d.setDate(d.getDate() - 1); } return n; }
function streakCount() { const d = new Date(); if (!data[ymd(d)]) d.setDate(d.getDate() - 1); return streakAt(ymd(d)); }
function totalXp() {
  let xp = 0, run = 0, prev = null;
  for (const k of Object.keys(data).sort()) {
    const c = new Date(k + "T00:00:00");
    run = prev && (c - prev) / 864e5 === 1 ? run + 1 : 1;
    xp += XP_PER + Math.min(run, 30) * XP_BONUS_PER_STREAK;
    prev = c;
  }
  return xp;
}
const rank = () => Math.floor(totalXp() / XP_PER_RANK) + 1;

  for (let i = 0; i < weeks * 7; i++) { const d = new Date(start); d.setDate(start.getDate() + i); const k = ymd(d), fut = k > today;
    h += `<button class="cd ${d.getMonth() !== m ? "out" : ""} ${fut ? "fut" : ""} ${k === today ? "today" : ""}" ${fut ? "disabled" : `data-go="${k}"`} aria-label="${md(k)}${data[k] ? (match(k).win ? " WIN" : " LOSE") : ""}">${data[k] ? `<canvas width="80" height="80" data-cell="${k}"></canvas><i class="wl ${match(k).win ? "w" : ""}">${match(k).win ? "WIN" : "LOSE"}</i>` : ""}<b>${d.getDate()}</b></button>`; }
  $("cg").innerHTML = h;
  document.querySelectorAll("[data-cell]").forEach(cv => { const c = cv.getContext("2d"), R = rnd(seedOf(cv.dataset.cell)); const kk = cv.dataset.cell, m = match(kk), cols = teamCols(data[kk].mood); splat(c, 40 + (R() - .5) * 10, 40, 16 + Math.min(10, m.len / 20), cols[m.win ? 0 : 1], R); });
  $("cal").classList.add("show");
}

// ---------- editor ----------
function setMood(m) { mood = m; document.querySelectorAll("#moods button").forEach(b => b.classList.toggle("on", b.dataset.m === mood)); if ($("ed").classList.contains("show")) updPts(); }
function updPts() {
  const len = $("body").value.trim().length; $("ePts").innerHTML = `${pad(len, 4)}<small>p</small>`;
  const sp = $("eSp"); sp.style.setProperty("--v", `${Math.min(len / GOAL, 1) * 100}%`); if (len >= GOAL && !sp.classList.contains("full") && $("ed").classList.contains("show")) SE.special(); sp.classList.toggle("full", len >= GOAL);
  // live turf meter vs today's opponent

  ed.style.setProperty("--tm", cols[0]); ed.style.setProperty("--te", cols[1]);
  $("emM").style.width = `${m.me}%`; $("emE").style.width = `${m.en}%`;
  $("emMe").textContent = `${m.me.toFixed(1)}%`; $("emEn").textContent = `${m.en.toFixed(1)}%`;
  const h = $("emHint"), lead = len > 0 && m.win; h.classList.toggle("lead", lead);

  if (lead && !wasLead && ed.classList.contains("show")) SE.lead(); wasLead = lead;
  // team icons: opponents get splatted as you close in
  const down = len ? (lead ? 4 : Math.min(3, Math.floor(len / need * 4))) : 0, mine = lead ? 0 : Math.max(0, 2 - Math.floor(len / need * 3));
  const drop = '<svg viewBox="0 0 20 24"><path d="M10 1s8 9 8 14a8 8 0 0 1-16 0C2 10 10 1 10 1z" fill="#111" opacity=".6"/></svg>';
  $("tMe").innerHTML = [0, 1, 2, 3].map(i => `<i class="${i >= 4 - mine ? "x" : ""}" style="--tc:${cols[0]}">${drop}</i>`).join("");
  $("tEn").innerHTML = [0, 1, 2, 3].map(i => `<i class="${i < down ? "x" : ""}" style="--tc:${cols[1]}">${drop}</i>`).join("");
}
function openEd(k) {
  if (busy || k > ymd(new Date())) return;
  closeAll(); selected = k; const e = data[k]; mood = e ? e.mood : null;
  $("eT").textContent = k === ymd(new Date()) ? "きょうの ナワバリ" : `${md(k)} の ナワバリ`; $("eS").textContent = `${e ? "リベンジ" : "バトル開始！"} ／ あいて：${score(k, 0).tier}`;
  $("eDay").textContent = md(k);
  $("moods").innerHTML = MOODS.map(m => `<li><button data-m="${m}" class="${m === mood ? "on" : ""}" style="--mc:${MC[m]}"><i></i>${m}</button></li>`).join("");
  $("body").value = e ? e.text : ""; lastLen = $("body").value.trim().length; wasLead = !!(e && match(k).win); updPts();
  const cv = $("paint"); cv.width = innerWidth; cv.height = innerHeight; cv.getContext("2d").clearRect(0, 0, cv.width, cv.height);
  $("ed").classList.add("show"); setTimeout(() => $("body").focus(), 30);
  const tick = () => { const d = new Date(); $("eClk").textContent = `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`; }; tick(); clearInterval(clkT); clkT = setInterval(tick, 10000);
}
$("body").addEventListener("input", () => {
  const len = $("body").value.trim().length, delta = len - lastLen; lastLen = len; updPts();
  if (delta > 0) SE.splat(delta);
  if (delta <= 0 || reduced) return;
  const cv = $("paint"), c = cv.getContext("2d"), R = Math.random, win = document.querySelector(".ewin").getBoundingClientRect();
  for (let i = 0; i < Math.min(delta, 4); i++) {
    // splat somewhere around the editor window, mostly outside it
    const side = Math.floor(R() * 4), x = side === 0 ? win.left - R() * 160 : side === 1 ? win.right + R() * 160 : win.left + R() * win.width, y = side === 2 ? win.top - R() * 100 : side === 3 ? win.bottom + R() * 100 : win.top + R() * win.height;
    splat(c, x, y, 10 + R() * 26, mood ? MC[mood] : MODES[mode].c, R);
  }
  const p = document.createElement("span"); p.className = "plus"; p.textContent = `+${delta}`; p.style.left = `${win.left + 20 + Math.random() * (win.width - 60)}px`; p.style.top = `${win.top - 14 - Math.random() * 30}px`; $("ed").appendChild(p); setTimeout(() => p.remove(), 850);
});
const closeEd = (snd = true) => { if (snd) SE.back(); $("ed").classList.remove("show"); clearInterval(clkT); };

// ---------- results ----------
async function save() {
  const text = $("body").value.trim(); if (!text) { $("body").focus(); return; }
  if (busy) return; busy = true;
  const p0 = profile(), k = selected, isNew = !data[k], prev = match(k), xp0 = totalXp(), r0 = rank(), best0 = bestStreak(), long0 = Object.values(data).reduce((m, x) => Math.max(m, x.text.length), 0), rec0 = record();
  data[k] = { mood, text }; store(data); closeEd(false); SE.finish();
  const m = match(k), cols = teamCols(mood), rec = record();
  const res = $("res"); res.style.setProperty("--c", cols[0]); res.style.setProperty("--enemy", cols[1]);
  res.classList.add("show"); $("stamp").classList.remove("on", "lose"); $("rk").classList.remove("on"); $("rNext").classList.remove("on"); $("awards").innerHTML = "";
  const jb = $("jbar"); jb.style.setProperty("--m", "0%"); jb.style.setProperty("--e", "0%"); $("jM").textContent = $("jE").textContent = "0.0%"; $("jMp").textContent = $("jEp").textContent = "";
  $("jEnL").textContent = `あいてチーム（${m.tier}）`;
  // paint the arena: both teams' ink lands in proportion to the final turf
  const cv = $("map"), c = cv.getContext("2d"), W = cv.width, H = cv.height, R = rnd(seedOf(k) + 7);
  const floor = drawArena(c, W, H, R), jobs = turfJobs(k, m, W, H, cols, 72);
  drawBases(c, W, H, cols);
  c.save(); c.clip(floor);
  const t0 = performance.now(), dur = reduced ? 1 : 1700;
  await new Promise(done => { let idx = 0; const step = t => { const target = Math.floor(Math.min((t - t0) / dur, 1) * jobs.length); if (idx < target) SE.paint(); while (idx < target) paintCell(c, jobs[idx++]); if (idx < jobs.length) requestAnimationFrame(step); else done(); }; requestAnimationFrame(step); });
  // settle into the outlined final render
  c.restore(); drawArena(c, W, H, rnd(seedOf(k) + 7)); c.save(); c.clip(floor); paintTurf(c, jobs); c.restore(); drawBases(c, W, H, cols);
  // judge
  await sleep(300);
  SE.judge(); jb.style.setProperty("--m", `${Math.max(m.me, 14)}%`); jb.style.setProperty("--e", `${Math.max(m.en, 14)}%`);
  const cnt = (el, to, suf) => { const s = performance.now(); const f = t => { const q = Math.min((t - s) / 1300, 1); el.textContent = (to * q).toFixed(1) + suf; if (q < 1 && !reduced) requestAnimationFrame(f); else el.textContent = to.toFixed(1) + suf; }; requestAnimationFrame(f); };
  jb.querySelector(".e").classList.remove("zero"); cnt($("jM"), m.me, "%"); cnt($("jE"), m.en, "%"); $("jMp").textContent = `${m.len}p`; $("jEp").textContent = m.tier;
  await sleep(1500);
  const st = $("stamp"); st.textContent = m.win ? "WIN!" : "LOSE..."; st.classList.toggle("lose", !m.win); st.classList.add("on"); SE.stamp(); setTimeout(() => m.win ? SE.win() : SE.lose(), 120);
  await sleep(500);
  // rank (XP is the shared diary rule: every saved day counts, win or lose) + record
  const xp1 = totalXp(); $("rRank").textContent = rank(); $("rXpB").style.setProperty("--v", `${xp0 % XP_PER_RANK / XP_PER_RANK * 100}%`); $("rXp").textContent = `${xp1 % XP_PER_RANK}/${XP_PER_RANK}`;
  $("rGain").textContent = isNew ? `+${xp1 - xp0} けいけんち ／ ${streakCount()}日 れんぞく` : "書きなおした！（けいけんちは そのまま）";
  $("rRec").textContent = `せんせき ${rec.w}勝 ${rec.l}敗${rec.cur >= 2 ? ` ／ ${rec.cur}連勝中！` : ""}`;
  $("rk").classList.add("on"); SE.xp(); if (rank() > r0) setTimeout(() => SE.rankUp(), 600); setTimeout(() => $("rXpB").style.setProperty("--v", `${rank() > r0 ? 100 : xp1 % XP_PER_RANK / XP_PER_RANK * 100}%`), 200);
  $("rUp").classList.toggle("on", rank() > r0); $("rUp").textContent = `ランクアップ！ ${rank()}`;
  const aw = [], p1 = profile();
  if (p1.stage > p0.stage) aw.push(`あいぼうが「${STAGES[p1.stage]}」に そだった！`);
  else if (p1.stage >= 2 && p1.wpn !== p0.wpn) aw.push(`あいぼうの ブキが ${WPN[p1.wpn].nm} に！`);
  else if (p1.title !== p0.title) aw.push(`二つ名「${p1.title}」`);
  if (m.win && prev && !prev.win) aw.push("リベンジ せいこう！");
  if (m.win && rec.cur >= 2) aw.push(`${rec.cur}連勝！`);
  if (m.win && m.me - m.en >= 25) aw.push("あっしょう！");
  if (m.win && m.me - m.en < 3) aw.push("ギリギリの しょうり");
  if (!m.win && m.en - m.me < 3) aw.push("おしい！ きっこう");
  if (!m.win) aw.push(`あと ${needFor(k) - m.len}p で WIN だった`);
  if (rec.best > rec0.best && rec.best >= 2) aw.push(`${rec.best}連勝 自己ベスト`);
  if (text.length > long0 && long0 && isNew) aw.push("ぬりポイント 自己ベスト");
  if (bestStreak() > best0 && best0) aw.push(`れんぞく ${bestStreak()}日 自己ベスト`);
  if (text.length >= GOAL) aw.push("スペシャル はつどう！");

  $("awards").innerHTML = aw.slice(0, 3).map(t => `<div class="aw"><i></i>${t}</div>`).join("");
  let ai = 0; for (const el of $("awards").children) { await sleep(rank() > r0 && !ai ? 900 : 260); el.classList.add("on"); SE.award(ai++); }
  await sleep(300); $("rNext").classList.add("on"); $("rOk").focus();
}
function closeRes() { SE.ok(); $("res").classList.remove("show"); busy = false; render(); }

// ---------- input ----------
function closeAll(snd) { if (snd) SE.back(); ["hist", "cal", "prof"].forEach(id => $(id).classList.remove("show")); if (document.activeElement && document.activeElement.closest(".ov")) document.activeElement.blur(); }
document.addEventListener("click", e => {
  if ($("res").classList.contains("show")) { if (e.target.closest("#rOk") && $("rNext").classList.contains("on")) closeRes(); return; }
  if (busy) return;
  if (e.target.closest("#bSe")) return toggleSe();
  const tb = e.target.closest(".tab"); if (tb) { mode = +tb.dataset.m; SE.swap(mode); return render(true); }
  if (e.target.closest("#card") || e.target.closest("#bGo")) return act();
  if (e.target.closest("#bSwap")) return swapMode(1);
  if (e.target.closest("#bBack")) { SE.back(); location.href = "index.html"; return; }
  if (e.target.closest("#tank")) { SE.glug(); return openProf(); }
  if (e.target.closest("#pWrite")) { SE.ok(); return openEd(ymd(new Date())); }
  const sg = e.target.closest(".stage"); if (sg) { SE.ok(); return openEd(sg.dataset.k); }
  const hr = e.target.closest(".hr"); if (hr) { hcur = +hr.dataset.h; SE.move(); return renderHist(); }
  if (e.target.closest("#hWrite")) { SE.ok(); return openEd(hKey(hcur)); }
  if (e.target.closest("#hOlder")) { if (hpage < hPages() - 1) { hpage++; hcur = 0; SE.page(); renderHist(); } return; }
  if (e.target.closest("#hNewer")) { if (hpage) { hpage--; hcur = 0; SE.page(); renderHist(); } return; }
  const cd = e.target.closest("[data-go]"); if (cd) { SE.ok(); return openEd(cd.dataset.go); }
  if (e.target.closest("#cPrev") || e.target.closest("#cNext")) SE.page();
  if (e.target.closest("#cPrev")) { const d = new Date(calSel + "T00:00:00"); d.setDate(1); d.setMonth(d.getMonth() - 1); calSel = ymd(d); return openCal(); }
  if (e.target.closest("#cNext")) { const d = new Date(calSel + "T00:00:00"); d.setDate(1); d.setMonth(d.getMonth() + 1); calSel = ymd(d) > ymd(new Date()) ? ymd(new Date()) : ymd(d); return openCal(); }
  const mb = e.target.closest("#moods button"); if (mb) { if (mood !== mb.dataset.m) SE.mood(MOODS.indexOf(mb.dataset.m)); else SE.back(); return setMood(mood === mb.dataset.m ? null : mb.dataset.m); }
  if (e.target.closest("#save")) return save();
  if (e.target.closest("#cl")) return closeEd();
  if (e.target.closest("[data-close]")) return closeAll(true);
});
document.addEventListener("dblclick", e => { const hr = e.target.closest(".hr"); if (hr) { SE.ok(); openEd(hKey(+hr.dataset.h)); } });
document.addEventListener("keydown", e => {
  const k = e.key, K = k.toLowerCase(), edOpen = $("ed").classList.contains("show"), hOpen = $("hist").classList.contains("show"), cOpen = $("cal").classList.contains("show"), pOpen = $("prof").classList.contains("show");
  if ($("res").classList.contains("show")) { if ((k === "Enter" || k === " " || K === "a" || k === "Escape") && $("rNext").classList.contains("on")) { e.preventDefault(); closeRes(); } return; }
  if (busy) return;
  if (edOpen) {
    if ((e.ctrlKey || e.metaKey) && k === "Enter") { e.preventDefault(); return save(); }
    if (k === "Escape") return closeEd();
    if (e.target.tagName !== "TEXTAREA" && (k === "ArrowLeft" || k === "ArrowRight")) { e.preventDefault(); const dir = k === "ArrowRight" ? 1 : -1, i = MOODS.indexOf(mood);
      setMood(MOODS[i < 0 ? (dir > 0 ? 0 : 4) : (i + dir + 5) % 5]); SE.mood(MOODS.indexOf(mood)); document.querySelector(`#moods button[data-m="${mood}"]`).focus(); }
    return;
  }
  const enter = (k === "Enter" || k === " " || K === "a") && e.target.tagName !== "BUTTON";
  if (hOpen) {
    if (k === "Escape" || K === "b") return closeAll(true);
    if (k === "ArrowUp" && hcur > 0) { e.preventDefault(); hcur--; SE.move(); return renderHist(); }
    if (k === "ArrowDown") { e.preventDefault(); if (hcur < hCount() - 1) { hcur++; SE.move(); } else if (hpage < hPages() - 1) { hpage++; hcur = 0; SE.page(); } return renderHist(); }
    if (k === "ArrowRight" || K === "r" || K === "e") { e.preventDefault(); if (hpage < hPages() - 1) { hpage++; hcur = 0; SE.page(); renderHist(); } return; }
    if ((k === "ArrowLeft" || K === "l" || K === "q") && hpage) { e.preventDefault(); hpage--; hcur = 0; SE.page(); return renderHist(); }
    if (enter) { e.preventDefault(); SE.ok(); return openEd(hKey(hcur)); }
    return;
  }
  if (pOpen) {
    if (k === "Escape" || K === "b") return closeAll(true);
    if (enter) { e.preventDefault(); SE.ok(); return openEd(ymd(new Date())); }
    return;
  }
  if (cOpen) {
    if (k === "Escape" || K === "b") return closeAll(true);
    const mv = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[k];
    if (mv) { e.preventDefault(); const d = new Date(calSel + "T00:00:00"); d.setDate(d.getDate() + mv); if (ymd(d) <= ymd(new Date())) { calSel = ymd(d); SE.move(); openCal(); document.querySelector(`[data-go="${calSel}"]`)?.focus(); } return; }
    return;
  }
  if (k === "ArrowLeft" || K === "l" || K === "q") { e.preventDefault(); return swapMode(-1); }
  if (k === "ArrowRight" || K === "r" || K === "e") { e.preventDefault(); return swapMode(1); }
  if (K === "m") return toggleSe();
  if (K === "y") { SE.move(); const el = $("ruleD"); el.style.color = "#fff"; setTimeout(() => el.style.color = "", 800); return; }
  if (enter) { e.preventDefault(); return act(); }
});

function toggleSe() { const v = SE.toggle(); $("bSe").classList.toggle("off", !v); $("bSe").setAttribute("aria-pressed", v); $("seL").textContent = v ? "SE ON" : "SE OFF"; }
// cursor blip when the pointer moves onto a new selectable thing
let hovEl = null;
document.addEventListener("mouseover", e => { const el = e.target.closest(".tab, .card, .stage, .hr, .cd:not(.fut), #moods button, .hintL button, .ofoot button, .go, .cl, #tank"); if (el && el !== hovEl) SE.hover(); hovEl = el; });
$("bSe").classList.toggle("off", !SE.on); $("bSe").setAttribute("aria-pressed", SE.on); $("seL").textContent = SE.on ? "SE ON" : "SE OFF";

buildWall();
render();
</script>
