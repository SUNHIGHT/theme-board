<script>
const KEY = "diary-shared-v1";
const LEGACY = ["persona-diary-v1", "persona3-diary-v1"];
const MOODS = [["最高", "☀️"], ["良い", "🌤️"], ["普通", "☁️"], ["微妙", "🌧️"], ["最悪", "⛈️"]];
const MENU = [["コンテナ", "log", "📦"], ["レシピ発想", "write", "💡"], ["出来事", "cal", "📅"], ["ステータス", "stat", "📊"], ["依頼・ウワサ", "quest", "📜"], ["図鑑", "book", "📖"], ["設定", "opt", "⚙️"]];
const TITLES = ["見習いの錬金術士", "不思議の錬金術士", "一人前の錬金術士", "名高い錬金術士", "伝説の錬金術士"];
const MS = [3, 7, 14, 30, 60, 100];
const XP_PER = 100, XP_BONUS_PER_STREAK = 10, XP_PER_RANK = 300;
const DOW = ["日","月","火","水","木","金","土"];
const $ = id => document.getElementById(id);
const load = () => {
  try {
    let d = JSON.parse(localStorage.getItem(KEY));
    if (!d) { d = {}; for (const k of LEGACY) { const o = JSON.parse(localStorage.getItem(k) || "{}"); for (const day in o) if (!d[day]) d[day] = o[day]; } }
    return d;
  } catch { return {}; }
};
const store = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shift = (k, n) => { const d = new Date(k + "T00:00:00"); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const dl = k => { const d = new Date(k + "T00:00:00"); return `${d.getMonth()+1}/${d.getDate()}（${DOW[d.getDay()]}）`; };

let data = load(), view = "write", selected = today(), mood = null, draft = null, logPage = 0, logSel = 0, ovTimer, flipNext = true;
function streakAt(k) { let n = 0, c = k; while (data[c]) { n++; c = shift(c, -1); } return n; }
function streakCount() { const t = today(); return streakAt(data[t] ? t : shift(t, -1)); }
function totalXp() {
  let xp = 0, run = 0, prev = null;
  for (const k of Object.keys(data).sort()) {
    const c = new Date(k + "T00:00:00");
    run = prev && (c - prev) / 864e5 === 1 ? run + 1 : 1;
    xp += XP_PER + Math.min(run, 30) * XP_BONUS_PER_STREAK;
    prev = c;
  }
  return xp;
}
const keysDesc = () => Object.keys(data).sort().reverse();
const moodIc = m => (MOODS.find(x => x[0] === m) || [, "✨"])[1];

// clock
(() => {
  let h = `<circle cx="56" cy="56" r="52" fill="#b8862a" stroke="#6b3b22" stroke-width="4"/><circle cx="56" cy="56" r="44" fill="#fff6dc" stroke="#8a5a22" stroke-width="2"/>`;
  [12, 3, 6, 9].forEach((n, i) => { const a = i * Math.PI / 2 - Math.PI / 2; h += `<text x="${56 + Math.cos(a) * 33}" y="${60 + Math.sin(a) * 33}" font-size="14" font-weight="800" text-anchor="middle" fill="#5a2a1a" font-family="serif">${n}</text>`; });
  h += `<line id="hh" x1="56" y1="56" x2="56" y2="36" stroke="#3a1a10" stroke-width="4" stroke-linecap="round"/><line id="mm" x1="56" y1="56" x2="56" y2="26" stroke="#c0302a" stroke-width="2.5" stroke-linecap="round"/><circle cx="56" cy="56" r="4" fill="#3a1a10"/>`;
  $("clk").innerHTML = h;
  const tick = () => { const n = new Date(); $("hh").setAttribute("transform", `rotate(${(n.getHours() % 12 + n.getMinutes() / 60) * 30} 56 56)`); $("mm").setAttribute("transform", `rotate(${n.getMinutes() * 6} 56 56)`); };
  tick(); setInterval(tick, 20000);
})();

function leftPage() {
  const xp = totalXp(), lv = Math.floor(xp / XP_PER_RANK) + 1, st = streakCount(), into = xp % XP_PER_RANK, all = Object.keys(data), ch = all.reduce((s, k) => s + data[k].text.length, 0);
  const d = new Date(selected + "T00:00:00"), e = data[selected];
  const tl = TITLES[Math.min(Math.floor((lv - 1) / 3), TITLES.length - 1)];
  let msg = e ? `${dl(selected)}の日記は書けているよ。いいかんじ♪` : selected === today() ? "今日はまだ日記を書いていないみたい…。何があったのか、教えてくれる？" : "この日の日記は空っぽみたい。思い出して書いてみようか。";
  if (st >= 7) msg = `${st}日も連続で書いているの？ すごいね、錬金術の腕もあがりそう!`;
  let oval;
  if (view === "log") { const en = data[selected]; oval = `<div class="oval"><div class="tx">${en ? esc(en.text) : "記録がありません"}</div></div>`; }
  else if (view === "cal") { const n = new Date(); oval = `<div class="oval"><div class="n">${n.getMonth() + 1}<small>月</small></div><div class="d">${n.getFullYear()}</div></div>`; }
  else oval = `<div class="oval"><div class="d">${d.getFullYear()}</div><div class="n">${d.getDate()}<small>日</small></div><div class="d">${d.getMonth() + 1}月 ${DOW[d.getDay()]}曜日</div><div class="m">${e ? moodIc(e.mood) : "✨"}</div></div>`;
  return `<div class="tab">${view === "log" ? "記録" : view === "cal" ? "カレンダー" : dl(selected)}</div>${oval}
    <div class="memo"><div><span>Lv</span><b>${lv}</b></div><div><span>HP</span><b>${st}/30</b></div><div><span>MP</span><b>${ch}</b></div><div><span>LP</span><b>${all.length}</b></div><div><span>錬金Lv</span><b>${Math.floor(xp / 60)}</b></div></div>
    <div class="low"><div class="coin"><i></i>${xp}</div><div class="ttp">${tl}</div><div class="gg"><div style="width:${into / XP_PER_RANK * 100}%"></div></div></div>
    <div class="bub"><span class="fc">✿</span>${esc(msg)}</div>`;
}
function cardHtml(k, i, on) {
  const en = data[k]; return `<button class="mc ${on ? "on" : ""}" data-k="${k}" data-i="${i}" style="--i:${i}"><span class="nm">${dl(k)}</span><span class="ex">${esc(en.text.replace(/\s+/g, " "))}</span>
    <div class="r"><span>調子</span><b>${esc(en.mood || "-")}</b></div><div class="r"><span>文字数</span><b>${en.text.length}</b></div><div class="r"><span>連続</span><b>${streakAt(k)}</b></div></button>`;
}
function rightPage() {
  const now = new Date();
  if (view === "write") {
    const e = data[selected]; if (mood === null && e && draft === null) mood = e.mood;
    return `<ul class="moods">${MOODS.map(([m, ic]) => `<li><button class="mt ${m === mood ? "on" : ""}" data-m="${m}">${ic} ${m}</button></li>`).join("")}</ul>
      <div class="paper"><textarea id="ta" placeholder="今日はどんな一日だった？">${esc(draft !== null ? draft : (e ? e.text : ""))}</textarea></div>
      <div class="acts"><button class="save" id="save">調合する</button><input type="date" class="dt" id="dt" value="${selected}" max="${today()}"><span class="hint">${selected === today() ? "" : "過去の日付を編集中"}</span></div>`;
  }
  if (view === "log") {
    const ks = keysDesc(), pages = Math.max(1, Math.ceil(ks.length / 3)); logPage = Math.min(logPage, pages - 1);
    const slice = ks.slice(logPage * 3, logPage * 3 + 3);
    return `<div class="cards">${slice.length ? slice.map((k, i) => cardHtml(k, i, k === selected)).join("") : `<div class="row">まだ記録がありません</div>`}</div>
      <div class="pgn"><button id="pp">◀</button>${logPage + 1} / ${pages}<button id="pn">▶</button><button id="edit">編集する</button></div>`;
  }
  if (view === "cal") {
    const y = now.getFullYear(), mo = now.getMonth(), first = new Date(y, mo, 1).getDay(), last = new Date(y, mo + 1, 0).getDate();
    let c = DOW.map(x => `<div class="dow">${x}</div>`).join("") + "<div style='visibility:hidden'></div>".repeat(first);
    for (let d = 1; d <= last; d++) { const k = ymd(new Date(y, mo, d)); c += `<div data-go="${k}" class="${data[k] ? "done" : ""} ${k === today() ? "today" : ""}">${d}</div>`; }
    return `<div class="cal">${c}</div>`;
  }
  if (view === "stat") {
    const all = Object.keys(data), ch = all.reduce((s, k) => s + data[k].text.length, 0), xp = totalXp();
    return `<div class="tbl"><div class="row"><span>記録日数</span><b>${all.length}</b></div><div class="row"><span>連続日数</span><b>${streakCount()}</b></div><div class="row"><span>総文字数</span><b>${ch}</b></div><div class="row"><span>今月の記録</span><b>${all.filter(k => k.startsWith(today().slice(0, 7))).length}</b></div><div class="row"><span>経験値</span><b>${xp}</b></div></div>`;
  }
  if (view === "quest") {
    const st = streakCount();
    return `<div class="tbl">${MS.map(n => `<div class="row"><span>${st >= n ? "✔ " : ""}${n}日連続</span><div class="bar"><i style="width:${Math.min(st / n, 1) * 100}%"></i></div><b>${Math.min(st, n)}/${n}</b></div>`).join("")}</div>`;
  }
  if (view === "book") {
    const all = Object.keys(data);
    return `<div class="tbl">${MOODS.map(([m, ic]) => { const c = all.filter(k => data[k].mood === m).length; return `<div class="row"><span>${ic} ${m}</span><div class="bar"><i style="width:${all.length ? c / all.length * 100 : 0}%"></i></div><b>${c}</b></div>`; }).join("")}</div>`;
  }
  return `<div class="tbl" style="gap:12px"><button class="big" id="theme">テーマ選択へ戻る<small>他のゲームのUIに切り替えても記録は引き継がれます</small></button><button class="big" id="exp">記録を書き出す<small>JSONファイルとして保存</small></button><button class="big" id="imp">記録を読み込む<small>JSONファイルから復元</small></button></div>`;
}
function render() {
  $("menu").innerHTML = MENU.map(([n, v, ic], i) => `<button class="mi ${v === view ? "on" : ""}" data-v="${v}" style="--i:${i}"><span class="ic">${ic}</span>${n}</button>`).join("");
  $("ttl").textContent = "メインメニュー";
  $("book").innerHTML = `<div class="pg l">${leftPage()}</div><div class="pg r ${flipNext ? "flip" : ""}">${rightPage()}</div>`; flipNext = false;
}
function setView(v) { view = v; flipNext = true; if (v === "write") { selected = today(); const e = data[selected]; mood = e ? e.mood : null; draft = null; } if (v === "log") { logPage = 0; const ks = keysDesc(); if (ks.length) selected = ks[0]; } render(); }
function pickDay(k) { selected = k; draft = null; const e = data[k]; mood = e ? e.mood : null; view = "write"; flipNext = true; render(); }
function save() {
  const ta = $("ta"); if (!ta) return; const text = ta.value.trim(); if (!text) { ta.focus(); return; }
  const before = Math.floor(totalXp() / XP_PER_RANK), isNew = !data[selected];
  data[selected] = { mood, text }; store(data); draft = null;
  const up = Math.floor(totalXp() / XP_PER_RANK) > before;
  $("ovT").textContent = up ? "ランクアップ！" : "調合成功！"; $("ovS").textContent = isNew ? `${streakCount()}日連続` : "更新しました";
  const o = $("ov"); o.classList.remove("show"); void o.offsetWidth; o.classList.add("show");
  clearTimeout(ovTimer); ovTimer = setTimeout(() => o.classList.remove("show"), 2900);
  render();
}
document.addEventListener("click", e => {
  const mi = e.target.closest(".mi"); if (mi) return setView(mi.dataset.v);
  const mc = e.target.closest(".mc"); if (mc) { selected = mc.dataset.k; return render(); }
  const g = e.target.closest("[data-go]"); if (g) return pickDay(g.dataset.go);
  const mt = e.target.closest(".mt"); if (mt) { mood = mt.dataset.m; draft = $("ta").value; return render(); }
  if (e.target.closest("#save")) return save();
  if (e.target.closest("#pp")) { logPage = Math.max(0, logPage - 1); flipNext = true; return render(); }
  if (e.target.closest("#pn")) { logPage++; flipNext = true; return render(); }
  if (e.target.closest("#edit")) return pickDay(selected);
  if (e.target.closest("#theme")) { location.href = "index.html"; return; }
  if (e.target.closest("#exp")) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" })); a.download = "diary-backup.json"; a.click(); return; }
  if (e.target.closest("#imp")) { const f = document.createElement("input"); f.type = "file"; f.accept = "application/json"; f.onchange = () => f.files[0] && f.files[0].text().then(t => { try { const o = JSON.parse(t); for (const k in o) if (o[k] && typeof o[k].text === "string") data[k] = { mood: o[k].mood || null, text: o[k].text }; store(data); render(); } catch { alert("読み込みに失敗しました"); } }); f.click(); return; }
  if (e.target.closest("#ov")) $("ov").classList.remove("show");
});
document.addEventListener("change", e => { if (e.target.id === "dt" && e.target.value) { draft = $("ta").value; selected = e.target.value; const x = data[selected]; if (x) mood = x.mood; render(); } });
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); return save(); }
  if (e.key === "Escape") { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); $("ov").classList.remove("show"); return; }
  if (/TEXTAREA|INPUT/.test(e.target.tagName)) return;
  const i = MENU.findIndex(m => m[1] === view);
  if (e.key === "ArrowDown") { e.preventDefault(); setView(MENU[(i + 1) % MENU.length][1]); }
  else if (e.key === "ArrowUp") { e.preventDefault(); setView(MENU[(i + MENU.length - 1) % MENU.length][1]); }
  else if (view === "log" && (e.key === "ArrowRight" || e.key === "e")) { logPage++; flipNext = true; render(); }
  else if (view === "log" && (e.key === "ArrowLeft" || e.key === "q")) { logPage = Math.max(0, logPage - 1); flipNext = true; render(); }
  else if (view === "log" && e.key === "Enter") pickDay(selected);
});
render();
</script>
</body>
</html>
