<style>
  /* Industrial sci-fi HUD: central radar with wireframe vessel, tilted white menu cards (left), tile grid (right), yellow accents; light skill-road screen */
  :root { --y:#ffe100; --yd:#c9b000; --bg:#0b0d10; --card:#eceef0; --card2:#d6d9dc; --ink:#14171b; --mut:#8a9098; --line:rgba(255,255,255,.18);
    --fb:'Zen Kaku Gothic New',sans-serif; --fn:'Oxanium',sans-serif; }
  * { box-sizing:border-box; margin:0; }

  .stars { position:absolute; inset:0; pointer-events:none; background-image:radial-gradient(1px 1px at 20% 30%,#fff8,transparent),radial-gradient(1px 1px at 70% 20%,#fff6,transparent),radial-gradient(1px 1px at 40% 80%,#fff5,transparent),radial-gradient(1px 1px at 85% 65%,#fff7,transparent),radial-gradient(1px 1px at 10% 70%,#fff5,transparent); }
  .crosses i { position:absolute; width:14px; height:14px; opacity:.5; }

  /* ---------- HUD layout ---------- */

  .sysicons { position:absolute; left:8%; top:62px; display:flex; gap:22px; z-index:3; }
  .sysicons svg { width:30px; height:30px; }

  /* left tilted cards */
  .left { grid-column:1; grid-row:2; position:relative; display:flex; flex-direction:column; justify-content:center; gap:14px; perspective:900px; padding-top:40px; }
  .lc { all:unset; box-sizing:border-box; cursor:pointer; position:relative; height:clamp(64px,12vh,96px); width:78%; margin-left:calc(var(--x) * 1%); display:grid; place-items:center; align-content:center; gap:4px; color:var(--ink); font:900 15px var(--fb);
    background:linear-gradient(180deg,#f7f8f9,var(--card2)); border-radius:10px 10px 10px 2px; box-shadow:0 6px 0 rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.7); transform:rotateY(18deg) rotate(calc(var(--r) * 1deg)); transform-origin:left center; transition:transform .15s, background .15s; animation:cardIn .4s calc(var(--i) * 70ms + .1s) both; }
  .lc::before { content:""; position:absolute; right:-36px; top:50%; width:32px; height:22px; translate:0 -50%; background:repeating-linear-gradient(180deg,var(--line) 0 1px,transparent 1px 5px); }
  .lc svg { width:36px; height:36px; } .lc .ic { color:var(--ink); }
  .lc.cur { background:linear-gradient(180deg,#fff,#eceef0); transform:rotateY(10deg) rotate(calc(var(--r) * 1deg)) translateX(8px); box-shadow:0 6px 0 rgba(0,0,0,.35), 0 0 0 3px var(--y); }

  /* center radar */
  .center { grid-column:2; grid-row:2; position:relative; display:grid; place-items:center; min-height:0; }

  .radar .disc::before { content:""; position:absolute; inset:0; background:radial-gradient(circle,transparent 0 24.5%,var(--line) 25% 25.3%,transparent 25.6% 49.5%,var(--line) 50% 50.3%,transparent 50.6%), radial-gradient(circle at 50% 50%,rgba(255,255,255,.12) 1px,transparent 1.5px) 0 0/22px 22px; }

  .radar .ring2 { position:absolute; inset:4.5%; border-radius:50%; border:6px solid var(--y); -webkit-mask:conic-gradient(transparent 0 8%,#000 8% 22%,transparent 22% 58%,#000 58% 63%,transparent 63%); mask:conic-gradient(transparent 0 8%,#000 8% 22%,transparent 22% 58%,#000 58% 63%,transparent 63%); }
  .radar .ticks { position:absolute; inset:0; border-radius:50%; background:repeating-conic-gradient(rgba(255,255,255,.35) 0 .4deg,transparent .4deg 6deg); -webkit-mask:radial-gradient(circle,transparent 0 48.6%,#000 48.8% 50%,transparent 50.2%); mask:radial-gradient(circle,transparent 0 48.6%,#000 48.8% 50%,transparent 50.2%); }
  .tri { position:absolute; width:0; height:0; border-left:12px solid transparent; border-right:12px solid transparent; border-bottom:20px solid var(--y); translate:-50% -50%; rotate:var(--rot); filter:drop-shadow(0 0 4px rgba(255,225,0,.6)); }

  .beam { position:absolute; left:50%; top:9%; width:3px; height:38%; background:linear-gradient(180deg,transparent,var(--y)); transform-origin:bottom; rotate:-12deg; translate:-50% 0; box-shadow:0 0 10px var(--y); }

  .bolt { all:unset; cursor:pointer; position:absolute; left:50%; bottom:13%; translate:-50% 0; width:clamp(58px,10vh,84px); aspect-ratio:1; border-radius:50%; background:var(--y); box-shadow:0 0 0 5px #fff, 0 0 0 7px var(--ink), 0 0 24px rgba(255,225,0,.7); display:grid; place-items:center; z-index:3; transition:transform .1s; }

  .bandbtns button:hover, .bandbtns button:focus-visible { background:var(--ink); outline:0; } .bandbtns button:hover svg *, .bandbtns button:focus-visible svg * { stroke:#fff; }
  .bandbtns svg { width:24px; height:24px; }

  /* right tiles */
  .right { grid-column:3; grid-row:2; display:flex; flex-direction:column; gap:12px; justify-content:center; perspective:900px; }

  .tl { all:unset; box-sizing:border-box; cursor:pointer; position:relative; height:clamp(56px,10.5vh,84px); display:grid; place-items:center; align-content:center; gap:2px; color:var(--ink); font:900 14px var(--fb);
    background:linear-gradient(180deg,#f7f8f9,var(--card2)); border-radius:8px; box-shadow:0 5px 0 rgba(0,0,0,.35); animation:cardIn .35s calc(var(--i) * 40ms + .2s) both; transition:transform .12s; }

  .tpg { display:flex; justify-content:space-between; font:700 12px var(--fn); color:var(--mut); padding:0 4px; } .tpg button { all:unset; cursor:pointer; } .tpg button:hover { color:var(--y); } .tpg button:disabled { opacity:.3; }

  /* player card */
  .player { grid-column:1; grid-row:3; position:relative; display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:center; padding:10px 16px 10px 10px; background:linear-gradient(90deg,rgba(20,23,27,.95),rgba(20,23,27,.75)); border:2px solid var(--y); border-radius:4px 14px 4px 4px; transform:skewX(-6deg); animation:slideR .4s .25s both; }
  .player .av { width:64px; height:64px; background:#2a2f36; display:grid; place-items:center; border:1px solid #444; } .player .av svg { width:46px; }
  .player .nm { font:700 15px var(--fb); color:#cfd3d8; } .player .lvrow { display:flex; justify-content:space-between; align-items:baseline; } .player .lvrow span { font:700 13px var(--fb); } .player .lvrow b { font:700 30px/1 var(--fn); }
  .player .xb { height:5px; background:#3a3f46; margin-top:4px; } .player .xb i { display:block; height:100%; background:var(--y); transition:width .8s; } .player small { font:700 12px var(--fn); color:var(--y); }

  .foot { grid-column:2 / 4; grid-row:3; align-self:end; text-align:right; font:500 11px var(--fb); color:var(--mut); }

  .crumb { position:absolute; left:20px; top:14px; z-index:3; display:flex; align-items:center; gap:8px; font:900 15px var(--fb); } .crumb small { font:700 9px var(--fn); color:#666; display:block; }

  .node.on { background:var(--y); color:var(--ink); border-color:#fff; }

  .node svg { width:55%; }
  .skillbox { position:absolute; left:min(26vw,320px); top:16vh; z-index:3; width:min(330px,40vw); background:linear-gradient(90deg,rgba(255,225,0,.92),rgba(255,225,0,.55)); padding:10px 14px; clip-path:polygon(0 0,100% 0,96% 100%,0 100%); animation:slideR .4s .1s both; }

  .sk { display:grid; grid-template-columns:34px 1fr; gap:10px; align-items:center; margin:6px 0; }
  .sk i { width:32px; height:32px; border-radius:50%; background:var(--ink); color:#fff; display:grid; place-items:center; font-style:normal; font:800 13px var(--fb); }
  .sk div { font:800 12px var(--fn); } .sk div span { font:700 12px var(--fb); margin-left:6px; }
  .sk em { display:block; height:5px; background:rgba(0,0,0,.18); margin-top:3px; } .sk em::after { content:""; display:block; height:100%; width:var(--v); background:var(--ink); }

  .lvup { all:unset; cursor:pointer; position:absolute; left:2vw; bottom:calc(12vh + 60px); z-index:3; display:flex; align-items:center; gap:18px; padding:8px 12px 8px 24px; background:#fff; border-radius:999px; font:900 14px var(--fb); box-shadow:0 3px 0 rgba(0,0,0,.25); }
  .lvup span { width:24px; height:24px; border-radius:50%; background:var(--ink); color:#fff; display:grid; place-items:center; font-size:12px; } .lvup:hover, .lvup:focus-visible { background:var(--y); outline:0; }

  /* ---------- editor ---------- */
  #ed { position:fixed; inset:0; z-index:50; display:none; place-items:center; background:rgba(0,0,0,.66); padding:12px; }
  #ed.show { display:grid; }
  .win { width:min(620px,100%); max-height:94vh; overflow:auto; background:#14171b; border:1px solid #3a3f46; box-shadow:0 0 0 1px #000, 0 20px 50px rgba(0,0,0,.6); clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,26px 100%,0 calc(100% - 26px)); animation:pop .25s both; }

<script>
const KEY = "diary-shared-v1";
const LEGACY = ["persona-diary-v1", "persona3-diary-v1"];
const MOODS = ["最高", "良い", "普通", "微妙", "最悪"];
const MC = { 最高:"#ffe100", 良い:"#5ad19a", 普通:"#7ab8ff", 微妙:"#c49aff", 最悪:"#ff5a52" };
const DOW = ["日","月","火","水","木","金","土"];
const XP_PER = 100, XP_BONUS_PER_STREAK = 10, XP_PER_RANK = 300, TPER = 8;
const ICON = {
  write: '<path d="M4 20l1-5 11-11 4 4L9 19z" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M14 6l4 4" stroke="currentColor" stroke-width="2.4"/>',
  log:   '<path d="M5 4h14v16H5z" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M8 9h8M8 13h8M8 17h5" stroke="currentColor" stroke-width="2.4"/>',
  tree:  '<path d="M12 3l3 5h-6zM6 13l3 5H3zM18 13l3 5h-6z" fill="currentColor"/><path d="M12 8v5M7 13h10" stroke="currentColor" stroke-width="2"/>',
  exit:  '<path d="M4 4h10v16H4z" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 12h9M18 8l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2.4"/>'
};
const MICON = m => ({ 最高:'<path d="M12 2l3 7h7l-6 4 2 8-6-5-6 5 2-8-6-4h7z" fill="currentColor"/>', 良い:'<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M8 13a4 4 0 0 0 8 0" fill="none" stroke="currentColor" stroke-width="2.4"/>', 普通:'<rect x="5" y="5" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M8 13h8" stroke="currentColor" stroke-width="2.4"/>', 微妙:'<path d="M12 3l9 16H3z" fill="none" stroke="currentColor" stroke-width="2.6"/>', 最悪:'<path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="3"/>' }[m] || '<path d="M6 12h12" stroke="currentColor" stroke-width="2.4"/>');
const MENU = [
  { id:"write", jp:"記録", x:16, r:-10 },
  { id:"log", jp:"履歴", x:8, r:-3 },
  { id:"tree", jp:"能力拡張", x:5, r:4 },
  { id:"exit", jp:"テーマ選択", x:9, r:11 }
];
// skill milestones shown on the road
const SKILLS = [
  { n:"継続", unit:"日", get:() => streakCount(), steps:[3, 7, 14] },
  { n:"習慣", unit:"件", get:() => Object.keys(data).length, steps:[10, 30, 100] },
  { n:"筆力", unit:"字", get:() => Object.values(data).reduce((s, x) => s + x.text.length, 0), steps:[500, 2000, 5000] },
  { n:"前向き", unit:"回", get:() => Object.values(data).filter(x => ["最高", "良い"].includes(x.mood)).length, steps:[5, 15, 40] }
];
const $ = id => document.getElementById(id);
const load = () => {
  try {
    let d = JSON.parse(localStorage.getItem(KEY));
    if (!d) { d = {}; for (const k of LEGACY) { const o = JSON.parse(localStorage.getItem(k) || "{}"); for (const day in o) if (!d[day]) d[day] = o[day]; } }
    return d;
  } catch { return {}; }
};
const store = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md = k => { const d = new Date(k + "T00:00:00"); return `${d.getMonth()+1}/${d.getDate()}（${DOW[d.getDay()]}）`; };
const svg = (p, vb = "0 0 24 24") => `<svg viewBox="${vb}" aria-hidden="true">${p}</svg>`;

let data = load(), view = "hud", zone = "L", li = 0, ti = 0, tpage = 0, ni = 0, selected = ymd(new Date()), mood = null, ovTimer;
const tileDay = i => { const d = new Date(); d.setDate(d.getDate() - (tpage * TPER + i)); return ymd(d); };

function streakAt(k) { let n = 0; const d = new Date(k + "T00:00:00"); while (data[ymd(d)]) { n++; d.setDate(d.getDate() - 1); } return n; }
function streakCount() { const d = new Date(); if (!data[ymd(d)]) d.setDate(d.getDate() - 1); return streakAt(ymd(d)); }
function totalXp() {
  let xp = 0, run = 0, prev = null;
  for (const k of Object.keys(data).sort()) {
    const c = new Date(k + "T00:00:00");
    run = prev && (c - prev) / 864e5 === 1 ? run + 1 : 1;
    xp += XP_PER + Math.min(run, 30) * XP_BONUS_PER_STREAK;
    prev = c;
  }
  return xp;
}

function renderHud() {
  const today = ymd(new Date()), xp = totalXp(), lv = Math.floor(xp / XP_PER_RANK) + 1, all = Object.keys(data), month = today.slice(0, 7);
  $("tAll").textContent = all.length; $("tSt").textContent = streakCount(); $("tMon").textContent = `${all.filter(k => k.startsWith(month)).length}/${new Date().getDate()}`;
  $("left").innerHTML = MENU.map((m, i) => `<button class="lc ${zone === "L" && i === li ? "cur" : ""}" data-l="${i}" style="--x:${m.x};--r:${m.r};--i:${i}"><span class="ic">${svg(ICON[m.id])}</span>${m.jp}</button>`).join("");
  // last 7 days as yellow markers around the radar ring (today at top)
  $("tris").innerHTML = Array.from({ length: 7 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - i); const k = ymd(d), a = (-90 + i * 40) * Math.PI / 180;
    return `<span class="tri ${data[k] ? "" : "off"} ${i === 0 ? "today" : ""}" style="left:${50 + Math.cos(a) * 43.5}%;top:${50 + Math.sin(a) * 43.5}%;--rot:${-90 + i * 40 + 90 + 180}deg"><button data-go="${k}" aria-label="${md(k)}${data[k] ? " 記録あり" : ""}"></button></span>`; }).join("");
  const e = data[today];
  $("lDate").textContent = `${md(today)} の記録`;
  $("lSub").textContent = e ? `記録済み ─ ${e.mood || "調子未設定"}` : `記録レベル ${lv} ─ 未記録`;
  const latest = all.sort().reverse()[0];
  $("nDate").textContent = latest ? md(latest) : ""; $("ticker").textContent = latest ? `${data[latest].mood ? "【" + data[latest].mood + "】" : ""}${data[latest].text.replace(/\s+/g, " ")}` : "まだ記録はありません。中央のボタンから最初の記録を。";
  $("tiles").innerHTML = Array.from({ length: TPER }, (_, i) => { const k = tileDay(i), x = data[k];
    return `<button class="tl ${x ? "" : "empty"} ${k === today ? "today" : ""} ${zone === "R" && i === ti ? "cur" : ""}" data-t="${i}" style="--i:${i}">${svg(MICON(x && x.mood))}${md(k)}<small>${x ? x.text.length + " CHR" : "NO DATA"}</small></button>`; }).join("");
  $("tPg").textContent = `PAGE ${tpage + 1}`; $("tNewer").disabled = tpage === 0;
  $("pLv").textContent = lv; $("pXb").style.width = `${xp % XP_PER_RANK / XP_PER_RANK * 100}%`; $("pXp").textContent = `${xp % XP_PER_RANK}/${XP_PER_RANK}`;
}

// skill road: a curved path with one node per rank; reached ranks glow yellow
function roadPoints(n, w, h) {
  // down from the top, a quarter turn, then right along the bottom (like the skill road)
  const seg = t => {
    const v = .45, a = Math.PI / 2 * .15 * 2, L1 = v, L2 = a, L3 = .4, T = L1 + L2 + L3, d = t * T;
    if (d <= L1) return [.58, .12 + d / L1 * .45];
    if (d <= L1 + L2) { const u = (d - L1) / L2 * Math.PI / 2; return [.73 - Math.cos(u) * .15, .57 + Math.sin(u) * .25]; }
    return [.73 + (d - L1 - L2) / L3 * .24, .82];
  };
  // narrow screens: a vertical snake so nodes keep their spacing
  const snake = t => [.5 + Math.sin(t * Math.PI * 2) * .28, .05 + t * .9];
  return Array.from({ length: n }, (_, i) => (innerWidth <= 860 ? snake : seg)(i / (n - 1))).map(([x, y]) => [x * w, y * h]);
}
function renderTree() {
  const xp = totalXp(), lv = Math.floor(xp / XP_PER_RANK) + 1, mobile = innerWidth <= 860;
  const N = 12, base = Math.max(0, lv - 4), road = $("road"), W = road.clientWidth || innerWidth, H = road.clientHeight || innerHeight;
  const pts = roadPoints(N, W, H);
  if (ni >= N) ni = N - 1;
  const path = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ");
  const reached = pts.filter((_, i) => base + i + 1 <= lv);
  const pathOn = reached.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ");
  road.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="rgba(255,225,0,.85)" stroke-width="${mobile ? 60 : 110}" stroke-linecap="round" stroke-linejoin="round"/><path d="${path}" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="3" stroke-dasharray="6 8"/>${pathOn ? `<path d="${pathOn}" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>` : ""}</svg>` +
    pts.map((p, i) => { const r = base + i + 1, on = r <= lv, next = r === lv + 1;
      return `<button class="node ${on ? "on" : ""} ${next ? "next" : ""} ${i === ni ? "cur" : ""}" data-n="${i}" style="left:${p[0]}px;top:${p[1]}px;--i:${i}" aria-label="RANK ${r}">${on ? r : next ? "▲" : svg('<path d="M7 11V8a5 5 0 0 1 10 0v3" fill="none" stroke="#fff" stroke-width="2.4"/><rect x="5" y="11" width="14" height="10" fill="#fff"/>')}</button>`; }).join("");
  const r = base + ni + 1, need = (r - 1) * XP_PER_RANK;
  $("tip").innerHTML = `<b>RANK ${String(r).padStart(2, "0")}</b><p>${r <= lv ? "到達済み。この調子で記録を続けよう。" : `必要EXP ${need.toLocaleString()} ／ あと ${(need - xp).toLocaleString()} EXP`}</p>`;
  $("skills").innerHTML = SKILLS.map(s => { const v = s.get(), rank = s.steps.filter(x => v >= x).length, nx = s.steps[rank] ?? s.steps[s.steps.length - 1];
    return `<div class="sk"><i>${s.n[0]}</i><div>RANK ${rank}/3<span>${s.n} ${v.toLocaleString()}${s.unit}</span><em style="--v:${Math.min(v / nx * 100, 100)}%"></em></div></div>`; }).join("");
  $("prT").textContent = `${Math.min(Math.floor((lv - 1) / 10) + 1, 4)}/4`;
  $("prL").innerHTML = `${(lv - 1) % 10 + 1}<sub>/10</sub>`; $("prB").style.setProperty("--v", `${xp % XP_PER_RANK / XP_PER_RANK * 100}%`);
}

function renderHints() {
  const H = view === "hud" ? [["←→↑↓", "選択"], ["Enter", "決定"], ["Q/E", "ページ"], ["T", "能力拡張"]] : [["←→", "ノード"], ["Enter", "記録"], ["Esc", "戻る"]];
  $("hints").innerHTML = H.map(([k, l]) => `<span><kbd>${k}</kbd>${l}</span>`).join("");
}
function render() { document.body.dataset.v = view; view === "hud" ? renderHud() : renderTree(); renderHints(); }
function go(v) { view = v; ni = 0; document.body.classList.remove("ready"); render(); setTimeout(() => document.body.classList.add("ready"), 900); }
function runMenu(i) {
  const id = MENU[i].id;
  if (id === "write") return openEd(ymd(new Date()));
  if (id === "log") { zone = "R"; ti = 0; return renderHud(); }
  if (id === "tree") return go("tree");
  if (id === "exit") location.href = "index.html";
}

function setMood(m) { mood = m; document.querySelectorAll("#moods button").forEach(b => b.classList.toggle("on", b.dataset.m === mood)); }
function openEd(k) {
  selected = k; const e = data[k]; mood = e ? e.mood : null;
  $("eT").textContent = `${k === ymd(new Date()) ? "本日 " : ""}${md(k)} の記録`; $("eS").textContent = e ? "UPDATE" : "NEW REPORT";
  $("moods").innerHTML = MOODS.map(m => `<li><button data-m="${m}" class="${m === mood ? "on" : ""}" style="--c:${MC[m]}"><i></i>${m}</button></li>`).join("");
  $("body").value = e ? e.text : "";
  $("ed").classList.add("show"); setTimeout(() => $("body").focus(), 30);
}
const closeEd = () => $("ed").classList.remove("show");
function save() {
  const text = $("body").value.trim(); if (!text) { $("body").focus(); return; }
  const xp0 = totalXp(), isNew = !data[selected];
  data[selected] = { mood, text }; store(data);
  const xp1 = totalXp(), up = Math.floor(xp1 / XP_PER_RANK) > Math.floor(xp0 / XP_PER_RANK);
  $("ovT").textContent = up ? "LEVEL UP" : "DATA SYNCED"; $("ovJ").textContent = up ? `記録レベルが ${Math.floor(xp1 / XP_PER_RANK) + 1} に上がりました` : isNew ? "記録を送信しました" : "記録を更新しました";
  $("ovS").textContent = isNew ? `+${xp1 - xp0} EXP ／ STREAK ${streakCount()}` : "UPDATED";
  const o = $("ov"); o.classList.remove("show"); void o.offsetWidth; o.classList.add("show");
  clearTimeout(ovTimer); ovTimer = setTimeout(() => o.classList.remove("show"), 2950);
  closeEd(); render();
}

document.addEventListener("click", e => {
  const lc = e.target.closest(".lc"); if (lc) { zone = "L"; li = +lc.dataset.l; renderHud(); return runMenu(li); }
  const tl = e.target.closest(".tl"); if (tl) { zone = "R"; ti = +tl.dataset.t; return openEd(tileDay(ti)); }
  const g = e.target.closest("[data-go]"); if (g) return openEd(g.dataset.go);
  const nd = e.target.closest(".node"); if (nd) { ni = +nd.dataset.n; return renderTree(); }
  const mb = e.target.closest("#moods button"); if (mb) return setMood(mood === mb.dataset.m ? null : mb.dataset.m);
  if (e.target.closest("#save")) return save();
  if (e.target.closest("#cl") || e.target.id === "ed") return closeEd();
  if (e.target.closest("#bolt") || e.target.closest("#lvup")) return openEd(ymd(new Date()));
  if (e.target.closest("#bTree")) return go("tree");
  if (e.target.closest("#bStat")) { zone = "R"; ti = 0; return renderHud(); }
  if (e.target.closest("#back")) return go("hud");
  if (e.target.closest("#tOlder")) { tpage++; return renderHud(); }
  if (e.target.closest("#tNewer")) { if (tpage) { tpage--; renderHud(); } return; }
  if (e.target.closest("#ov")) $("ov").classList.remove("show");
});
document.addEventListener("mouseover", e => {
  if ($("ed").classList.contains("show") || view !== "hud") return;
  const lc = e.target.closest(".lc"); if (lc && !(zone === "L" && +lc.dataset.l === li)) { zone = "L"; li = +lc.dataset.l; return renderHud(); }
  const tl = e.target.closest(".tl"); if (tl && !(zone === "R" && +tl.dataset.t === ti)) { zone = "R"; ti = +tl.dataset.t; renderHud(); }
});
addEventListener("resize", () => { if (view === "tree") renderTree(); });
document.addEventListener("keydown", e => {
  const open = $("ed").classList.contains("show"), k = e.key;
  if ((e.ctrlKey || e.metaKey) && k === "Enter" && open) { e.preventDefault(); return save(); }
  if (k === "Escape") { if (open) return closeEd(); if ($("ov").classList.contains("show")) return $("ov").classList.remove("show"); if (view === "tree") return go("hud"); return; }
  if (open) {
    if (e.target.tagName !== "TEXTAREA" && (k === "ArrowLeft" || k === "ArrowRight")) {
      e.preventDefault(); const dir = k === "ArrowRight" ? 1 : -1, i = MOODS.indexOf(mood);
      setMood(MOODS[i < 0 ? (dir > 0 ? 0 : MOODS.length - 1) : (i + dir + MOODS.length) % MOODS.length]); document.querySelector(`#moods button[data-m="${mood}"]`).focus();
    }
    return;
  }
  if (/TEXTAREA|INPUT/.test(e.target.tagName)) return;
  const enter = (k === "Enter" || k === " ") && e.target.tagName !== "BUTTON";
  if (view === "tree") {
    if (k === "ArrowRight" || k === "ArrowUp") { e.preventDefault(); ni = Math.min(ni + 1, 11); return renderTree(); }
    if (k === "ArrowLeft" || k === "ArrowDown") { e.preventDefault(); ni = Math.max(ni - 1, 0); return renderTree(); }
    if (enter) { e.preventDefault(); return openEd(ymd(new Date())); }
    if (k === "Backspace") return go("hud");
    return;
  }
  if (k === "t" || k === "T") return go("tree");
  if (k === "q" || k === "Q") { if (tpage) { tpage--; renderHud(); } return; }
  if (k === "e" || k === "E") { tpage++; return renderHud(); }
  if (enter) { e.preventDefault(); return zone === "L" ? runMenu(li) : openEd(tileDay(ti)); }
  const mv = { ArrowUp:"u", ArrowDown:"d", ArrowLeft:"l", ArrowRight:"r" }[k]; if (!mv) return;
  e.preventDefault();
  if (zone === "L") {
    if (mv === "u") li = Math.max(0, li - 1); else if (mv === "d") li = Math.min(MENU.length - 1, li + 1);
    else if (mv === "r") { zone = "R"; ti = Math.min(li * 2, TPER - 2); }
  } else {
    const col = ti % 2;
    if (mv === "u" && ti >= 2) ti -= 2; else if (mv === "d" && ti + 2 < TPER) ti += 2;
    else if (mv === "r" && col === 0) ti++; else if (mv === "l") { if (col === 1) ti--; else { zone = "L"; li = Math.min(Math.floor(ti / 2), MENU.length - 1); } }
  }
  renderHud();
});

$("crosses").innerHTML = Array.from({ length: 12 }, (_, i) => `<i style="left:${(i * 41) % 96 + 2}%;top:${(i * 67) % 90 + 4}%"></i>`).join("");
render();
setTimeout(() => document.body.classList.add("ready"), 1000);
</script>
</body>
