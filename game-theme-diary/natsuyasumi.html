<script>
const KEY = "diary-shared-v1";
const LEGACY = ["persona-diary-v1", "persona3-diary-v1"];
const WX = [["最高", "☀️"], ["良い", "🌤️"], ["普通", "☁️"], ["微妙", "🌧️"], ["最悪", "⛈️"]];
const XP_PER = 100, XP_BONUS_PER_STREAK = 10, XP_PER_RANK = 300;
const DOW = ["日","月","火","水","木","金","土"];
const $ = id => document.getElementById(id);
const load = () => {
  try {
    let d = JSON.parse(localStorage.getItem(KEY));
    if (!d) { d = {}; for (const k of LEGACY) { const o = JSON.parse(localStorage.getItem(k) || "{}"); for (const day in o) if (!d[day]) d[day] = o[day]; } }
    return d;
  } catch { return {}; }
};
const store = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shift = (k, n) => { const d = new Date(k + "T00:00:00"); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const md = k => { const d = new Date(k + "T00:00:00"); return `${d.getMonth() + 1}月${d.getDate()}日`; };

let data = load(), scr = "title", ti = 0, ii = 0, selected = today(), mood = null, draft = null, ovTimer;
function streakAt(k) { let n = 0, c = k; while (data[c]) { n++; c = shift(c, -1); } return n; }
function streakCount() { const t = today(); return streakAt(data[t] ? t : shift(t, -1)); }
function totalXp() {
  let xp = 0, run = 0, prev = null;
  for (const k of Object.keys(data).sort()) {
    const c = new Date(k + "T00:00:00");
    run = prev && (c - prev) / 864e5 === 1 ? run + 1 : 1;
    xp += XP_PER + Math.min(run, 30) * XP_BONUS_PER_STREAK;
    prev = c;
  }
  return xp;
}
// crayon-style scene, varies with weather (mood) and day
function scene(m, day) {
  const sky = { "最高": "#6ac8f0", "良い": "#8ad0f0", "普通": "#b8c8d8", "微妙": "#8a9ab0", "最悪": "#5a5a70", "": "#7ccaf2" }[m || ""];
  const rain = m === "微妙" || m === "最悪", storm = m === "最悪", sun = !m || m === "最高" || m === "良い";
  let s = `<svg viewBox="0 0 400 190" preserveAspectRatio="none"><defs><filter id="w"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="${day}"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter></defs><g filter="url(#w)">
    <rect width="400" height="190" fill="${sky}"/>`;
  if (sun) s += `<g stroke="#e83a2a" stroke-width="3" fill="none"><circle cx="352" cy="36" r="${m === "最高" ? 22 : 15}" fill="#f8d83a" stroke="#e8801a"/>${Array.from({ length: 8 }, (_, i) => `<line x1="${352 + Math.cos(i * .785) * 28}" y1="${36 + Math.sin(i * .785) * 28}" x2="${352 + Math.cos(i * .785) * 40}" y2="${36 + Math.sin(i * .785) * 40}"/>`).join("")}</g>`;
  const cc = storm ? "#6a6a80" : rain ? "#a8b0c0" : "#fff";
  [[60, 40, 1], [170, 24, .8], [260, 52, .9]].slice(0, m === "普通" || rain ? 3 : 2).forEach(([x, y, k]) => s += `<g fill="${cc}" stroke="#4a8ac8" stroke-width="2"><ellipse cx="${x}" cy="${y}" rx="${34 * k}" ry="${14 * k}"/><ellipse cx="${x + 20 * k}" cy="${y - 8 * k}" rx="${22 * k}" ry="${12 * k}"/><ellipse cx="${x - 22 * k}" cy="${y - 4 * k}" rx="${20 * k}" ry="${10 * k}"/></g>`);
  s += `<path d="M-10 190V120Q80 50 170 110T400 100V190Z" fill="#6ac84a" stroke="#2a8a2a" stroke-width="3"/><path d="M120 190V150Q200 80 300 140T420 120V190Z" fill="#8ad85a" stroke="#2a8a2a" stroke-width="3"/>
    <path d="M200 190Q170 150 205 125T215 85" fill="none" stroke="#e8803a" stroke-width="14" stroke-linecap="round"/>`;
  for (let i = 0; i < 3 + day % 3; i++) { const x = 30 + ((day * 53 + i * 97) % 340), y = 125 + ((i * 31) % 40); s += `<g><rect x="${x - 3}" y="${y}" width="6" height="16" fill="#8a5a2a"/><circle cx="${x}" cy="${y - 4}" r="14" fill="#3aa83a" stroke="#1a6a1a" stroke-width="2"/></g>`; }
  if (rain) s += `<g stroke="#2a6ac8" stroke-width="2">${Array.from({ length: 26 }, (_, i) => `<line x1="${(i * 17 + day * 7) % 400}" y1="${(i * 29) % 120 + 20}" x2="${(i * 17 + day * 7) % 400 - 6}" y2="${(i * 29) % 120 + 38}"/>`).join("")}</g>`;
  if (storm) s += `<path d="M300 40L280 90h16l-10 40 30-56h-18l14-34z" fill="#f8e03a" stroke="#c8a010" stroke-width="2"/>`;
  return s + `</g></svg>`;
}
const stamps = () => Object.keys(data).length;

function title() {
  const M = ["最初から始める", "途中から続ける", "夏休みの思い出", "設定"];
  return `<div class="sky" style="position:absolute;inset:0"><div class="cl" style="left:-6cqw;top:30cqw;width:60cqw;height:22cqw;--t:50s"></div><div class="cl" style="left:30cqw;top:44cqw;width:70cqw;height:28cqw;--t:60s"></div><div class="cl" style="left:60cqw;top:20cqw;width:46cqw;height:16cqw;--t:45s"></div></div>
  <div class="ttl">ぼくのにっき<small>TM</small></div><div class="tm">${M.map((t, i) => `<button class="ti ${i === ti ? "on" : ""}" data-t="${i}">${t}</button>`).join("")}</div>
  <div class="cp">© ${new Date().getFullYear()} ぼくのにっき (非公式ファンメイド)</div>`;
}
function desk() {
  const d = new Date(), xp = totalXp();
  return `<div class="wood" style="position:absolute;inset:0"></div>
  <button class="ob cal" data-o="stamp"><span class="tip">出席カード</span><b>${d.getMonth() + 1}月</b><i>${d.getDate()}</i><span>${DOW[d.getDay()]}曜日</span></button>
  <button class="ob map" data-o="cal"><span class="tip">カレンダー</span><span class="rd"></span></button>
  <button class="ob bag" data-o="items"><span class="tip">持ちもの</span></button>
  <button class="ob tb2" data-o="log"><span class="tip">きおくの箱</span></button><div class="ob cr" style="cursor:default"></div>
  <button class="ob dia" data-o="diary"><span class="tip">絵日記をかく</span></button><div class="bub">絵日記</div>
  <div class="ob ts" style="cursor:default"></div><button class="ob ph" data-o="log"><span class="tip">夏休みの思い出</span></button>
  <div class="st">¥<i>${xp}</i> ×<i>${streakCount()}</i>/50</div><button class="back" id="home" style="left:2cqw;right:auto;bottom:1.4cqw">◀ タイトル</button>`;
}
function diary() {
  const e = data[selected]; if (mood === null && e && draft === null) mood = e.mood;
  const d = new Date(selected + "T00:00:00");
  return `<div class="dp" style="position:absolute;inset:0"></div><div class="cov"></div>
  <div class="side"><button class="sb p" id="save">えにっきを<br>しまう</button><input type="date" class="dte" id="dt" value="${selected}" max="${today()}"><div class="hint">${selected === today() ? `夏休み ${streakCount()}日め` : "過去の日を書いています"}</div></div>
  <div class="bk"><div class="pic">${scene(mood, d.getDate())}<div class="wx">${WX.map(([m, ic]) => `<button class="wb ${m === mood ? "on" : ""}" data-m="${m}" title="${m}">${ic}</button>`).join("")}</div></div>
    <div class="tx"><div class="dc"><b>${d.getMonth() + 1}月${d.getDate()}日</b> ◎</div><textarea id="ta" placeholder="きょうは どんな 一日だった？">${esc(draft !== null ? draft : (e ? e.text : ""))}</textarea></div></div>
  <button class="back" id="back">✕ もどる</button>`;
}
const ITEMS = [
  ["ラジオ体操カード", "夏休み中は必ずラジオ体操に参加しよう！ 日記を書いた日には、スタンプがおされるよ。", "stamp"],
  ["はみがきカレンダー", "先月の日記のきろくをふりかえろう。書いた日にスタンプがついているよ。", "prev"],
  ["虫めがね", "これまでに書いた日記を、ひとつずつ見かえしてみよう。", "list"],
  ["はみがきセット", "てんきごとの回数をしらべよう。どんな夏だったかな？", "wx"],
  ["おサイフ", "けいけんちとランクをかくにん。せっていもここから。", "wallet"]
];
function calHtml(y, mo, label) {
  const first = new Date(y, mo, 1).getDay(), last = new Date(y, mo + 1, 0).getDate(), t = today();
  let c = DOW.map(x => `<div class="dw">${x}</div>`).join("") + "<div style='border:0'></div>".repeat(first);
  for (let i = 1; i <= last; i++) { const k = ymd(new Date(y, mo, i)); c += data[k] ? `<div class="stp" data-go="${k}">${i}</div>` : `<div class="${k > t ? "fut" : ""}" ${k <= t ? `data-go="${k}"` : ""}>${k > t ? "☆" : i}</div>`; }
  return `<h5>${label}　${y}年${mo + 1}月</h5><div class="cd">${c}</div>`;
}
function items(forceKind) {
  const it = ITEMS[ii], kind = forceKind || it[2], now = new Date(), all = Object.keys(data);
  let pv = "";
  if (kind === "stamp") pv = calHtml(now.getFullYear(), now.getMonth(), "ラジオ体操 出席カード");
  else if (kind === "prev") { const p = new Date(now.getFullYear(), now.getMonth() - 1, 1); pv = calHtml(p.getFullYear(), p.getMonth(), "はみがきカレンダー"); }
  else if (kind === "list") pv = `<h5>日記ひらいて</h5><div class="pr">${all.sort().reverse().slice(0, 30).map(k => `<button class="rw" data-go="${k}"><b>${md(k)}</b>${esc(data[k].text.replace(/\s+/g, " "))}</button>`).join("") || "<div class='rw'>まだ日記がありません</div>"}</div>`;
  else if (kind === "wx") { const mx = Math.max(1, ...WX.map(([m]) => all.filter(k => data[k].mood === m).length)); pv = `<h5>てんき</h5><div class="pr">${WX.map(([m, ic]) => { const c = all.filter(k => data[k].mood === m).length; return `<div class="br"><span>${ic}${m}</span><div class="t"><i style="width:${c / mx * 100}%"></i></div><b>${c}</b></div>`; }).join("")}</div>`; }
  else { const xp = totalXp(); pv = `<h5>おサイフ</h5><div class="pr"><div class="rw"><b>ランク</b>${Math.floor(xp / XP_PER_RANK) + 1}</div><div class="rw"><b>けいけんち</b>¥${xp}</div><div class="rw"><b>れんぞく</b>${streakCount()}日</div></div><br><button class="btn2" id="theme">テーマ選択にもどる<small>ほかのゲームの見た目でも きろくは共通です</small></button><button class="btn2" id="exp">きろくを書き出す<small>JSONファイルで保存</small></button><button class="btn2" id="imp">きろくを読み込む<small>JSONファイルから復元</small></button>`; }
  return `<div class="gr" style="position:absolute;inset:0"></div><div class="box li"><h4>もちものずかん</h4>${ITEMS.map((x, i) => `<button class="ib ${i === ii ? "on" : ""}" data-i="${i}">${x[0]}</button>`).join("")}</div>
    <div class="pv">${pv}</div><div class="box dsc">${esc(it[1])}</div><button class="back" id="back" style="bottom:.6cqw">✕ もどる</button>`;
}
function render() {
  $("scr").innerHTML = { title, desk, diary, items }[scr]();
}
function go(s) { scr = s; render(); }
function openDiary(k) { selected = k || today(); const e = data[selected]; mood = e ? e.mood : null; draft = null; go("diary"); }
function pickTitle(i) {
  if (i === 0 || i === 1) go("desk"); else if (i === 2) { ii = 2; go("items"); } else { ii = 4; go("items"); }
}
function save() {
  const ta = $("ta"); if (!ta) return; const text = ta.value.trim(); if (!text) { ta.focus(); return; }
  const before = Math.floor(totalXp() / XP_PER_RANK), isNew = !data[selected];
  data[selected] = { mood, text }; store(data); draft = null;
  const up = Math.floor(totalXp() / XP_PER_RANK) > before;
  $("ovT").innerHTML = up ? "また ひとつ<br>夏のおもいでが ふえたよ" : `${md(selected)}の 絵日記が<br>かけたよ！`; $("ovS").textContent = isNew ? `夏休み ${streakCount()}日め` : "なおしたよ";
  const o = $("ov"); o.classList.remove("show"); void o.offsetWidth; o.classList.add("show");
  clearTimeout(ovTimer); ovTimer = setTimeout(() => o.classList.remove("show"), 3300);
  go("desk");
}
document.addEventListener("click", e => {
  const t = e.target.closest(".ti"); if (t) return pickTitle(+t.dataset.t);
  const o = e.target.closest(".ob[data-o]"); if (o) { const v = o.dataset.o; if (v === "diary") return openDiary(today()); if (v === "stamp") { ii = 0; return go("items"); } if (v === "cal") { ii = 1; return go("items"); } if (v === "items") { ii = 4; return go("items"); } if (v === "log") { ii = 2; return go("items"); } }
  const it = e.target.closest(".ib"); if (it) { ii = +it.dataset.i; return render(); }
  const g = e.target.closest("[data-go]"); if (g) return openDiary(g.dataset.go);
  const wb = e.target.closest(".wb"); if (wb) { mood = wb.dataset.m; draft = $("ta").value; return render(); }
  if (e.target.closest("#save")) return save();
  if (e.target.closest("#home")) return go("title");
  if (e.target.closest("#back")) return go(scr === "items" ? "desk" : "desk");
  if (e.target.closest("#theme")) { location.href = "index.html"; return; }
  if (e.target.closest("#exp")) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" })); a.download = "diary-backup.json"; a.click(); return; }
  if (e.target.closest("#imp")) { const f = document.createElement("input"); f.type = "file"; f.accept = "application/json"; f.onchange = () => f.files[0] && f.files[0].text().then(t => { try { const o = JSON.parse(t); for (const k in o) if (o[k] && typeof o[k].text === "string") data[k] = { mood: o[k].mood || null, text: o[k].text }; store(data); render(); } catch { alert("読み込みに失敗しました"); } }); f.click(); return; }
  if (e.target.closest("#ov")) $("ov").classList.remove("show");
});
document.addEventListener("mouseover", e => { const t = e.target.closest(".ti"); if (t && scr === "title" && ti !== +t.dataset.t) { ti = +t.dataset.t; document.querySelectorAll(".ti").forEach(b => b.classList.toggle("on", +b.dataset.t === ti)); } });
document.addEventListener("change", e => { if (e.target.id === "dt" && e.target.value) { draft = $("ta").value; selected = e.target.value; const x = data[selected]; if (x) mood = x.mood; render(); } });
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); return save(); }
  if (e.key === "Escape") { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); if ($("ov").classList.contains("show")) $("ov").classList.remove("show"); else if (scr === "diary" || scr === "items") go("desk"); else if (scr === "desk") go("title"); return; }
  if (/TEXTAREA|INPUT/.test(e.target.tagName)) return;
  if (scr === "title") { if (e.key === "ArrowDown") { ti = (ti + 1) % 4; render(); } else if (e.key === "ArrowUp") { ti = (ti + 3) % 4; render(); } else if (e.key === "Enter") pickTitle(ti); }
  else if (scr === "items") { if (e.key === "ArrowDown") { ii = (ii + 1) % ITEMS.length; render(); } else if (e.key === "ArrowUp") { ii = (ii + ITEMS.length - 1) % ITEMS.length; render(); } }
  else if (scr === "desk" && e.key === "Enter") openDiary(today());
});
render();
</script>
