<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フォールアウト3風 ─ 日記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=DotGothic16&display=swap" rel="stylesheet">
<style>
  /* A landscape wrist-worn Pip-Boy 3000: metal body, side knobs, arm straps, CRT screen with tabs / list / detail / status bar */
  :root { --g:#3dff7a; --g2:#22c859; --gd:#0f5a28; --gh:#b6ffcf; --scr:#020d05; --fh:'Share Tech Mono','DotGothic16',monospace; --fb:'Share Tech Mono','DotGothic16',monospace; }
  * { box-sizing:border-box; margin:0; }
  html, body { min-height:100%; }
  body { font-family:var(--fb); color:var(--g); background:radial-gradient(ellipse at 50% 30%, #1c1f18, #0a0b09 70%); overflow-x:hidden; }
  .stage { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }

  /* device */
  .pip { position:relative; width:min(1120px,100%); aspect-ratio:16/10; min-height:560px; padding:clamp(16px,2.6vw,30px); border-radius:34px;
    background:linear-gradient(145deg,#6a6f5e 0%,#4a4e40 40%,#2c2f26 100%); box-shadow:inset 0 3px 0 rgba(255,255,255,.18), inset 0 -6px 0 rgba(0,0,0,.4), 0 30px 60px rgba(0,0,0,.8); animation:boot .6s both; }
  .pip::before, .pip::after { content:""; position:absolute; top:16%; bottom:16%; width:min(30vw,260px); z-index:-1;
    background:repeating-linear-gradient(0deg,#1b1c17 0 14px,#25271f 14px 18px); box-shadow:inset 0 0 20px #000; }
  .pip::before { right:calc(100% - 20px); border-radius:18px 0 0 18px; } .pip::after { left:calc(100% - 20px); border-radius:0 18px 18px 0; }
  .knob { position:absolute; width:46px; height:46px; border-radius:50%; background:repeating-conic-gradient(#5b604f 0 8deg,#383b30 8deg 16deg); box-shadow:0 4px 0 #1b1c17, inset 0 0 0 4px #2a2c24; }
  .k1 { right:-18px; top:22%; } .k2 { right:-18px; top:calc(22% + 70px); } .k3 { left:-18px; top:30%; width:38px; height:38px; }
  .plate { position:absolute; left:clamp(22px,3.4vw,40px); top:6px; font-size:9px; letter-spacing:.2em; color:#1c1e17; text-shadow:0 1px 0 rgba(255,255,255,.2); }
  .screw { position:absolute; width:9px; height:9px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#aaa,#333); }
  .s1 { left:10px; top:10px; } .s2 { right:10px; top:10px; } .s3 { left:10px; bottom:10px; } .s4 { right:10px; bottom:10px; }

  /* CRT screen */
  .screen { position:relative; width:100%; height:100%; border-radius:46px / 34px; background:var(--scr); overflow:hidden; display:grid; grid-template-rows:auto 1fr auto; padding:18px 26px 14px;
    box-shadow:inset 0 0 0 4px #0a120c, inset 0 0 70px rgba(61,255,122,.18), 0 0 0 6px #1a1c16, 0 0 24px rgba(61,255,122,.25); text-shadow:0 0 6px rgba(61,255,122,.6); }
  .screen::before { content:""; position:absolute; inset:0; z-index:20; pointer-events:none; border-radius:inherit;
    background:repeating-linear-gradient(transparent 0 2px, rgba(0,0,0,.32) 2px 3px), radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.7) 100%); animation:crt 7s steps(1) infinite; }
  .screen::after { content:""; position:absolute; left:0; right:0; height:110px; z-index:21; pointer-events:none; background:linear-gradient(transparent, rgba(61,255,122,.09), transparent); animation:roll 6.5s linear infinite; }

  .tabs { display:flex; align-items:flex-end; gap:0; border-bottom:2px solid var(--g2); padding-bottom:0; position:relative; }
  .tab { all:unset; box-sizing:border-box; cursor:pointer; flex:1; text-align:center; font-family:var(--fh); font-size:clamp(15px,2.2vw,24px); letter-spacing:.18em; padding:6px 0 7px; color:var(--g2); opacity:.7; position:relative; }
  .tab:hover { opacity:1; }
  .tab.on { opacity:1; color:#021006; background:var(--g); text-shadow:none; clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 100%,0 100%); }
  .tabs .date { position:absolute; right:0; top:-14px; font-size:11px; letter-spacing:.2em; color:var(--g2); }
  .body { display:grid; grid-template-columns:minmax(200px,38%) 1fr; gap:22px; padding:16px 4px 6px; min-height:0; }
  .list { display:flex; flex-direction:column; gap:1px; overflow-y:auto; min-height:0; padding-right:6px; }
  .row { all:unset; box-sizing:border-box; display:flex; justify-content:space-between; align-items:center; gap:10px; padding:5px 12px; cursor:pointer; font-family:var(--fh); font-size:clamp(14px,1.8vw,19px); letter-spacing:.06em; color:var(--g); }
  .row small { font-size:12px; opacity:.75; letter-spacing:.04em; }
  .row:hover { background:rgba(61,255,122,.12); }
  .row.sel { background:var(--g); color:#021006; text-shadow:none; } .row.sel small { opacity:.85; }
  .row:focus-visible, .tab:focus-visible, .btn:focus-visible, textarea:focus-visible { outline:2px solid var(--gh); outline-offset:1px; }
  .detail { min-height:0; overflow-y:auto; border-left:2px solid var(--gd); padding:2px 4px 2px 20px; animation:fadeIn .25s both; }
  .detail h4 { font-family:var(--fh); font-weight:400; font-size:clamp(20px,3vw,34px); letter-spacing:.12em; color:var(--gh); margin-bottom:8px; text-shadow:0 0 12px var(--g); }
  .detail p { font-size:clamp(13px,1.6vw,17px); line-height:1.8; color:var(--g); }
  .big { font-family:var(--fh); font-size:clamp(46px,8vw,92px); line-height:1; color:var(--gh); text-shadow:0 0 18px var(--g); margin:6px 0 10px; }
  .gauge { margin:8px 0 14px; } .gauge b { display:flex; justify-content:space-between; font-weight:400; font-size:12px; letter-spacing:.14em; margin-bottom:4px; }
  .track { height:16px; border:2px solid var(--g2); padding:2px; } .track i { display:block; height:100%; width:0; background:repeating-linear-gradient(90deg,var(--g) 0 8px,transparent 8px 10px); box-shadow:0 0 10px var(--g); transition:width .7s cubic-bezier(.2,.9,.3,1); }
  textarea { width:100%; height:min(34vh,260px); min-height:120px; resize:none; padding:10px 12px; font:inherit; font-size:clamp(14px,1.8vw,17px); line-height:1.8; color:var(--gh); background:rgba(61,255,122,.05); border:2px solid var(--g2); outline:none; text-shadow:inherit; }
  textarea::placeholder { color:var(--g2); opacity:.6; }
  textarea:focus { background:rgba(61,255,122,.1); }
  .dh { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:8px; } .dh b { font-weight:400; font-size:clamp(16px,2.2vw,24px); letter-spacing:.1em; color:var(--gh); } .dh span { font-size:12px; letter-spacing:.18em; border:1px solid var(--g2); padding:2px 8px; }
  .acts { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:10px; } .hintx { font-size:12px; color:var(--g2); }
  .btn { all:unset; box-sizing:border-box; cursor:pointer; font-family:var(--fh); font-size:17px; letter-spacing:.2em; padding:6px 22px; border:2px solid var(--g); color:var(--g); transition:.12s; }
  .btn:hover { background:var(--g); color:#021006; text-shadow:none; } .btn:active { transform:scale(.96); }
  .text { white-space:pre-wrap; line-height:1.9; font-size:clamp(13px,1.7vw,17px); color:var(--gh); }
  .empty { opacity:.75; line-height:1.9; }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .cal div { aspect-ratio:1.5; display:flex; align-items:center; justify-content:center; font-size:clamp(12px,1.6vw,16px); border:1px solid var(--gd); }
  .cal .dow { aspect-ratio:auto; border:0; font-size:11px; letter-spacing:.2em; color:var(--g2); } .cal .d { cursor:pointer; transition:.1s; } .cal .d:hover { background:rgba(61,255,122,.2); }
  .cal .done { background:var(--g); color:#021006; text-shadow:none; } .cal .today { outline:2px solid var(--gh); outline-offset:1px; } .cal .selx { box-shadow:0 0 0 2px var(--gh); }

  .foot { display:grid; grid-template-columns:1fr 1fr 1fr; gap:18px; align-items:center; border-top:2px solid var(--g2); padding-top:8px; font-family:var(--fh); font-size:clamp(13px,1.8vw,18px); letter-spacing:.08em; }
  .foot > div { display:flex; align-items:center; gap:10px; } .foot .bar { flex:1; height:10px; border:1px solid var(--g2); } .foot .bar i { display:block; height:100%; background:var(--g); box-shadow:0 0 8px var(--g); transition:width .7s; }
  .foot .mid { justify-content:center; } .foot .rt { justify-content:flex-end; }

  /* discovery overlay */
  #ov { position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center; background:rgba(0,8,2,.82); text-shadow:0 0 10px var(--g); }
  #ov.show { display:flex; animation:fadeIn .15s; }
  #ov .bx { border:2px solid var(--g); padding:22px 40px; text-align:center; background:var(--scr); box-shadow:0 0 40px rgba(61,255,122,.4); animation:pop .35s cubic-bezier(.2,1.6,.4,1); }
  #ovT { font-size:clamp(20px,5vw,40px); letter-spacing:.14em; color:var(--gh); } #ovT::after { content:"█"; animation:blink .7s steps(1) infinite; }
  #ovS { margin-top:8px; font-size:13px; letter-spacing:.3em; color:var(--g2); }
  #ov .ic { font-size:56px; line-height:1; color:var(--g); margin-bottom:6px; }

  @keyframes crt { 0%,100% { opacity:1; } 52% { opacity:.86; } 54% { opacity:1; } }
  @keyframes roll { from { top:-120px; } to { top:100%; } }
  @keyframes boot { from { opacity:0; transform:scale(.96); } }
  @keyframes fadeIn { from { opacity:0; } }
  @keyframes pop { from { transform:scale(.3); opacity:0; } }
  @keyframes blink { 50% { opacity:0; } }

  @media (max-width:760px) {
    .pip { aspect-ratio:auto; min-height:0; border-radius:22px; } .pip::before, .pip::after, .knob { display:none; }
    .screen { border-radius:26px; display:block; padding:14px 14px 12px; }
    .tabs .date { display:none; } .body { grid-template-columns:1fr; gap:12px; } .list { max-height:34vh; } .detail { border-left:0; border-top:2px solid var(--gd); padding:10px 0 0; }
    .foot { grid-template-columns:1fr; gap:6px; margin-top:12px; } .foot .mid, .foot .rt { justify-content:flex-start; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="stage">
  <div class="pip">
    <div class="plate">DIARY INDUSTRIES ─ WRIST LOG 3000</div>
    <i class="screw s1"></i><i class="screw s2"></i><i class="screw s3"></i><i class="screw s4"></i>
    <div class="knob k1"></div><div class="knob k2"></div><div class="knob k3"></div>
    <div class="screen">
      <nav class="tabs" id="tabs" aria-label="タブ"></nav>
      <div class="body"><div class="list" id="list"></div><div class="detail" id="det"></div></div>
      <div class="foot">
        <div><span>HP</span><span id="hp">100/100</span><div class="bar"><i id="hpb" style="width:100%"></i></div></div>
        <div class="mid"><span>LEVEL</span><span id="lv">1</span><div class="bar"><i id="xpb" style="width:0"></i></div></div>
        <div class="rt"><span>AP</span><span>85/85</span></div>
      </div>
    </div>
  </div>
</div>
<div id="ov"><div class="bx"><div class="ic">☢</div><div id="ovT"></div><div id="ovS"></div></div></div>

<script src="theme-switch.js" data-theme="fallout3"></script>
<script>
const KEY = "diary-shared-v1";
const LEGACY = ["persona-diary-v1", "persona3-diary-v1"];
const MOODS = [["最高","HEALTHY"],["良い","GOOD"],["普通","FAIR"],["微妙","POOR"],["最悪","CRITICAL"]];
const RANKS = ["VAULT DWELLER","WANDERER","SCAVENGER","RANGER","CHAMPION","LEGEND","SAVIOR"];
const XP_PER = 100, XP_BONUS_PER_STREAK = 10, XP_PER_RANK = 300;
const TABS = ["STAT", "DATA", "MAP", "LOG"];
const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const DOW = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
const $ = id => document.getElementById(id);
const load = () => {
  try {
    let d = JSON.parse(localStorage.getItem(KEY));
    if (!d) { d = {}; for (const k of LEGACY) { const o = JSON.parse(localStorage.getItem(k) || "{}"); for (const day in o) if (!d[day]) d[day] = o[day]; } }
    return d;
  } catch { return {}; }
};
const store = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = k => k.replace(/-/g, ".");

let data = load(), selected = ymd(new Date()), mood = null, draft = "";
let tab = 0, idx = [0, 0, new Date().getMonth(), 0], overlayTimer, typeTimer;

function streakCount() { let n = 0, d = new Date(); if (!data[ymd(d)]) d.setDate(d.getDate() - 1); while (data[ymd(d)]) { n++; d.setDate(d.getDate() - 1); } return n; }
function totalXp() {
  let xp = 0, run = 0, prev = null;
  for (const k of Object.keys(data).sort()) { const cur = new Date(k + "T00:00:00"); run = prev && (cur - prev) / 864e5 === 1 ? run + 1 : 1; xp += XP_PER + Math.min(run, 30) * XP_BONUS_PER_STREAK; prev = cur; }
  return xp;
}
const rankOf = xp => Math.min(Math.floor(xp / XP_PER_RANK), RANKS.length - 1);
const keysDesc = () => Object.keys(data).sort().reverse();
const loadDay = () => { const e = data[selected]; mood = e ? e.mood : null; draft = e ? e.text : ""; };
const stats = () => {
  const xp = totalXp(), rk = rankOf(xp), st = streakCount(), n = Object.keys(data).length;
  return { xp, rk, st, n, pct: rk >= RANKS.length - 1 ? 100 : Math.round((xp % XP_PER_RANK) / XP_PER_RANK * 100), lvl: 1 + Math.floor(xp / 150) };
};

function renderFoot() {
  const s = stats(), hp = Math.min(100, 40 + s.st * 6);
  $("hp").textContent = hp + "/100"; $("hpb").style.width = hp + "%";
  $("lv").textContent = s.lvl; $("xpb").style.width = s.pct + "%";
}
function renderTabs() {
  const d = new Date(selected + "T00:00:00");
  $("tabs").innerHTML = TABS.map((t, i) => `<button class="tab ${i === tab ? "on" : ""}" data-t="${i}">${t}</button>`).join("") + `<span class="date">${fmt(selected)} ${DOW[d.getDay()]}</span>`;
}
const rows = (items, sel) => items.map((h, i) => `<button class="row ${i === sel ? "sel" : ""}" data-i="${i}">${h}</button>`).join("");

function render() {
  renderTabs(); renderFoot();
  const list = $("list"), det = $("det"), s = stats();
  det.style.animation = "none"; void det.offsetWidth; det.style.animation = "";
  if (tab === 0) {
    const items = [["STREAK 連続日数", s.st + " 日"], ["RANK 階級", RANKS[s.rk]], ["TOTAL 記録数", s.n + " 件"], ["LEVEL レベル", String(s.lvl)]];
    const i = idx[0];
    list.innerHTML = rows(items.map(([a, b]) => `<span>${a}</span><small>${b}</small>`), i);
    const info = [
      ["STREAK", s.st + "<small style='font-size:.3em'> DAYS</small>", "連続で日記を書いた日数です。30日で満タンになります。", Math.min(s.st / 30, 1) * 100, "RAD-FREE ストリーク"],
      ["RANK", RANKS[s.rk], "現在の階級です。記録を続けるほど、次の階級に近づきます。", s.pct, "次の階級まで"],
      ["TOTAL", String(s.n), "これまでに保存した日記の件数です。", Math.min(s.n / 100, 1) * 100, "100件まで"],
      ["LEVEL", String(s.lvl), "経験値から計算したレベルです。", Math.min((s.xp % 150) / 150, 1) * 100, "次のレベルまで"]
    ][i];
    det.innerHTML = `<h4>${info[0]}</h4><div class="big">${info[1]}</div><div class="gauge"><b><span>${info[4]}</span><span>${Math.round(info[3])}%</span></b><div class="track"><i style="width:0" data-w="${info[3]}"></i></div></div><p>${info[2]}</p>`;
    requestAnimationFrame(() => det.querySelectorAll("[data-w]").forEach(el => el.style.width = el.dataset.w + "%"));
  } else if (tab === 1) {
    const mi = MOODS.findIndex(x => x[0] === mood);
    list.innerHTML = rows(MOODS.map(([m, t]) => `<span>${t}</span><small>${m}</small>`), mi);
    const today = selected === ymd(new Date());
    det.innerHTML = `<div class="dh"><b>${fmt(selected)}</b><span id="moodChip">${mood ? MOODS.find(x => x[0] === mood)[1] : "NO DATA"}</span></div>
      <textarea id="body" placeholder="腕のログに記録する…"></textarea>
      <div class="acts"><span class="hintx">${today ? "" : "過去の日付を編集中です(MAP で日付を選べます)"}</span><button class="btn" id="save">[ SAVE ]</button></div>`;
    $("body").value = draft; $("body").addEventListener("input", e => { draft = e.target.value; });
  } else if (tab === 2) {
    list.innerHTML = rows(MONTHS.map((m, i) => `<span>${m}</span><small>${new Date().getFullYear()}</small>`), idx[2]);
    const y = new Date().getFullYear(), mo = idx[2], first = new Date(y, mo, 1).getDay(), last = new Date(y, mo + 1, 0).getDate(), now = ymd(new Date());
    let h = DOW.map(d => `<div class="dow">${d[0]}</div>`).join("") + "<div style='visibility:hidden'></div>".repeat(first);
    for (let d = 1; d <= last; d++) { const k = ymd(new Date(y, mo, d)); h += `<div class="d ${data[k] ? "done" : ""} ${k === now ? "today" : ""} ${k === selected ? "selx" : ""}" data-d="${k}">${d}</div>`; }
    det.innerHTML = `<h4>${MONTHS[mo]} ${y}</h4><div class="cal">${h}</div>`;
  } else {
    const keys = keysDesc(); if (idx[3] >= keys.length) idx[3] = Math.max(0, keys.length - 1);
    list.innerHTML = keys.length ? rows(keys.map(k => `<span>${fmt(k)}</span><small>${esc(data[k].mood || "-")}</small>`), idx[3]) : `<div class="empty">記録なし。</div>`;
    const k = keys[idx[3]];
    det.innerHTML = k ? `<div class="dh"><b>${fmt(k)}</b><span>${esc((MOODS.find(x => x[0] === data[k].mood) || ["", "NO DATA"])[1])}</span></div><div class="text">${esc(data[k].text)}</div><div class="acts"><span></span><button class="btn" id="edit" data-k="${k}">[ EDIT ]</button></div>`
      : `<div class="empty">DATA タブで最初のエントリーを追加せよ。</div>`;
  }
}

function showOverlay(title, sub) {
  const ov = $("ov"); ov.classList.remove("show"); void ov.offsetWidth; ov.classList.add("show");
  clearInterval(typeTimer); let i = 0; $("ovT").textContent = ""; $("ovS").textContent = sub;
  typeTimer = setInterval(() => { $("ovT").textContent = title.slice(0, ++i); if (i >= title.length) clearInterval(typeTimer); }, 40);
  clearTimeout(overlayTimer); overlayTimer = setTimeout(() => ov.classList.remove("show"), 2600);
}
$("ov").onclick = () => $("ov").classList.remove("show");

function saveEntry() {
  const text = $("body").value.trim();
  if (!text) { $("body").focus(); return; }
  const before = rankOf(totalXp()), isNew = !data[selected];
  data[selected] = { mood, text }; draft = text; store(data);
  const up = rankOf(totalXp()) > before;
  showOverlay(up ? "LEVEL UP!" : "LOCATION DISCOVERED", (isNew ? streakCount() + " DAYS" : "UPDATED") + " ─ XP");
  renderFoot();
}
function pickMood(i) {
  mood = MOODS[i][0]; idx[1] = i;
  document.querySelectorAll("#list .row").forEach((r, k) => r.classList.toggle("sel", k === i));
  const c = $("moodChip"); if (c) c.textContent = MOODS[i][1];
}
function openDay(k) { selected = k; loadDay(); tab = 1; idx[1] = Math.max(0, MOODS.findIndex(x => x[0] === mood)); render(); }

$("tabs").addEventListener("click", e => { const b = e.target.closest("[data-t]"); if (!b) return; tab = +b.dataset.t; if (tab === 1) loadDay(); render(); });
$("list").addEventListener("click", e => {
  const b = e.target.closest("[data-i]"); if (!b) return; const i = +b.dataset.i;
  if (tab === 1) return pickMood(i);
  idx[tab] = i; render();
});
$("det").addEventListener("click", e => {
  if (e.target.closest("#save")) return saveEntry();
  const ed = e.target.closest("#edit"); if (ed) return openDay(ed.dataset.k);
  const dd = e.target.closest("[data-d]"); if (dd) openDay(dd.dataset.d);
});
document.addEventListener("keydown", e => {
  if (e.target.matches("textarea, input")) { if (e.key === "Escape") e.target.blur(); return; }
  const len = [4, MOODS.length, 12, keysDesc().length][tab];
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") { tab = (tab + (e.key === "ArrowRight" ? 1 : -1) + TABS.length) % TABS.length; if (tab === 1) loadDay(); render(); }
  else if ((e.key === "ArrowDown" || e.key === "ArrowUp") && len) {
    e.preventDefault(); idx[tab] = (idx[tab] + (e.key === "ArrowDown" ? 1 : -1) + len) % len;
    if (tab === 1) pickMood(idx[1]); else render();
  } else if (e.key === "Enter") { if (tab === 1) $("body").focus(); else if (tab === 3) { const k = keysDesc()[idx[3]]; if (k) openDay(k); } }
});

loadDay(); idx[1] = Math.max(0, MOODS.findIndex(x => x[0] === mood));
render();
</script>
</body>
</html>
