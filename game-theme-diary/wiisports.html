<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sports Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* Console-menu look: white header tab + logo text, aqua band, glossy outlined buttons, globe preview frame, pointer-hand cursor */
  :root { --aq1:#bfe6f4; --aq2:#6cc0e0; --aq3:#3a9ac8; --ink:#14303c; --gr:#6c6c6c; --bl:#2f9ad8; --f:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',sans-serif; --ff:'Fredoka','M PLUS Rounded 1c',sans-serif;
    --hand:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='52' viewBox='0 0 44 52'><path d='M16 4c3-2 7 0 7 4v12l3-1c3-1 6 1 6 4l2-1c3-1 6 1 6 4l1 0c3 0 4 3 4 6v8c0 6-4 12-10 12H20c-5 0-8-3-11-7L2 32c-2-3 1-6 4-5l6 5V8c0-2 1-3 4-4Z' fill='%23fff' stroke='%232f8ad8' stroke-width='3' stroke-linejoin='round'/></svg>") 14 4, pointer; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body { font-family:var(--f); color:var(--ink); overflow:hidden; background:#fff; cursor:var(--hand); }
  button, a, input, textarea, .wb, .sqb { cursor:var(--hand) !important; }
  textarea { cursor:text !important; }
  .app { height:100%; display:grid; grid-template-rows:auto 1fr auto; }

  .hd { position:relative; height:clamp(66px,11vh,96px); background:#fff; border-bottom:4px solid #cfd6da; display:flex; justify-content:space-between; align-items:flex-start; padding-right:4%; animation:fade .4s both; }
  .hd::after { content:""; position:absolute; left:0; right:0; bottom:-8px; height:4px; background:#e4e9ec; }
  .tab { height:100%; padding:0 clamp(60px,9vw,120px) 0 clamp(40px,5vw,60px); display:flex; align-items:center; background:var(--gr); color:#fff; font:700 clamp(24px,3.2vw,40px) var(--ff); letter-spacing:.02em; clip-path:polygon(0 0,100% 0,calc(100% - 40px) 100%,0 100%); margin-top:clamp(0px,.5vh,6px); height:calc(100% - 10px); text-shadow:0 2px 0 rgba(0,0,0,.25); }
  .logo { align-self:center; margin-right:clamp(0px,8vw,140px); font:700 clamp(30px,4.4vw,56px)/1 var(--ff); color:#7a7a7a; letter-spacing:-.01em; } .logo i { color:var(--bl); font-style:italic; }
  .band { position:relative; background:linear-gradient(180deg,var(--aq1),var(--aq2) 60%,var(--aq3)); overflow:hidden; display:grid; padding:clamp(14px,3vh,28px) 4% clamp(14px,3vh,28px) 6%; min-height:0; }
  .band::before { content:""; position:absolute; inset:0; background:radial-gradient(ellipse at 80% 20%, rgba(255,255,255,.55), transparent 55%), repeating-linear-gradient(115deg, rgba(255,255,255,.12) 0 60px, transparent 60px 140px); }
  .band::after { content:""; position:absolute; left:-10%; right:-10%; top:36%; height:7px; background:rgba(255,255,255,.7); transform:rotate(-12deg); filter:blur(1px); }
  .home { position:relative; z-index:2; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.12fr); grid-template-rows:minmax(0,1fr) auto; gap:clamp(10px,1.8vw,22px); min-height:0; }
  .lc { grid-row:1/3; display:flex; flex-direction:column; gap:clamp(6px,1.2vh,12px); min-height:0; }
  .wb { all:unset; box-sizing:border-box; position:relative; flex:1; min-height:44px; display:grid; place-items:center; text-align:center; background:linear-gradient(180deg,#e6f3f7,#c2dce5 55%,#b4d2dd); border:3px solid #1a3a48; border-radius:clamp(14px,1.8vw,22px); font:700 clamp(18px,2.8vw,36px)/1.15 var(--f); color:#111; transition:.12s; box-shadow:0 3px 0 rgba(10,50,70,.35); animation:pop .4s calc(var(--i)*60ms) both; overflow:hidden; }
  .wb::before { content:""; position:absolute; left:6%; right:6%; top:14%; bottom:14%; border-radius:50%; background:radial-gradient(ellipse, rgba(255,255,255,.7), rgba(255,255,255,0) 70%); pointer-events:none; }
  .wb span { position:relative; }
  .wb:hover, .wb.cur { background:linear-gradient(180deg,#f4fbfd,#d6ecf4 55%,#c4e0ea); border-color:#2f9ad8; box-shadow:0 0 0 3px #fff, 0 0 0 6px #2f9ad8, 0 4px 0 6px rgba(10,50,70,.3); transform:scale(1.02); z-index:3; }
  .pv { position:relative; border:4px solid #fff; border-radius:clamp(16px,2.2vw,28px); background:linear-gradient(180deg,#2c7f9c,#1b5a78); overflow:hidden; box-shadow:0 0 0 2px #15506a; min-height:0; display:grid; place-items:center; text-align:center; padding:12px; }
  .pv svg { position:absolute; width:min(120%,520px); aspect-ratio:1; opacity:.45; left:50%; top:50%; transform:translate(-50%,-50%); } .pv svg ellipse, .pv svg circle { fill:none; stroke:#cfeaf4; stroke-width:2.5; } .pv .mer { transform-origin:50% 50%; animation:spin 14s linear infinite; }
  .pv::before { content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 2px, transparent 2px 4px); }
  .pv .tx { position:relative; color:#fff; text-shadow:0 3px 0 rgba(0,40,60,.55); } .pv h3 { font:700 clamp(22px,3.4vw,44px)/1.1 var(--f); } .pv p { font:700 clamp(13px,1.6vw,20px)/1.6 var(--f); margin-top:6px; opacity:.95; } .pv .big { font:700 clamp(40px,7vw,92px)/1 var(--ff); color:#fff; text-shadow:0 4px 0 rgba(0,40,60,.55); } .pv .big small { font-size:.3em; }
  .sq { display:grid; grid-template-columns:1fr 1fr; gap:clamp(10px,1.8vw,22px); }
  .sqb { all:unset; box-sizing:border-box; position:relative; height:clamp(70px,16vh,130px); display:grid; place-items:center; background:linear-gradient(180deg,#e6f3f7,#b4d2dd); border:3px solid #1a3a48; border-radius:clamp(14px,1.8vw,22px); box-shadow:0 3px 0 rgba(10,50,70,.35); transition:.12s; font-size:clamp(34px,6vh,60px); animation:pop .4s .4s both; } .sqb i { display:block; width:clamp(46px,9vh,84px); aspect-ratio:1; border:3px solid; display:grid; place-items:center; font-style:normal; font-size:.9em; } .sqb:first-child i { color:#6a5ad8; background:#dcd8ff; } .sqb:last-child i { color:#2aa88a; background:#d0f4ea; }
  .sqb:hover { border-color:#2f9ad8; box-shadow:0 0 0 3px #fff, 0 0 0 6px #2f9ad8; transform:scale(1.03); } .sqb small { position:absolute; bottom:4px; font:700 11px var(--f); color:#2a5a6a; }

  .ft { background:#fff; border-top:4px solid #cfd6da; height:clamp(54px,9vh,80px); display:flex; align-items:center; justify-content:space-between; padding:0 4%; position:relative; }
  .ft::before { content:""; position:absolute; left:0; right:0; top:-12px; height:4px; background:#e4e9ec; }
  .bk { all:unset; box-sizing:border-box; padding:6px clamp(24px,4vw,56px); border:3px solid #1a3a48; border-radius:30px; background:linear-gradient(180deg,#e6f3f7,#b4d2dd); font:700 clamp(16px,2vw,24px) var(--f); transition:.12s; box-shadow:0 3px 0 rgba(10,50,70,.3); } .bk:hover { border-color:#2f9ad8; box-shadow:0 0 0 3px #2f9ad8; }
  .ft .hint { font:700 clamp(12px,1.3vw,16px) var(--f); color:#5a7a88; }

  /* sub page */
  .sub { position:relative; z-index:2; display:flex; flex-direction:column; gap:10px; min-height:0; animation:fade .3s both; }
  .pn { flex:1; min-height:0; background:rgba(255,255,255,.9); border:4px solid #fff; border-radius:clamp(16px,2.2vw,28px); box-shadow:0 0 0 2px #15506a; padding:clamp(12px,1.8vw,22px); display:flex; flex-direction:column; gap:10px; overflow:hidden; }
  .days { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; flex:none; padding-bottom:2px; } .days::-webkit-scrollbar { display:none; } .dy { all:unset; box-sizing:border-box; flex:none; min-width:clamp(52px,6vw,74px); padding:4px 6px; text-align:center; background:linear-gradient(180deg,#e6f3f7,#b4d2dd); border:3px solid #1a3a48; border-radius:14px; font:700 clamp(16px,2vw,24px)/1.1 var(--ff); transition:.1s; } .dy small { display:block; font:700 11px var(--f); } .dy.rec { background:linear-gradient(180deg,#fff7c0,#ffd84a); } .dy.on { border-color:#2f9ad8; box-shadow:0 0 0 3px #fff, 0 0 0 5px #2f9ad8; } .dy:hover { filter:brightness(1.08); }
  .moods { display:flex; gap:clamp(6px,1vw,12px); flex-wrap:wrap; list-style:none; padding:0; flex:none; } .mt { all:unset; padding:4px clamp(14px,2.2vw,30px); border:3px solid #1a3a48; border-radius:16px; background:linear-gradient(180deg,#e6f3f7,#b4d2dd); font:700 clamp(15px,1.9vw,24px) var(--f); transition:.1s; box-shadow:0 3px 0 rgba(10,50,70,.3); } .mt:hover { border-color:#2f9ad8; } .mt.on { background:linear-gradient(180deg,#ffe98a,#ffb800); border-color:#a86a00; transform:translateY(-2px); }
  textarea { flex:1; min-height:90px; resize:none; width:100%; border:4px solid #2f9ad8; border-radius:18px; background:#fff; padding:10px 16px; font:700 clamp(15px,1.9vw,22px)/1.8 var(--f); color:var(--ink); outline:0; background-image:repeating-linear-gradient(transparent 0 clamp(26px,3.4vw,40px), #d6e9f0 clamp(26px,3.4vw,40px) calc(clamp(26px,3.4vw,40px) + 2px)); } textarea:focus { box-shadow:0 0 0 4px rgba(47,154,216,.35); }
  .ac { display:flex; gap:12px; align-items:center; flex-wrap:wrap; flex:none; } .ok { all:unset; padding:6px clamp(28px,5vw,64px); border:3px solid #1a3a48; border-radius:30px; background:linear-gradient(180deg,#ffe98a,#ffb800); font:800 clamp(18px,2.4vw,28px) var(--f); box-shadow:0 4px 0 rgba(120,70,0,.5); transition:.12s; } .ok:hover { transform:translateY(-2px) scale(1.03); border-color:#2f9ad8; } .dte { font:700 14px var(--f); border:3px solid #1a3a48; border-radius:12px; padding:3px 8px; color:var(--ink); background:#fff; } .hint2 { font:700 13px var(--f); color:#d8503a; }
  .ls { display:flex; flex-direction:column; gap:8px; overflow:auto; min-height:0; flex:1; } .rw { all:unset; box-sizing:border-box; display:grid; grid-template-columns:clamp(54px,6vw,78px) 1fr auto; gap:12px; align-items:center; padding:6px 14px; border:3px solid #1a3a48; border-radius:16px; background:linear-gradient(180deg,#f2fafc,#d6e8ef); flex:none; animation:pop .25s calc(var(--i)*30ms) both; } .rw:hover { border-color:#2f9ad8; } .rw .d { font:700 clamp(20px,2.4vw,30px)/1 var(--ff); text-align:center; } .rw .d small { display:block; font:700 11px var(--f); } .rw .x { font:700 clamp(13px,1.6vw,18px) var(--f); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .rw .m { font:800 13px var(--f); background:var(--bl); color:#fff; padding:2px 12px; border-radius:12px; }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; max-width:640px; } .cal div { aspect-ratio:1.3; border:3px solid #1a3a48; border-radius:12px; display:grid; place-items:center; background:#e6f3f7; font:700 clamp(15px,2vw,24px) var(--ff); } .cal .dow { border:0; background:none; font:800 13px var(--f); aspect-ratio:auto; color:#2a6a88; } .cal .done { background:linear-gradient(180deg,#fff7c0,#ffd84a); } .cal .today { outline:4px solid #2f9ad8; outline-offset:1px; } .cal [data-go] { cursor:var(--hand); }
  .bars { display:flex; flex-direction:column; gap:10px; overflow:auto; } .br { display:grid; grid-template-columns:90px 1fr 60px; gap:12px; align-items:center; font:800 clamp(14px,1.8vw,20px) var(--f); } .br .tr { height:22px; border:3px solid #1a3a48; border-radius:12px; background:#e6f3f7; overflow:hidden; } .br .tr i { display:block; height:100%; background:linear-gradient(180deg,#7ad8ff,#2f9ad8); transition:width .8s; } .br b { font:700 22px var(--ff); text-align:right; }
  .st { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; } .sb { border:3px solid #1a3a48; border-radius:18px; background:linear-gradient(180deg,#f2fafc,#d6e8ef); padding:10px 16px; } .sb small { font:800 13px var(--f); color:#2a6a88; display:block; } .sb b { font:700 clamp(30px,4.4vw,56px)/1.1 var(--ff); }
  .big { all:unset; box-sizing:border-box; display:block; border:3px solid #1a3a48; border-radius:18px; background:linear-gradient(180deg,#e6f3f7,#b4d2dd); padding:12px 20px; font:800 clamp(16px,2vw,22px) var(--f); box-shadow:0 3px 0 rgba(10,50,70,.3); } .big:hover { border-color:#2f9ad8; } .big small { display:block; font:700 13px var(--f); color:#4a7a8a; }
  button:focus-visible, textarea:focus-visible { outline:4px solid #ffb800; outline-offset:2px; }

  #ov { position:fixed; inset:0; z-index:60; display:none; place-content:center; text-align:center; background:radial-gradient(circle, rgba(255,255,255,.55), rgba(40,140,190,.85)); }
  #ov.show { display:grid; animation:fade .2s both, ovOut .4s 2.4s forwards; } #ov b { display:block; font:700 clamp(46px,12vw,140px)/1 var(--ff); color:#ffd02a; -webkit-text-stroke:clamp(3px,.6vw,8px) #1a3a48; paint-order:stroke fill; text-shadow:0 8px 0 rgba(10,50,70,.5); animation:bn .7s cubic-bezier(.3,1.6,.5,1) both; } #ov small { font:800 clamp(16px,3vw,28px) var(--f); color:#14303c; background:#fff; border:3px solid #1a3a48; border-radius:30px; padding:4px 30px; animation:bn .6s .2s both; display:inline-block; margin-top:14px; }
  @keyframes pop { from { opacity:0; transform:scale(.85); } } @keyframes fade { from { opacity:0; } } @keyframes spin { to { transform:rotate(360deg); } } @keyframes bn { from { opacity:0; transform:scale(.3) rotate(-8deg); } } @keyframes ovOut { to { opacity:0; visibility:hidden; } }
  @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration:.01s !important; animation-delay:0s !important; } }
  @media (max-width:820px) { body { overflow-y:auto; overflow-x:hidden; } .app { height:auto; min-height:100%; } .hd { padding-right:0; } .tab { padding-right:60px; font-size:22px; } .logo { font-size:24px; margin-right:12px; } .home { grid-template-columns:1fr; grid-template-rows:auto; } .lc { grid-row:auto; } .wb { min-height:64px; font-size:20px; } .pv { min-height:200px; } .ft { height:auto; padding:10px 4% 70px; } .ft .hint { display:none; } .br { grid-template-columns:70px 1fr 40px; } }
</style>
</head>
<body>
<div class="app">
  <div class="hd"><div class="tab" id="tab">Main Menu</div><div class="logo">Diary<i>Sports</i></div></div>
  <div class="band" id="band"></div>
  <div class="ft"><button class="bk" id="bk" style="visibility:hidden">もどる</button><div class="hint">↑↓ えらぶ / Enter けってい / Esc もどる</div></div>
</div>
<div id="ov"><div><b id="ovT"></b><small id="ovS"></small></div></div>

<script src="theme-switch.js" data-theme="wiis"></script>
<script>
const KEY = "diary-shared-v1";
const LEGACY = ["persona-diary-v1", "persona3-diary-v1"];
const MOODS = ["最高", "良い", "普通", "微妙", "最悪"];
const MENU = [["きょうの日記を\nつける", "write", "今日のできごとを書いて、きろくしよう!"], ["これまでの\nきろく", "log", "書いた日記をふりかえろう。"], ["カレンダー", "cal", "日記を書いた日がわかるよ。"], ["ちょうし集計", "mood", "調子ごとの回数をグラフでみよう。"], ["れんぞきろく", "streak", "れんぞくで書くと記録がのびるよ!"]];
const SQ = [["🏋", "status", "ステータス", "経験値やランクをチェックしよう。"], ["📈", "chart", "週間グラフ", "この1週間の文字数をグラフでみよう。"]];
const TITLES = { write: "日記をつける", log: "きろく", cal: "カレンダー", mood: "ちょうし集計", streak: "れんぞきろく", status: "ステータス", chart: "週間グラフ" };
const MS = [3, 7, 14, 30, 60, 100];
const XP_PER = 100, XP_BONUS_PER_STREAK = 10, XP_PER_RANK = 300;
const DOW = ["日","月","火","水","木","金","土"];
const $ = id => document.getElementById(id);
const load = () => {
  try {
    let d = JSON.parse(localStorage.getItem(KEY));
    if (!d) { d = {}; for (const k of LEGACY) { const o = JSON.parse(localStorage.getItem(k) || "{}"); for (const day in o) if (!d[day]) d[day] = o[day]; } }
    return d;
  } catch { return {}; }
};
const store = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shift = (k, n) => { const d = new Date(k + "T00:00:00"); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const dl = k => { const d = new Date(k + "T00:00:00"); return `${d.getMonth()+1}月${d.getDate()}日（${DOW[d.getDay()]}）`; };

let data = load(), page = null, hov = 0, selected = today(), mood = null, draft = null, ovTimer;
function streakAt(k) { let n = 0, c = k; while (data[c]) { n++; c = shift(c, -1); } return n; }
function streakCount() { const t = today(); return streakAt(data[t] ? t : shift(t, -1)); }
function maxStreak() { let b = 0, run = 0, prev = null; for (const k of Object.keys(data).sort()) { const c = new Date(k + "T00:00:00"); run = prev && (c - prev) / 864e5 === 1 ? run + 1 : 1; b = Math.max(b, run); prev = c; } return b; }
function totalXp() {
  let xp = 0, run = 0, prev = null;
  for (const k of Object.keys(data).sort()) {
    const c = new Date(k + "T00:00:00");
    run = prev && (c - prev) / 864e5 === 1 ? run + 1 : 1;
    xp += XP_PER + Math.min(run, 30) * XP_BONUS_PER_STREAK;
    prev = c;
  }
  return xp;
}
const globe = `<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="92"/><ellipse cx="100" cy="100" rx="92" ry="34"/><ellipse cx="100" cy="100" rx="92" ry="64" opacity=".6"/><g class="mer"><ellipse cx="100" cy="100" rx="30" ry="92"/><ellipse cx="100" cy="100" rx="62" ry="92" opacity=".6"/><ellipse cx="100" cy="100" rx="2" ry="92"/></g></svg>`;

function pvHtml(i) {
  const all = Object.keys(data), st = streakCount(), d = new Date();
  if (i === "welcome") return `<div class="tx"><div class="big">${d.getMonth() + 1}<small>月</small>${d.getDate()}<small>日</small></div><p>れんぞく ${st} 日 ／ ぜんぶで ${all.length} きろく</p></div>`;
  const t = i < MENU.length ? MENU[i] : SQ[i - MENU.length];
  return `<div class="tx"><h3>${(i < MENU.length ? t[0] : t[2]).replace("\n", "")}</h3><p>${t[i < MENU.length ? 2 : 3]}</p></div>`;
}
function home() {
  return `<div class="home"><div class="lc">${MENU.map(([l], i) => `<button class="wb ${i === hov ? "cur" : ""}" data-i="${i}" style="--i:${i}"><span>${l.replace("\n", "<br>")}</span></button>`).join("")}</div>
    <div class="pv" id="pv">${globe}${pvHtml(hov < 0 ? "welcome" : hov)}</div>
    <div class="sq">${SQ.map(([ic, id, lb], i) => `<button class="sqb" data-i="${MENU.length + i}"><i>${ic}</i><small>${lb}</small></button>`).join("")}</div></div>`;
}
function sub() {
  const all = Object.keys(data), ch = all.reduce((s, k) => s + data[k].text.length, 0);
  let b = "";
  if (page === "write") {
    const e = data[selected]; if (mood === null && e && draft === null) mood = e.mood;
    const days = Array.from({ length: 10 }, (_, i) => shift(today(), -i)); if (!days.includes(selected)) days.unshift(selected);
    b = `<div class="days">${days.map(k => `<button class="dy ${k === selected ? "on" : ""} ${data[k] ? "rec" : ""}" data-d="${k}">${new Date(k + "T00:00:00").getDate()}<small>${DOW[new Date(k + "T00:00:00").getDay()]}</small></button>`).join("")}</div>
      <ul class="moods">${MOODS.map(m => `<li><button class="mt ${m === mood ? "on" : ""}" data-m="${m}">${m}</button></li>`).join("")}</ul>
      <textarea id="ta" placeholder="きょうは どんな一日だった？">${esc(draft !== null ? draft : (e ? e.text : ""))}</textarea>
      <div class="ac"><button class="ok" id="save">けってい</button><input type="date" class="dte" id="dt" value="${selected}" max="${today()}"><span class="hint2">${selected === today() ? "" : "過去の日付を編集中"}</span></div>`;
  } else if (page === "log") {
    const ks = all.sort().reverse();
    b = `<div class="ls">${ks.length ? ks.map((k, i) => `<button class="rw" data-go="${k}" style="--i:${Math.min(i, 10)}"><div class="d">${new Date(k + "T00:00:00").getDate()}<small>${new Date(k + "T00:00:00").getMonth() + 1}月</small></div><div class="x">${esc(data[k].text.replace(/\s+/g, " "))}</div><div class="m">${esc(data[k].mood || "-")}</div></button>`).join("") : `<div class="x">まだ きろくがないよ</div>`}</div>`;
  } else if (page === "cal") {
    const n = new Date(), y = n.getFullYear(), mo = n.getMonth(), first = new Date(y, mo, 1).getDay(), last = new Date(y, mo + 1, 0).getDate();
    let c = DOW.map(x => `<div class="dow">${x}</div>`).join("") + "<div style='visibility:hidden;border:0'></div>".repeat(first);
    for (let d = 1; d <= last; d++) { const k = ymd(new Date(y, mo, d)); c += `<div data-go="${k}" class="${data[k] ? "done" : ""} ${k === today() ? "today" : ""}">${d}</div>`; }
    b = `<div style="font:800 20px var(--f)">${y}年${mo + 1}月</div><div class="cal">${c}</div>`;
  } else if (page === "mood") {
    const mc = m => all.filter(k => data[k].mood === m).length, mx = Math.max(1, ...MOODS.map(mc));
    b = `<div class="bars">${MOODS.map(m => `<div class="br"><span>${m}</span><div class="tr"><i style="width:${mc(m) / mx * 100}%"></i></div><b>${mc(m)}</b></div>`).join("")}</div>`;
  } else if (page === "streak") {
    const st = streakCount();
    b = `<div class="bars">${MS.map(n => `<div class="br"><span>${n}日</span><div class="tr"><i style="width:${Math.min(st / n, 1) * 100}%"></i></div><b>${st >= n ? "★" : Math.min(st, n)}</b></div>`).join("")}</div>`;
  } else if (page === "status") {
    const xp = totalXp();
    b = `<div class="st"><div class="sb"><small>ランク</small><b>${Math.floor(xp / XP_PER_RANK) + 1}</b></div><div class="sb"><small>経験値</small><b>${xp}</b></div><div class="sb"><small>れんぞく</small><b>${streakCount()}</b></div><div class="sb"><small>さいだい れんぞく</small><b>${maxStreak()}</b></div><div class="sb"><small>きろく数</small><b>${all.length}</b></div><div class="sb"><small>ぜんぶの文字数</small><b>${ch}</b></div></div>
      <button class="big" id="theme">テーマ選択にもどる<small>ほかのゲームの見た目でも きろくは共通だよ</small></button><button class="big" id="exp">きろくを書き出す<small>JSONファイルで保存</small></button><button class="big" id="imp">きろくを読み込む<small>JSONファイルから復元</small></button>`;
  } else {
    const days = Array.from({ length: 7 }, (_, i) => shift(today(), -(6 - i))), mx = Math.max(10, ...days.map(k => data[k] ? data[k].text.length : 0));
    b = `<div class="bars">${days.map(k => `<div class="br"><span>${new Date(k + "T00:00:00").getDate()}日(${DOW[new Date(k + "T00:00:00").getDay()]})</span><div class="tr"><i style="width:${(data[k] ? data[k].text.length : 0) / mx * 100}%"></i></div><b>${data[k] ? data[k].text.length : 0}</b></div>`).join("")}</div>`;
  }
  return `<div class="sub"><div class="pn">${b}</div></div>`;
}
function render() {
  $("tab").textContent = page ? TITLES[page] : "Main Menu";
  $("bk").style.visibility = page ? "visible" : "hidden";
  $("band").innerHTML = page ? sub() : home();
}
function open(p, k) { if (p === "write") { selected = k || today(); const e = data[selected]; mood = e ? e.mood : null; draft = null; } page = p; render(); }
function choose(i) { if (i < MENU.length) { const p = MENU[i][1]; open(p, p === "write" ? today() : undefined); } else open(SQ[i - MENU.length][1]); }
function save() {
  const ta = $("ta"); if (!ta) return; const text = ta.value.trim(); if (!text) { ta.focus(); return; }
  const before = Math.floor(totalXp() / XP_PER_RANK), isNew = !data[selected];
  data[selected] = { mood, text }; store(data); draft = null;
  const up = Math.floor(totalXp() / XP_PER_RANK) > before;
  $("ovT").textContent = up ? "レベルアップ!" : "ナイス!"; $("ovS").textContent = isNew ? `きろくしたよ ─ ${streakCount()}日れんぞく` : "こうしんしたよ";
  const o = $("ov"); o.classList.remove("show"); void o.offsetWidth; o.classList.add("show");
  clearTimeout(ovTimer); ovTimer = setTimeout(() => o.classList.remove("show"), 2900);
  render();
}
document.addEventListener("click", e => {
  const w = e.target.closest(".wb, .sqb"); if (w) return choose(+w.dataset.i);
  if (e.target.closest("#bk")) { page = null; return render(); }
  const dy = e.target.closest(".dy"); if (dy) return open("write", dy.dataset.d);
  const g = e.target.closest("[data-go]"); if (g) return open("write", g.dataset.go);
  const mt = e.target.closest(".mt"); if (mt) { mood = mt.dataset.m; draft = $("ta").value; return render(); }
  if (e.target.closest("#save")) return save();
  if (e.target.closest("#theme")) { location.href = "index.html"; return; }
  if (e.target.closest("#exp")) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" })); a.download = "diary-backup.json"; a.click(); return; }
  if (e.target.closest("#imp")) { const f = document.createElement("input"); f.type = "file"; f.accept = "application/json"; f.onchange = () => f.files[0] && f.files[0].text().then(t => { try { const o = JSON.parse(t); for (const k in o) if (o[k] && typeof o[k].text === "string") data[k] = { mood: o[k].mood || null, text: o[k].text }; store(data); render(); } catch { alert("読み込みに失敗しました"); } }); f.click(); return; }
  if (e.target.closest("#ov")) $("ov").classList.remove("show");
});
document.addEventListener("mouseover", e => { const w = e.target.closest(".wb, .sqb"); if (w && !page && hov !== +w.dataset.i) { hov = +w.dataset.i; $("pv").innerHTML = globe + pvHtml(hov); document.querySelectorAll(".wb").forEach(b => b.classList.toggle("cur", +b.dataset.i === hov)); } });
document.addEventListener("change", e => { if (e.target.id === "dt" && e.target.value) { draft = $("ta").value; selected = e.target.value; const x = data[selected]; if (x) mood = x.mood; render(); } });
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); return save(); }
  if (e.key === "Escape") { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); if ($("ov").classList.contains("show")) $("ov").classList.remove("show"); else if (page) { page = null; render(); } return; }
  if (/TEXTAREA|INPUT/.test(e.target.tagName) || page) return;
  const n = MENU.length + SQ.length;
  if (e.key === "ArrowDown") { e.preventDefault(); hov = (hov + 1) % n; render(); } else if (e.key === "ArrowUp") { e.preventDefault(); hov = (hov + n - 1) % n; render(); } else if (e.key === "Enter") choose(hov);
});
render();
</script>
</body>
