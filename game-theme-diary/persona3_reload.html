<style>
  /* Status / party-select layout: diagonal member bars on the left, shard backdrop, top L1/R1 banner, bottom-right guide */
  :root { --blue:#0b5cf0; --deep:#041a7a; --sky:#27b6ff; --red:#e8112d; --cy:#38e8ff; --ye:#ffe23a; --ink:#05060a;
    --fb:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN',sans-serif; --fh:'Anton','Barlow Condensed','Zen Kaku Gothic New',sans-serif; --fc:'Barlow Condensed','Zen Kaku Gothic New',sans-serif; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body { font-family:var(--fb); color:#fff; overflow:hidden; max-width:100vw;
    background:radial-gradient(ellipse at 70% 40%, #1f8bff 0%, transparent 60%), linear-gradient(160deg,#0a46d8 0%,#0868f4 45%,#031680 100%); }

  /* shard backdrop */
  .shards { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .shards i { position:absolute; display:block; animation:drift var(--t,14s) ease-in-out infinite alternate; }
  .s1 { left:30%; top:-10%; width:46%; height:120%; background:linear-gradient(180deg,#fff,#bfe3ff); clip-path:polygon(34% 0,100% 0,62% 100%,0 100%); opacity:.92; --t:16s; }
  .s2 { left:46%; top:-6%; width:24%; height:116%; background:var(--ink); clip-path:polygon(40% 0,100% 0,56% 100%,0 100%); --t:11s; opacity:.95; }
  .s3 { left:62%; top:0; width:42%; height:100%; background:linear-gradient(200deg,#46c8ff,#0a64f0 70%); clip-path:polygon(22% 0,100% 0,100% 100%,0 100%,48% 46%); --t:13s; }
  .s4 { left:-8%; top:58%; width:60%; height:60%; background:var(--ink); clip-path:polygon(0 38%,100% 0,86% 100%,0 100%); --t:18s; opacity:.9; }
  .s5 { left:70%; top:62%; width:34%; height:44%; background:#fff; clip-path:polygon(30% 0,100% 20%,70% 100%,0 70%); --t:9s; opacity:.9; }
  .s6 { left:18%; top:-6%; width:20%; height:30%; background:var(--sky); clip-path:polygon(0 0,100% 20%,40% 100%); --t:12s; opacity:.8; }
  .s7 { left:80%; top:-4%; width:16%; height:30%; background:var(--ink); clip-path:polygon(40% 0,100% 0,60% 100%,0 70%); --t:8s; }
  .shards::after { content:""; position:absolute; inset:0; background:repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 2px, transparent 2px 40px); }
  .ghost { position:fixed; z-index:0; right:2%; top:6%; font-family:var(--fh); font-size:min(58vw,520px); line-height:.9; color:transparent; -webkit-text-stroke:3px rgba(255,255,255,.55); mix-blend-mode:overlay; pointer-events:none; letter-spacing:-.02em; animation:ghost 6s ease-in-out infinite alternate; }
  .moon { position:fixed; z-index:0; right:7%; bottom:12%; font-size:min(18vw,150px); filter:drop-shadow(0 0 30px #9ee) ; opacity:.9; pointer-events:none; }

  .app { position:relative; z-index:2; height:100%; display:grid; grid-template-rows:auto 1fr auto; }

  /* banner */
  .banner { display:flex; justify-content:center; align-items:center; gap:14px; padding:14px 20px 4px; animation:dropIn .5s both; }
  .bn { all:unset; cursor:pointer; display:flex; align-items:center; gap:8px; font-family:var(--fh); font-size:20px; letter-spacing:.06em; color:#fff; text-shadow:0 2px 0 #000; }
  .bn b { color:var(--red); font-size:26px; -webkit-text-stroke:1px #000; transition:transform .15s; }
  .bn:hover b { transform:scale(1.25); }
  .bt { position:relative; padding:6px 38px; background:var(--ink); transform:skewX(-14deg); box-shadow:5px 5px 0 var(--red); min-width:240px; text-align:center; }
  .bt span { display:block; transform:skewX(14deg); font-size:clamp(18px,3vw,28px); font-weight:900; letter-spacing:.12em; }
  .tabs { display:flex; gap:6px; justify-content:center; padding:2px 0 6px; font-family:var(--fc); letter-spacing:.2em; font-size:12px; font-weight:700; }
  .tabs i { padding:1px 12px; background:rgba(0,0,0,.45); transform:skewX(-14deg); font-style:normal; color:#cfe6ff; }
  .tabs i.on { background:#fff; color:#000; }

  .main { display:grid; grid-template-columns:minmax(300px,430px) 1fr; gap:20px; min-height:0; padding:6px 24px 4px 0; }

  /* party bars */
  .party { display:flex; flex-direction:column; gap:10px; padding:10px 0 0; overflow:hidden auto; min-height:0; }
  .mem { all:unset; position:relative; display:block; cursor:pointer; margin-left:-30px; height:78px; flex:0 0 auto;
    transform:skewX(-14deg); background:var(--ink); color:#fff; box-shadow:6px 6px 0 rgba(0,0,0,.35);
    animation:barIn .5s calc(var(--i)*70ms + .1s) cubic-bezier(.2,.9,.25,1) both; transition:margin .15s, background .12s, color .12s; }
  .mem::before { content:""; position:absolute; left:14px; top:0; bottom:0; width:34px; background:var(--c, var(--sky)); clip-path:polygon(0 0,100% 0,60% 100%,0 100%); }
  .mem::after { content:""; position:absolute; right:-1px; bottom:0; width:70px; height:14px; background:var(--c, var(--sky)); clip-path:polygon(40% 0,100% 0,100% 100%,0 100%); opacity:.9; }
  .mem > * { transform:skewX(14deg); }
  .mem .role { position:absolute; left:52px; top:50%; transform:skewX(14deg) rotate(-90deg); transform-origin:left top; margin-top:30px; font-family:var(--fc); font-weight:800; font-size:11px; letter-spacing:.26em; white-space:nowrap; opacity:.85; }
  .mem .nm { position:absolute; left:82px; top:7px; font-family:var(--fh); font-size:30px; letter-spacing:.04em; line-height:1; }
  .mem .nm small { font-family:var(--fc); font-size:13px; letter-spacing:.18em; margin-left:8px; opacity:.8; }
  .mem .lv { position:absolute; left:84px; bottom:7px; font-family:var(--fc); font-weight:800; font-size:14px; letter-spacing:.1em; }
  .mem .lv b { font-family:var(--fh); font-size:20px; font-weight:400; margin-left:3px; }
  .mem .num { position:absolute; right:30px; top:9px; text-align:right; font-family:var(--fh); font-size:20px; line-height:1.15; letter-spacing:.04em; }
  .mem .num em { font-style:normal; font-family:var(--fc); font-size:12px; font-weight:800; margin-right:6px; opacity:.8; letter-spacing:.1em; }
  .mem .hp { color:var(--cy); } .mem .sp { color:var(--ye); }
  .mem:hover { margin-left:-18px; }
  .mem.cur { margin-left:0; background:#fff; color:#000; box-shadow:0 0 0 4px var(--red), 8px 8px 0 rgba(0,0,0,.4); z-index:3; }
  .mem.cur .hp { color:#0a7fb0; } .mem.cur .sp { color:#b88a00; }
  .mem.empty .num { opacity:.55; }
  .mem:focus-visible { outline:3px solid var(--ye); outline-offset:4px; }

  .stats { margin-top:6px; padding:8px 18px 8px 38px; background:rgba(0,0,0,.6); transform:skewX(-14deg); margin-left:-24px; flex:0 0 auto; }
  .stats > div { transform:skewX(14deg); display:grid; grid-template-columns:100px 1fr auto; gap:8px; align-items:center; font-family:var(--fc); font-weight:700; letter-spacing:.14em; font-size:12px; margin:2px 0; }
  .pips { display:flex; gap:3px; } .pips u { width:15px; height:7px; background:rgba(255,255,255,.2); transform:skewX(-20deg); }
  .pips u.on { background:var(--cy); box-shadow:0 0 6px var(--cy); }
  .stats b { font-family:var(--fh); font-weight:400; font-size:16px; color:var(--ye); }

  /* detail */
  .detail { position:relative; min-height:0; display:flex; flex-direction:column; gap:10px; animation:fadeIn .45s .2s both; }
  .card { position:relative; display:flex; flex-direction:column; min-height:0; flex:1; background:rgba(5,6,10,.86); clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,28px 100%,0 calc(100% - 28px)); padding:18px 26px 20px 30px; }
  .card.pan { animation:panIn .3s cubic-bezier(.2,.9,.3,1); }
  .card::before { content:""; position:absolute; left:0; top:0; width:100%; height:6px; background:linear-gradient(90deg,var(--red) 0 30%, transparent 30%); }
  .card h2 { display:flex; align-items:baseline; gap:14px; font-family:var(--fh); font-weight:400; letter-spacing:.05em; }
  .card h2 .bigd { font-size:clamp(52px,9vw,96px); line-height:.95; }
  .card h2 .bigd s { text-decoration:none; color:var(--red); margin:0 4px; }
  .card h2 .dw { font-family:var(--fc); font-weight:800; font-size:20px; letter-spacing:.3em; color:var(--cy); }
  .card h2 .mn { margin-left:auto; font-size:46px; }
  .lbl { font-family:var(--fc); font-weight:800; letter-spacing:.3em; font-size:12px; color:var(--sky); margin:10px 0 5px; }
  .moods { display:flex; gap:6px; list-style:none; padding:0; flex-wrap:wrap; }
  .moods button { all:unset; cursor:pointer; padding:5px 16px; background:#1a1d26; transform:skewX(-14deg); font-weight:900; letter-spacing:.1em; font-size:14px; transition:.12s; }
  .moods button > * { display:inline-block; transform:skewX(14deg); } .moods button span { margin-left:6px; font-family:var(--fc); font-size:10px; letter-spacing:.2em; opacity:.6; }
  .moods button:hover { background:#2a3a66; }
  .moods button.on { background:#fff; color:#000; box-shadow:0 0 0 3px var(--red); }
  textarea { flex:1; min-height:110px; resize:none; width:100%; color:#fff; font:500 16px/1.8 var(--fb); background:repeating-linear-gradient(transparent 0 28px, rgba(255,255,255,.14) 28px 29px); border:0; border-left:4px solid var(--red); padding:4px 12px; outline:0; }
  textarea:focus { background-color:rgba(39,182,255,.1); }
  .acts { display:flex; align-items:center; gap:14px; margin-top:12px; }
  .save { all:unset; cursor:pointer; padding:8px 44px; background:var(--red); font-family:var(--fh); font-size:22px; letter-spacing:.1em; transform:skewX(-14deg); box-shadow:5px 5px 0 #fff; transition:.12s; }
  .save:hover { transform:skewX(-14deg) translate(-2px,-2px); box-shadow:7px 7px 0 var(--cy); }
  .save:focus-visible { outline:3px solid var(--ye); outline-offset:3px; }
  .hint { font-size:12px; color:var(--ye); letter-spacing:.06em; }
  .gauge { flex:1; min-width:100px; } .gauge b { display:flex; justify-content:space-between; font-family:var(--fc); letter-spacing:.2em; font-size:11px; margin-bottom:2px; }
  .gauge .tr { height:9px; background:rgba(255,255,255,.15); transform:skewX(-20deg); } .gauge .tr div { height:100%; transition:width .8s cubic-bezier(.2,.9,.3,1); }
  .g1 b { color:var(--cy); } .g1 .tr div { background:linear-gradient(90deg,#0a9bd0,var(--cy)); box-shadow:0 0 8px var(--cy); }
  .g2 b { color:var(--ye); } .g2 .tr div { background:linear-gradient(90deg,#d49a00,var(--ye)); }

  /* log / calendar */
  .log { overflow:auto; min-height:0; flex:1; margin-top:10px; display:flex; flex-direction:column; gap:8px; padding-right:6px; }
  .ent { all:unset; display:block; cursor:pointer; padding:8px 14px 8px 18px; background:#12151e; border-left:5px solid var(--red); animation:fadeIn .3s calc(var(--i)*40ms) both; }
  .ent:hover { background:#1b2a58; } .ent small { font-family:var(--fc); font-weight:800; letter-spacing:.2em; color:var(--cy); font-size:12px; } .ent p { font-size:13px; line-height:1.6; color:#dfe6f5; white-space:pre-wrap; max-height:3.3em; overflow:hidden; }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:12px; max-width:520px; }
  .cal div { aspect-ratio:1.25; display:grid; place-items:center; font-family:var(--fh); font-size:20px; background:#12151e; clip-path:polygon(0 0,100% 0,100% 70%,82% 100%,0 100%); animation:fadeIn .3s calc(var(--i)*14ms) both; }
  .cal .dow { background:none; font-family:var(--fc); font-size:12px; letter-spacing:.2em; color:var(--sky); aspect-ratio:auto; }
  .cal .done { background:var(--sky); color:#000; } .cal .today { box-shadow:inset 0 0 0 3px var(--red); } .cal .sel { background:#fff; color:#000; }
  .cal [data-d] { cursor:pointer; }

  /* guide */
  .foot { display:flex; justify-content:flex-end; align-items:flex-end; padding:2px 24px 14px; }
  .guide { text-align:right; font-family:var(--fc); }
  .guide .q { display:inline-block; background:var(--ink); padding:3px 22px; font-weight:800; font-size:17px; letter-spacing:.12em; transform:skewX(-14deg); box-shadow:4px 4px 0 var(--red); }
  .guide .q span { display:inline-block; transform:skewX(14deg); font-family:var(--fb); }
  .guide .g { display:flex; gap:16px; justify-content:flex-end; margin-top:8px; font-weight:800; font-size:14px; letter-spacing:.12em; text-shadow:0 1px 0 #000; flex-wrap:wrap; }
  .guide .g em { font-style:normal; background:#fff; color:#000; padding:0 7px; margin-right:5px; font-size:12px; }
  .guide .g b { color:var(--ye); font-size:11px; letter-spacing:.3em; margin-right:6px; }

  /* save overlay */
  #ov { position:fixed; inset:0; z-index:60; pointer-events:none; visibility:hidden; }
  #ov.show { visibility:visible; pointer-events:auto; animation:ovOut .4s 2.4s forwards; }
  #ov .a, #ov .b, #ov .c { position:absolute; inset:-10%; }
  #ov .a { background:var(--ink); clip-path:polygon(0 0,0 0,-20% 100%,-30% 100%); }
  #ov .b { background:#fff; clip-path:polygon(0 0,0 0,-20% 100%,-30% 100%); }
  #ov .c { background:var(--red); clip-path:polygon(0 0,0 0,-20% 100%,-30% 100%); }
  #ov.show .a { animation:wipe .45s cubic-bezier(.7,0,.2,1) forwards; } #ov.show .b { animation:wipe .45s .1s cubic-bezier(.7,0,.2,1) forwards; } #ov.show .c { animation:wipe .45s .2s cubic-bezier(.7,0,.2,1) forwards; }
  #ov .t { position:absolute; inset:0; display:grid; place-content:center; text-align:center; opacity:0; }
  #ov.show .t { animation:txt .5s .55s forwards; }
  #ov .t b { display:block; font-family:var(--fh); font-weight:400; font-size:clamp(46px,12vw,130px); color:#fff; letter-spacing:.04em; -webkit-text-stroke:0; text-shadow:6px 6px 0 #000; transform:skewX(-10deg); }
  #ov .t small { font-family:var(--fc); font-weight:800; letter-spacing:.5em; font-size:18px; color:#000; background:#fff; padding:2px 18px; }

  @keyframes drift { to { transform:translate(var(--dx,24px), var(--dy,-18px)) rotate(var(--dr,1.2deg)); } }
  .s2 { --dx:-30px; --dy:20px; } .s3 { --dx:-20px; --dy:30px; --dr:-1deg; } .s5 { --dx:40px; --dy:-22px; }
  @keyframes ghost { to { transform:translate(-14px,10px); } }
  @keyframes dropIn { from { transform:translateY(-40px); opacity:0; } }
  @keyframes barIn { from { transform:translateX(-120%) skewX(-14deg); opacity:0; } }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } }
  @keyframes panIn { from { opacity:0; transform:translateX(26px); } }
  @keyframes wipe { to { clip-path:polygon(0 0,130% 0,110% 100%,-30% 100%); } }
  @keyframes txt { from { opacity:0; transform:scale(1.4); } to { opacity:1; transform:none; } }
  @keyframes ovOut { to { opacity:0; visibility:hidden; } }
  @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration:.01s !important; animation-delay:0s !important; } }
  @media (max-width: 820px) {
    body { overflow-y:auto; overflow-x:hidden; } .app { height:auto; min-height:100%; }
    .main { grid-template-columns:1fr; padding:6px 14px; }
    .party { flex-direction:row; overflow-x:auto; padding:10px 6px 14px 40px; }
    .mem { margin-left:0; width:290px; } .mem.cur, .mem:hover { margin-left:0; }
    .stats { display:none; } .ghost, .moon { opacity:.5; }
    .main > * { min-width:0; } .banner { padding:14px 8px 4px; gap:6px; } .bn { font-size:16px; } .app { overflow-x:hidden; } .shards, .ghost { max-width:100vw; }
    .foot { padding:8px 14px 80px; } .bt { min-width:0; padding:6px 20px; } .card { padding:16px 18px 18px 22px; }
  }
</style>

<div class="shards"><i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="s4"></i><i class="s5"></i><i class="s6"></i><i class="s7"></i></div>

    <div class="banner">

<script src="theme-switch.js" data-theme="p3r"></script>
<script>
const KEY = "diary-shared-v1";
const LEGACY = ["persona-diary-v1", "persona3-diary-v1"];
const MOODS = [["最高", "EXCELLENT"], ["良い", "GOOD"], ["普通", "NORMAL"], ["微妙", "TIRED"], ["最悪", "SLUMP"]];
const RANKS = ["I", "II", "III", "IV", "V", "VI", "VII"];
const TABS = ["ステータス確認", "記録の履歴", "月間カレンダー"];
const QS = ["誰の日記を確認する?", "どの記録を開く?", "どの日を見る?"];
const COLS = ["#e8112d", "#27b6ff", "#ffe23a", "#38e8a8", "#ff8a2a", "#c58bff", "#fff"];
const XP_PER = 100, XP_BONUS_PER_STREAK = 10, XP_PER_RANK = 300;
const DOW = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
const $ = id => document.getElementById(id);

const load = () => {
  try {
    let d = JSON.parse(localStorage.getItem(KEY));
    if (!d) { d = {}; for (const k of LEGACY) { const o = JSON.parse(localStorage.getItem(k) || "{}"); for (const day in o) if (!d[day]) d[day] = o[day]; } }
    return d;
  } catch { return {}; }
};
const store = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const moonOf = d => { const age = (((d - Date.UTC(2000,0,6,18,14)) / 864e5) % 29.530588 + 29.530588) % 29.530588;
  return ["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"][Math.round(age / 29.530588 * 8) % 8]; };

let data = load(), selected = ymd(new Date()), mood = null, tab = 0, draft = null, ovTimer;

function streakAt(k) {
  let n = 0; const d = new Date(k + "T00:00:00");
  while (data[ymd(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function streakCount() { const d = new Date(); if (!data[ymd(d)]) d.setDate(d.getDate() - 1); return streakAt(ymd(d)); }
function totalXp() {
  let xp = 0, run = 0, prev = null;
  for (const k of Object.keys(data).sort()) {
    const cur = new Date(k + "T00:00:00");
    run = prev && (cur - prev) / 864e5 === 1 ? run + 1 : 1;
    xp += XP_PER + Math.min(run, 30) * XP_BONUS_PER_STREAK;
    prev = cur;
  }
  return xp;
}
const rankOf = xp => Math.min(Math.floor(xp / XP_PER_RANK), RANKS.length - 1);
const pips = (v, c = 8) => `<span class="pips">${Array.from({length:c}, (_, i) => `<u class="${i < v ? "on" : ""}"></u>`).join("")}</span>`;

function days() {
  const out = [], t = new Date();
  for (let i = 0; i < 7; i++) { const d = new Date(t); d.setDate(t.getDate() - i); out.push(ymd(d)); }
  if (!out.includes(selected)) out.unshift(selected);
  return out;
}

function renderParty() {
  const today = ymd(new Date()), ds = days();
  $("party").innerHTML = ds.map((k, i) => {
    const e = data[k], d = new Date(k + "T00:00:00");
    const role = k === today ? "LEADER" : i === 1 || (ds[0] !== today && i === 1) ? "PARTY" : k === selected ? "SELECT" : "NAVI";
    return `<button class="mem ${k === selected ? "cur" : ""} ${e ? "" : "empty"}" data-d="${k}" style="--i:${i};--c:${COLS[i % COLS.length]}">
      <span class="role">${role}</span>
      <span class="nm">${d.getMonth()+1}/${d.getDate()}<small>${DOW[d.getDay()]}</small></span>
      <span class="lv">LV<b>${e ? streakAt(k) : "-"}</b>　${e ? esc(e.mood || "-") : "未記録"}</span>
      <span class="num"><span class="hp"><em>HP</em>${e ? streakAt(k) : "--"}</span><br><span class="sp"><em>SP</em>${e ? e.text.length : "--"}</span></span>
    </button>`;
  }).join("") + `<div class="stats">${statsHtml()}</div>`;
}
function statsHtml() {
  const all = Object.values(data), chars = all.reduce((s, e) => s + e.text.length, 0);
  const good = all.filter(e => e.mood === "最高" || e.mood === "良い").length;
  const rows = [["ACADEMICS", Math.min(Math.floor(chars / 300), 8), "学力"], ["CHARM", Math.min(Math.floor(good / 2), 8), "魅力"], ["COURAGE", Math.min(Math.floor(streakCount() / 2), 8), "勇気"]];
  return rows.map(([n, v]) => `<div><span>${n}</span>${pips(v)}<b>${v}</b></div>`).join("");
}

function renderDetail(anim) {
  const d = new Date(selected + "T00:00:00"), xp = totalXp(), rk = rankOf(xp), st = streakCount();
  const pct = rk >= RANKS.length - 1 ? 100 : Math.round((xp % XP_PER_RANK) / XP_PER_RANK * 100);
  const head = `<h2><span class="bigd">${d.getMonth()+1}<s>/</s>${d.getDate()}</span><span class="dw">${DOW[d.getDay()]}</span><span class="mn">${moonOf(d)}</span></h2>`;
  let body = "";
  if (tab === 0) {
    const e = data[selected]; if (mood === null && e) mood = e.mood;
    body = `<div class="lbl">MOOD ─ 今日の調子</div>
      <ul class="moods" id="moods">${MOODS.map(([m, tg]) => `<li><button data-m="${m}" class="${m === mood ? "on" : ""}"><span style="margin:0;opacity:1;font-family:inherit;font-size:inherit;letter-spacing:inherit">${m}</span><span>${tg}</span></button></li>`).join("")}</ul>
      <div class="lbl">RECORD ─ 日記</div>
      <textarea id="body" placeholder="今日はどんな一日だった？">${esc(draft !== null ? draft : (e ? e.text : ""))}</textarea>
      <div class="acts"><button class="save" id="save">SAVE</button>
        <div class="gauge g1"><b><span>HP 連続日数</span><span>${st}</span></b><div class="tr"><div style="width:${Math.min(st / 30, 1) * 100}%"></div></div></div>
        <div class="gauge g2"><b><span>SP 次のランク RANK ${RANKS[rk]}</span><span>${pct}%</span></b><div class="tr"><div style="width:${pct}%"></div></div></div></div>
      <div class="hint">${selected === ymd(new Date()) ? "" : "過去の日付を編集中"}</div>`;
  } else if (tab === 1) {
    const keys = Object.keys(data).sort().reverse();
    body = `<div class="lbl">LOG ─ ${keys.length} ENTRIES</div><div class="log">${keys.length ? keys.map((k, i) =>
      `<button class="ent" data-go="${k}" style="--i:${Math.min(i, 14)}"><small>${k.replace(/-/g, ".")} ／ ${esc(data[k].mood || "-")} ／ ${data[k].text.length}字</small><p>${esc(data[k].text)}</p></button>`).join("") : `<div class="ent"><p>まだ記録がありません。最初の一日を刻もう。</p></div>`}</div>`;
  } else {
    const now = new Date(), y = now.getFullYear(), mo = now.getMonth();
    const first = new Date(y, mo, 1).getDay(), last = new Date(y, mo + 1, 0).getDate();
    let h = DOW.map(c => `<div class="dow">${c.slice(0, 3)}</div>`).join("") + "<div style='visibility:hidden'></div>".repeat(first);
    for (let i = 1; i <= last; i++) {
      const k = ymd(new Date(y, mo, i));
      h += `<div data-go="${k}" style="--i:${i}" class="${data[k] ? "done" : ""} ${k === ymd(now) ? "today" : ""} ${k === selected ? "sel" : ""}">${i}</div>`;
    }
    body = `<div class="lbl">${y}.${String(mo + 1).padStart(2, "0")} ─ ${Object.keys(data).filter(k => k.startsWith(`${y}-${String(mo + 1).padStart(2, "0")}`)).length} DAYS RECORDED</div><div class="cal">${h}</div>`;
  }
  $("detail").innerHTML = `<div class="card ${anim ? "pan" : ""}">${head}${body}</div>`;
  $("ghost").textContent = d.getDate();
  $("moon").textContent = moonOf(d);
}

function render(anim) {
  $("bt").textContent = TABS[tab]; $("q").textContent = QS[tab];
  [...$("tabs").children].forEach((t, i) => t.classList.toggle("on", i === tab));
  renderParty(); renderDetail(anim);
}
function pick(k) { selected = k; mood = null; draft = null; render(true); }
function setTab(n) { tab = (n + 3) % 3; draft = null; render(true); }

document.addEventListener("click", e => {
  const m = e.target.closest(".mem"); if (m) return pick(m.dataset.d);
  const g = e.target.closest("[data-go]"); if (g) { tab = 0; return pick(g.dataset.go); }
  const mb = e.target.closest("#moods button"); if (mb) { mood = mb.dataset.m; draft = $("body").value; renderDetail(false); return; }
  if (e.target.closest("#save")) return save();
  if (e.target.closest("#prev")) return setTab(tab - 1);
  if (e.target.closest("#next")) return setTab(tab + 1);
  if (e.target.closest("#ov")) $("ov").classList.remove("show");
});
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); return save(); }
  if (e.key === "Escape") { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); $("ov").classList.remove("show"); return; }
  const t = e.target.tagName; if (t === "TEXTAREA" || t === "INPUT") return;
  if (e.key === "q" || e.key === "Q" || e.key === "PageUp") setTab(tab - 1);
  else if (e.key === "e" || e.key === "E" || e.key === "PageDown") setTab(tab + 1);
  else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); const ds = days(), i = ds.indexOf(selected), n = Math.max(0, Math.min(ds.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)));
    if (n !== i) pick(ds[n]);
  }
});

function save() {
  const ta = $("body"); if (!ta) return;
  const text = ta.value.trim();
  if (!text) { ta.focus(); return; }
  const before = rankOf(totalXp()), isNew = !data[selected];
  data[selected] = { mood, text };
  store(data); draft = null;
  const up = rankOf(totalXp()) > before;
  $("ovT").textContent = up ? "RANK UP" : "RECORDED";
  $("ovS").textContent = (isNew ? `${streakCount()} DAYS ─ ` : "UPDATED ─ ") + (up ? "絆が深まった" : "記録完了");
  const ov = $("ov"); ov.classList.remove("show"); void ov.offsetWidth; ov.classList.add("show");
  clearTimeout(ovTimer); ovTimer = setTimeout(() => ov.classList.remove("show"), 2900);
  render(false);
}
render(false);
</script>
</body>
</html>
