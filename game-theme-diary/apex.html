<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>エーペックス風 ─ 日記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Saira+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Pack-opening screen: dark navy floor scene, chamfered rarity cards, hexagonal buttons, spark-bonus panels */
  :root { --ink:#f2f4f8; --dim:#8d96a8; --line:rgba(190,200,220,.45); --panel:rgba(18,24,34,.92); --red:#d2402a; --font:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif; --num:'Saira Semi Condensed','Noto Sans JP',sans-serif; }
  * { box-sizing:border-box; margin:0; }
  html, body { min-height:100%; }
  body { font-family:var(--font); color:var(--ink); overflow-x:hidden; background:linear-gradient(180deg,#0b1018 0%,#121a28 52%,#2b3850 78%,#3a4a66 100%) fixed; }
  body::before { content:""; position:fixed; left:0; right:0; bottom:0; height:46vh; z-index:0; pointer-events:none; opacity:.55;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.04' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .6  0 0 0 0 .66  0 0 0 0 .78  0 0 0 .7 -.25'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
    -webkit-mask-image:linear-gradient(transparent, #000 70%); mask-image:linear-gradient(transparent, #000 70%); }
  body::after { content:""; position:fixed; inset:0; z-index:40; pointer-events:none; background:radial-gradient(ellipse at 50% 40%, transparent 50%, rgba(0,0,0,.6) 100%); }
  .app { position:relative; z-index:1; max-width:1500px; margin:0 auto; min-height:100vh; padding:clamp(18px,4vw,56px) clamp(16px,3.4vw,50px) 40px; display:grid; grid-template-columns:minmax(250px,330px) 1fr minmax(250px,330px); grid-template-rows:auto 1fr auto; gap:14px clamp(14px,3vw,48px); }
  h1 { grid-column:1 / 3; font-weight:300; font-size:clamp(26px,4.2vw,52px); letter-spacing:.06em; text-shadow:0 2px 12px rgba(0,0,0,.5); animation:fadeIn .6s both; }
  h1 small { display:block; font-family:var(--num); font-weight:500; font-size:13px; letter-spacing:.3em; color:var(--dim); margin-top:2px; }

  /* chamfered shapes: outer = border colour, inner = fill */
  .cut { position:relative; background:var(--bc, var(--line)); clip-path:polygon(0 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%); padding:2px; }
  .cut > .in { background:var(--panel); clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%); height:100%; }

  /* left cards */
  .left { grid-row:2; display:flex; flex-direction:column; gap:12px; align-self:start; }
  .pk { all:unset; box-sizing:border-box; cursor:pointer; display:block; --bc:rgba(var(--rgb),.55); transition:.12s; } .first .pk { animation:slide .45s calc(var(--i) * 70ms + .2s) both; }
  .pk .in { display:flex; align-items:center; gap:16px; padding:10px 16px; min-height:92px; background:linear-gradient(135deg,rgba(var(--rgb),.16),rgba(12,16,24,.94) 55%); }
  .pk:hover { filter:brightness(1.18); transform:translateX(4px); }
  .pk.on { --bc:#fff; } .pk.on::after { content:""; position:absolute; right:0; bottom:0; width:22px; height:22px; background:linear-gradient(135deg,transparent 50%,#fff 50%); }
  .hx { width:46px; height:50px; flex:none; background:rgb(var(--rgb)); clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); position:relative; opacity:.9; } .hx::before { content:""; position:absolute; inset:5px; background:#10151f; clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); } .hx::after { content:""; position:absolute; inset:15px; background:rgb(var(--rgb)); transform:rotate(45deg); }
  .pk .n { font-family:var(--num); font-weight:700; font-size:clamp(34px,4vw,46px); line-height:1; letter-spacing:.02em; } .pk .l { font-weight:700; font-size:12px; letter-spacing:.06em; color:rgb(var(--rgb)); margin-top:2px; }
  .buy { all:unset; box-sizing:border-box; cursor:pointer; display:block; margin-top:clamp(10px,2vh,24px); width:100%; text-align:center; padding:20px 10px 16px; font-weight:700; font-size:15px; letter-spacing:.04em; background:linear-gradient(180deg,#4a4e57,#262930 55%,#3a2a2a); border:2px solid rgba(255,255,255,.2); border-bottom:5px solid var(--red); transition:.12s; position:relative; }
  .buy:hover { background:linear-gradient(180deg,#5a5f6a,#30343c 55%,#4a302a); } .back { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:14px; color:var(--dim); cursor:pointer; } .back kbd { font-family:var(--num); font-size:12px; color:#111; background:#cfd6e2; padding:1px 6px; border-radius:2px; }

  /* centre */
  .mid { grid-row:2; position:relative; display:flex; flex-direction:column; align-items:center; gap:12px; min-width:0; }
  .pack { width:clamp(120px,min(20vw,27vh),250px); filter:drop-shadow(0 18px 24px rgba(0,0,0,.55)); animation:bob 4s ease-in-out infinite; } .pack.shake { animation:shake .5s; }
  .pack .tri { transition:fill .3s; }
  @keyframes bob { 50% { transform:translateY(-10px); } } @keyframes shake { 20% { transform:translateX(-12px) rotate(-4deg); } 40% { transform:translateX(12px) rotate(4deg); } 60% { transform:translateX(-8px) rotate(-3deg); } 80% { transform:translateX(8px) rotate(3deg); } }
  .ed { width:min(640px,100%); }
  textarea { display:block; width:100%; height:clamp(100px,17vh,190px); resize:none; padding:12px 16px; font:400 clamp(14px,1.8vw,17px)/1.8 var(--font); color:var(--ink); background:transparent; border:0; outline:none; text-shadow:0 1px 2px #000; } textarea::placeholder { color:var(--dim); }
  .tag { align-self:center; font-weight:700; font-size:14px; letter-spacing:.08em; padding:3px 22px; background:rgba(14,18,28,.9); border:1px solid var(--line); color:rgb(var(--rgb, 200,200,215)); margin-top:6px; }
  .hint { font-size:13px; color:#ffb347; text-align:center; min-height:1.3em; letter-spacing:.04em; }

  /* hex buttons */
  .hexrow { position:sticky; bottom:14px; z-index:5; grid-column:1 / 4; grid-row:3; display:flex; justify-content:center; align-items:center; gap:clamp(4px,1vw,12px); flex-wrap:wrap; padding-top:8px; }
  .hb { all:unset; box-sizing:border-box; cursor:pointer; display:flex; align-items:center; justify-content:center; min-width:clamp(54px,7vw,100px); height:clamp(40px,5.2vw,52px); padding:0 clamp(14px,2.2vw,28px); font-family:var(--num); font-weight:600; font-size:clamp(14px,1.9vw,20px); letter-spacing:.05em;
    background:linear-gradient(180deg,#566177,#2b3345); clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%); box-shadow:inset 0 0 0 2px rgba(255,255,255,.3); transition:.1s; position:relative; }
  .hb:hover { background:linear-gradient(180deg,#6d7a94,#3a4560); } .hb:active { transform:scale(.95); }
  .hb.main { min-width:clamp(150px,22vw,300px); height:clamp(50px,6.4vw,66px); font-family:var(--font); font-weight:700; font-size:clamp(16px,2.2vw,22px); background:linear-gradient(180deg,#59647a,#2c3447); }
  .hb.main::before, .hb.main::after { content:""; position:absolute; top:0; width:10px; height:10px; background:#fff; } .hb.main::before { left:6px; clip-path:polygon(0 0,100% 0,0 100%); } .hb.main::after { right:6px; clip-path:polygon(0 0,100% 0,100% 100%); }
  .hb:focus-visible, .pk:focus-visible, .buy:focus-visible, textarea:focus-visible, .li:focus-visible { outline:2px solid #ffb347; outline-offset:3px; }

  /* right panels */
  .right { grid-row:1 / 3; grid-column:3; display:flex; flex-direction:column; gap:12px; align-self:start; padding-top:4px; animation:fadeIn .6s .3s both; }
  .rp .in { padding:10px 14px 12px; } .rp .t { display:flex; align-items:center; justify-content:space-between; gap:8px; font-weight:700; font-size:16px; letter-spacing:.04em; } .rp .t b { display:inline-flex; align-items:center; gap:8px; font-weight:700; } .rp .t i { width:44px; height:44px; flex:none; border:2px solid #c9d4e8; background:rgba(60,110,200,.3); display:flex; align-items:center; justify-content:center; }
  .rp .bar { height:12px; margin:8px 0 4px; background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.12); } .rp .bar b { display:block; height:100%; width:0; background:repeating-linear-gradient(135deg,#8a6a12 0 6px,#6a500c 6px 12px); transition:width .8s; } .rp .m { display:flex; justify-content:space-between; font-family:var(--num); font-size:13px; color:var(--dim); } .rp .m b { font-weight:600; color:#cfd6e2; }
  .rp p { font-size:13px; color:#c4ccdc; margin-top:6px; line-height:1.6; } .warn { color:#ff6a4a; font-weight:700; font-size:14px; }

  .veil { position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; padding:14px; background:rgba(4,8,14,.78); } .veil.show { display:flex; animation:fadeIn .2s; }
  .win { width:min(760px,100%); max-height:86vh; } .win .in { padding:14px 18px 16px; display:flex; flex-direction:column; max-height:84vh; } .win h2 { font-weight:300; font-size:26px; letter-spacing:.08em; margin-bottom:10px; } .win .x { position:absolute; right:22px; top:16px; z-index:2; }
  .list { display:flex; flex-direction:column; gap:4px; overflow:auto; } .li { all:unset; box-sizing:border-box; cursor:pointer; display:grid; grid-template-columns:7.4em 1fr auto; gap:12px; padding:8px 12px; background:rgba(255,255,255,.05); border-left:4px solid rgb(var(--rgb)); font-size:14px; } .li:hover { background:rgba(255,255,255,.14); } .li span:nth-child(2) { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; color:#c4ccdc; } .li small { font-family:var(--num); color:rgb(var(--rgb)); }
  .sm { all:unset; cursor:pointer; padding:4px 16px; border:1px solid var(--line); font-size:14px; } .sm:hover { background:rgba(255,255,255,.14); }

  /* opening overlay */
  #ov { position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center; flex-direction:column; background:radial-gradient(circle, rgba(var(--rgb),.3), rgba(4,8,14,.94) 70%); }
  #ov.show { display:flex; animation:fadeIn .2s; } #ov .fl { position:absolute; inset:0; background:#fff; opacity:0; animation:flash 1.1s .55s both; pointer-events:none; }
  #ov .pk2 { width:clamp(150px,24vw,260px); animation:shake .55s, burst .5s .55s both; } #ov .rays { position:absolute; left:50%; top:50%; width:150vmax; height:150vmax; margin:-75vmax 0 0 -75vmax; background:repeating-conic-gradient(rgba(var(--rgb),.22) 0 5deg, transparent 5deg 15deg); opacity:0; animation:rays 4s .55s linear both; pointer-events:none; }
  #ovT { position:relative; margin-top:20px; font-family:var(--num); font-weight:700; font-size:clamp(34px,8vw,84px); letter-spacing:.14em; color:rgb(var(--rgb)); text-shadow:0 0 30px rgba(var(--rgb),.8); opacity:0; animation:rise .6s .7s both; } #ovS { position:relative; margin-top:6px; font-size:clamp(14px,2.2vw,20px); letter-spacing:.24em; opacity:0; animation:rise .6s .95s both; }
  @keyframes flash { 0% { opacity:0; } 12% { opacity:.95; } 100% { opacity:0; } } @keyframes burst { to { transform:scale(.01); opacity:0; } } @keyframes rays { from { opacity:1; transform:rotate(0); } to { opacity:.7; transform:rotate(60deg); } } @keyframes rise { from { opacity:0; transform:translateY(20px) scale(.9); } to { opacity:1; transform:none; } }
  @keyframes fadeIn { from { opacity:0; } } @keyframes slide { from { opacity:0; transform:translateX(-30px); } }
  @media (max-width:980px) { .app { grid-template-columns:1fr; grid-template-rows:auto; } h1 { grid-column:1; } .left, .mid, .right, .hexrow { grid-column:1; grid-row:auto; } .right { order:2; } .left { order:1; flex-direction:row; flex-wrap:wrap; } .pk { flex:1 1 150px; } .pk .in { min-height:72px; padding:8px 12px; } .pk .hx { width:34px; height:38px; } .mid { order:3; } .hexrow { order:4; } .buy { order:9; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="app">
  <h1>日記パックを開封する<small>OPEN DIARY PACK</small></h1>
  <aside class="left first" id="left"></aside>
  <main class="mid">
    <svg class="pack" id="pack" viewBox="0 0 200 230" aria-hidden="true"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2f3c"/><stop offset="1" stop-color="#10131b"/></linearGradient></defs>
      <polygon class="tri" points="100,8 188,150 12,150" fill="url(#g1)" stroke="#aab4c8" stroke-width="3"/><polygon class="tri2" id="triC" points="100,8 188,150 100,150" fill="#d8449a" opacity=".85"/>
      <path d="M62 150 L100 70 L138 150Z" fill="none" stroke="#fff" stroke-width="5" opacity=".85"/><path d="M80 150 L100 108 L120 150Z" fill="#fff" opacity=".18"/>
      <rect x="30" y="150" width="140" height="20" fill="#161b26" stroke="#aab4c8" stroke-width="2"/><path d="M36 170 L20 218 M164 170 L180 218 M76 170 L70 222 M124 170 L130 222" stroke="#aab4c8" stroke-width="7" stroke-linecap="round" fill="none"/></svg>
    <div class="tag" id="tag"></div>
    <div class="ed cut"><div class="in"><textarea id="body" placeholder="今日の出来事を、パックに詰めて開封しよう…"></textarea></div></div>
    <div class="hint" id="hint"></div>
  </main>
  <aside class="right" id="right"></aside>
  <div class="hexrow" id="hexrow">
    <button class="hb" data-a="reset">リセット</button><button class="hb" data-d="-5">−5</button><button class="hb" data-d="-1">−1</button>
    <button class="hb main" data-a="open">1個開く</button>
    <button class="hb" data-d="1">+1</button><button class="hb" data-d="5">+5</button><button class="hb" data-a="max">最大</button>
  </div>
</div>
<div class="veil" id="veil"><div class="win cut"><div class="in"><h2>これまでのパック</h2><button class="sm x" id="wx">ESC</button><div class="list" id="wl"></div></div></div></div>
<div id="ov"><div class="rays"></div><svg class="pk2" viewBox="0 0 200 230" aria-hidden="true"><polygon points="100,8 188,150 12,150" fill="#1a1f2c" stroke="#fff" stroke-width="4"/><polygon id="ovC" points="100,8 188,150 100,150" fill="#fff"/></svg><div id="ovT"></div><div id="ovS"></div><div class="fl"></div></div>

<script src="theme-switch.js" data-theme="apex"></script>
<script>
const KEY = "diary-shared-v1";
const LEGACY = ["persona-diary-v1", "persona3-diary-v1"];
const MOODS = [["最高","LEGENDARY","232,181,60","#e8b53c"],["良い","EPIC","180,90,230","#b45ae6"],["普通","RARE","58,168,232","#3aa8e8"],["微妙","COMMON","154,163,178","#9aa3b2"],["最悪","AMPED","216,68,154","#d8449a"]];
const RANKS = ["ROOKIE","BRONZE","SILVER","GOLD","PLATINUM","DIAMOND","APEX PREDATOR"];
const XP_PER = 100, XP_BONUS_PER_STREAK = 10, XP_PER_RANK = 300;
const $ = id => document.getElementById(id);
const load = () => {
  try {
    let d = JSON.parse(localStorage.getItem(KEY));
    if (!d) { d = {}; for (const k of LEGACY) { const o = JSON.parse(localStorage.getItem(k) || "{}"); for (const day in o) if (!d[day]) d[day] = o[day]; } }
    return d;
  } catch { return {}; }
};
const store = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = k => k.replace(/-/g, ".");
const addDays = (k, n) => { const d = new Date(k + "T00:00:00"); d.setDate(d.getDate() + n); return ymd(d); };
const moodOf = m => MOODS.find(x => x[0] === m);

let data = load(), selected = ymd(new Date()), mood = null, draft = "", overlayTimer;
function streakCount() { let n = 0, d = new Date(); if (!data[ymd(d)]) d.setDate(d.getDate() - 1); while (data[ymd(d)]) { n++; d.setDate(d.getDate() - 1); } return n; }
function totalXp() { let xp = 0, run = 0, prev = null; for (const k of Object.keys(data).sort()) { const cur = new Date(k + "T00:00:00"); run = prev && (cur - prev) / 864e5 === 1 ? run + 1 : 1; xp += XP_PER + Math.min(run, 30) * XP_BONUS_PER_STREAK; prev = cur; } return xp; }
const rankOf = xp => Math.min(Math.floor(xp / XP_PER_RANK), RANKS.length - 1);
const loadDay = () => { const e = data[selected]; mood = e ? e.mood : null; draft = e ? e.text : ""; };

function renderLeft() {
  const counts = Object.fromEntries(MOODS.map(m => [m[0], 0])); Object.values(data).forEach(e => { if (counts[e.mood] !== undefined) counts[e.mood]++; });
  $("left").innerHTML = MOODS.map(([m, t, rgb], i) => `<button class="pk cut ${m === mood ? "on" : ""}" data-m="${m}" style="--rgb:${rgb};--i:${i}"><span class="in"><i class="hx"></i><span><div class="n">${counts[m]}</div><div class="l">${m} ─ ${t}</div></span></span></button>`).join("") +
    `<button class="buy" id="buy">過去のパックを見る</button><div class="back" id="back"><kbd>ESC</kbd> 戻る</div>`;
}
function renderRight() {
  const st = streakCount(), xp = totalXp(), rk = rankOf(xp), pct = rk >= RANKS.length - 1 ? 100 : Math.round((xp % XP_PER_RANK) / XP_PER_RANK * 100), n = new Date(), left = 24 - n.getHours() - 1, has = !!data[ymd(n)];
  $("right").innerHTML = `<div class="rp cut"><div class="in"><div class="t"><b>連続ボーナス</b><i><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#fff" stroke-width="2"><path d="M13 3 23 21H3Z"/></svg></i></div><div class="bar"><b style="width:${Math.min(st / 10, 1) * 100}%"></b></div><div class="m"><span>${Math.min(st, 10)}/10</span><span>更新: 残り ${left}時間 ${59 - n.getMinutes()}分</span><b>${has ? 1 : 0}/1</b></div></div></div>
    <div class="rp cut"><div class="in"><div class="t"><b>ランク</b><span class="warn">${has ? "✔ 記録済み" : "⚠ 未記録"}</span></div><p>${RANKS[rk]} ─ 次のランクまで ${100 - pct}%</p><div class="bar"><b style="width:${pct}%"></b></div><div class="m"><span>総記録 ${Object.keys(data).length}</span><b>XP ${xp}</b></div></div></div>`;
}
function renderMid() {
  const m = moodOf(mood), d = new Date(selected + "T00:00:00");
  $("tag").textContent = `${fmt(selected)}（${["日","月","火","水","木","金","土"][d.getDay()]}）${m ? " ─ " + m[1] : ""}`; $("tag").style.setProperty("--rgb", m ? m[2] : "200,200,215");
  $("triC").setAttribute("fill", m ? m[3] : "#d8449a");
  $("hint").textContent = !mood ? "左のカードから、今日の気分(レア度)を選択してください" : selected === ymd(new Date()) ? "" : "過去の日付のパックを編集中です";
  $("body").value = draft;
}
let firstDone = false;
function render() { renderLeft(); renderRight(); renderMid(); if (!firstDone) { firstDone = true; setTimeout(() => $("left").classList.remove("first"), 1200); } }
$("body").addEventListener("input", e => { draft = e.target.value; });

function openWin() {
  const keys = Object.keys(data).sort().reverse();
  $("wl").innerHTML = keys.length ? keys.map(k => { const m = moodOf(data[k].mood) || ["", "—", "154,163,178"]; return `<button class="li" data-k="${k}" style="--rgb:${m[2]}"><span>${fmt(k)}</span><span>${esc(data[k].text.replace(/\s+/g, " ").slice(0, 40))}</span><small>${m[1]}</small></button>`; }).join("") : `<p style="color:#8d96a8;padding:10px">開封したパックはまだありません。</p>`;
  $("veil").classList.add("show");
}
function overlay(up, isNew) {
  const m = moodOf(mood); $("ov").style.setProperty("--rgb", m[2]); $("ovC").setAttribute("fill", m[3]);
  const ov = $("ov"); ov.classList.remove("show"); void ov.offsetWidth; ov.classList.add("show");
  $("ovT").textContent = up ? "RANK UP" : m[1]; $("ovS").textContent = (up ? RANKS[rankOf(totalXp())] + " ─ " : "") + (isNew ? `パックを開封しました ─ ${streakCount()} DAYS` : "パックを更新しました");
  clearTimeout(overlayTimer); overlayTimer = setTimeout(() => ov.classList.remove("show"), 3200);
}
$("ov").onclick = () => $("ov").classList.remove("show");
function save() {
  const text = draft.trim(); if (!text) { $("body").focus(); return; } if (!mood) { $("hint").textContent = "先に、左のカードから気分(レア度)を選択してください"; return; }
  const pk = $("pack"); pk.classList.remove("shake"); void pk.offsetWidth; pk.classList.add("shake");
  const before = rankOf(totalXp()), isNew = !data[selected]; data[selected] = { mood, text }; store(data); render(); overlay(rankOf(totalXp()) > before, isNew);
}

$("left").addEventListener("click", e => {
  const c = e.target.closest("[data-m]"); if (c) { mood = c.dataset.m; return render(); }
  if (e.target.closest("#buy")) return openWin(); if (e.target.closest("#back")) location.href = "index.html";
});
$("hexrow").addEventListener("click", e => {
  const d = e.target.closest("[data-d]"); if (d) { selected = addDays(selected, +d.dataset.d); if (selected > ymd(new Date())) selected = ymd(new Date()); loadDay(); return render(); }
  const a = e.target.closest("[data-a]"); if (!a) return;
  if (a.dataset.a === "reset") { draft = ""; mood = null; render(); } else if (a.dataset.a === "max") { selected = ymd(new Date()); loadDay(); render(); } else if (a.dataset.a === "open") save();
});
$("wl").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (!b) return; selected = b.dataset.k; loadDay(); $("veil").classList.remove("show"); render(); });
$("wx").onclick = () => $("veil").classList.remove("show"); $("veil").addEventListener("click", e => { if (e.target === $("veil")) $("veil").classList.remove("show"); });
document.addEventListener("keydown", e => {
  if (e.target.matches("textarea")) { if (e.key === "Escape") e.target.blur(); else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) save(); return; }
  if (e.key === "Escape") { if ($("ov").classList.contains("show")) return $("ov").classList.remove("show"); if ($("veil").classList.contains("show")) return $("veil").classList.remove("show"); location.href = "index.html"; }
});

loadDay(); render();
</script>
</body>
</html>
