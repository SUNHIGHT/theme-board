  button:focus-visible, textarea:focus-visible { outline:2px solid var(--cy); outline-offset:2px; }

<script>
const KEY = "diary-shared-v1";
const LEGACY = ["persona-diary-v1", "persona3-diary-v1"];
const MOODS = [["最高", "EXCELLENT", "✦"], ["良い", "GOOD", "◈"], ["普通", "NORMAL", "◇"], ["微妙", "TIRED", "▽"], ["最悪", "SLUMP", "☠"]];
const XP_PER = 100, XP_BONUS_PER_STREAK = 10, XP_PER_RANK = 300;
const DOW = ["日","月","火","水","木","金","土"];
const $ = id => document.getElementById(id);
const load = () => {
  try {
    let d = JSON.parse(localStorage.getItem(KEY));
    if (!d) { d = {}; for (const k of LEGACY) { const o = JSON.parse(localStorage.getItem(k) || "{}"); for (const day in o) if (!d[day]) d[day] = o[day]; } }
    return d;
  } catch { return {}; }
};
const store = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// tree: x%, y% (of 100 x 58 box), parent index. node 0 = today.
const N = [[50,88,-1],[35,72,0],[63,72,0],[22,52,1],[43,52,1],[62,50,2],[81,52,2],[10,32,3],[30,30,3],[50,30,4],[69,28,5],[89,32,6],[22,10,8],[50,10,9],[78,10,10]];
let data = load(), tab = 0, page = 0, cur = 0, selected = ymd(new Date()), mood = null, upTimer;

function streakAt(k) { let n = 0; const d = new Date(k + "T00:00:00"); while (data[ymd(d)]) { n++; d.setDate(d.getDate() - 1); } return n; }
function streakCount() { const d = new Date(); if (!data[ymd(d)]) d.setDate(d.getDate() - 1); return streakAt(ymd(d)); }
function totalXp() {
  let xp = 0, run = 0, prev = null;
  for (const k of Object.keys(data).sort()) {
    const cur = new Date(k + "T00:00:00");
    run = prev && (cur - prev) / 864e5 === 1 ? run + 1 : 1;
    xp += XP_PER + Math.min(run, 30) * XP_BONUS_PER_STREAK;
    prev = cur;
  }
  return xp;
}
const dayOf = i => { const d = new Date(); d.setDate(d.getDate() - (page * 15 + i)); return ymd(d); };

function hud() {
  const xp = totalXp(), lv = Math.floor(xp / XP_PER_RANK) + 1, st = streakCount(), n = Object.keys(data).length;
  const chars = Object.values(data).reduce((s, e) => s + e.text.length, 0), into = xp % XP_PER_RANK, pct = Math.round(into / XP_PER_RANK * 100);
  $("lvN").textContent = lv; $("lvB").style.width = pct + "%"; $("cred").textContent = Math.min(n, 99); $("crB").style.width = Math.min(n % 10 * 10 + 10, 100) + "%";
  $("wt").textContent = `${chars}/${Math.max(220, Math.ceil(chars / 220) * 220)}`; $("ed2").textContent = xp.toLocaleString();
  $("ptN").textContent = n; $("perkN").textContent = st;
  $("rkN").textContent = lv; $("xpB").style.width = pct + "%"; $("xpT").textContent = `${into}/${XP_PER_RANK}`; $("xpP").textContent = pct + "%"; $("mlN").textContent = (xp * 7 + 4801252).toString();
  $("rew").innerHTML = Array.from({length:8}, (_, i) => { const l = lv - 3 + i + 1; return `<li class="${i === 3 ? "cur" : i > 3 ? "off" : ""}">${Math.max(l, 1)}</li>`; }).join("");
}

function tree() {
  const today = ymd(new Date());
  let lines = "", nodes = "";
  N.forEach(([x, y, p], i) => {
    const k = dayOf(i), e = data[k], d = new Date(k + "T00:00:00");
    if (p >= 0) { const [px, py] = N[p], my = (py + y) / 2; lines += `<path class="${e && data[dayOf(p)] ? "on" : e || data[dayOf(p)] ? "on in" : ""}" d="M${px} ${py} V${my} H${x} V${y}"/>`; }
    const m = e && MOODS.find(m => m[0] === e.mood);
    nodes += `<button class="nd ${e ? "done" : ""} ${i === cur ? "cur" : ""}" data-i="${i}" style="left:${x}%;top:${y}%;--i:${i}" aria-label="${k}">
      <span class="ct">${e ? 1 : 0}/1</span><span class="f"><span class="g">${e ? (m ? m[2] : "◆") : "＋"}</span><span class="dt">${d.getMonth()+1}/${d.getDate()}${k === today ? " ★" : ""}</span></span></button>`;
  });
  $("main").innerHTML = `<div class="tree" id="tr"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${lines}</svg>${nodes}<div class="tip" id="tip"></div></div>`;
  tipFor(cur);
}
function tipFor(i) {
  const k = dayOf(i), e = data[k], d = new Date(k + "T00:00:00"), [x, y] = N[i], t = $("tip"); if (!t) return;
  t.innerHTML = `<h3>${d.getMonth()+1}月${d.getDate()}日（${DOW[d.getDay()]}）<em>${e ? "最大" : "未習得"}</em></h3><div class="t1">${e ? "パッシブ ─ " + esc(e.mood || "-") : "未記録のパーク"}</div>
    <div class="t2"><b>LV ${e ? streakAt(k) : 0}</b>${e ? esc(e.text) : "クリックして記録をアップロードする"}</div>`;
  t.style.left = (x > 60 ? x - 7 - 33 : x + 6.5) + "%"; t.style.top = Math.max(2, Math.min(y - 12, 62)) + "%"; t.classList.add("show");
}
function logView() {
  const keys = Object.keys(data).sort().reverse();
  $("main").innerHTML = `<div class="view" style="width:100%"><div class="vh">JOURNAL ─ ${keys.length} ENTRIES</div>${keys.length ? keys.map((k, i) =>
    `<button class="ent" data-go="${k}" style="--i:${Math.min(i, 14)}"><small>${k.replace(/-/g, ".")} ／ ${esc(data[k].mood || "-")} ／ ${data[k].text.length}字</small><p>${esc(data[k].text)}</p></button>`).join("") : `<div class="ent"><p>まだ記録がありません。ジャーナルの＋から最初の一日をアップロードしよう。</p></div>`}</div>`;
}
function calView() {
  const now = new Date(), y = now.getFullYear(), mo = now.getMonth(), first = new Date(y, mo, 1).getDay(), last = new Date(y, mo + 1, 0).getDate();
  let h = DOW.map(c => `<div class="dow">${c}</div>`).join("") + "<div style='visibility:hidden'></div>".repeat(first);
  for (let i = 1; i <= last; i++) { const k = ymd(new Date(y, mo, i)); h += `<div data-go="${k}" class="${data[k] ? "done" : ""} ${k === ymd(now) ? "today" : ""}">${i}</div>`; }
  $("main").innerHTML = `<div class="view" style="width:100%"><div class="vh">${y}.${String(mo + 1).padStart(2, "0")}</div><div class="cal">${h}</div></div>`;
}
function render() {
  document.querySelectorAll(".nb").forEach(b => b.classList.toggle("on", +b.dataset.t === tab));
  document.querySelectorAll(".sb").forEach(b => b.classList.toggle("on", +b.dataset.p === page));
  $("subs").style.visibility = tab === 0 ? "visible" : "hidden";
  hud(); [tree, logView, calView][tab]();
}

function openEd(k) {
  selected = k; const e = data[k], d = new Date(k + "T00:00:00"); mood = e ? e.mood : null;
  $("eT").textContent = `${d.getMonth()+1}月${d.getDate()}日（${DOW[d.getDay()]}）`; $("eS").textContent = k.replace(/-/g, ".") + (e ? " ─ UPDATE" : " ─ NEW");
  $("moods").innerHTML = MOODS.map(([m, t]) => `<li><button data-m="${m}" class="${m === mood ? "on" : ""}">${m}<span>${t}</span></button></li>`).join("");
  $("body").value = e ? e.text : ""; $("hint").textContent = k === ymd(new Date()) ? "" : "過去の日付を編集中";
  $("ed").classList.add("show"); setTimeout(() => $("body").focus(), 30);
}
const closeEd = () => $("ed").classList.remove("show");
function save() {
  const text = $("body").value.trim(); if (!text) { $("body").focus(); return; }
  const before = Math.floor(totalXp() / XP_PER_RANK), isNew = !data[selected];
  data[selected] = { mood, text }; store(data);
  const up = Math.floor(totalXp() / XP_PER_RANK) > before;
  $("upT").textContent = up ? "LEVEL UP" : "UPLOAD COMPLETE"; $("upS").textContent = isNew ? `${streakCount()} DAY STREAK` : "UPDATED";
  const u = $("up"); u.classList.remove("show"); void u.offsetWidth; u.classList.add("show");
  clearTimeout(upTimer); upTimer = setTimeout(() => u.classList.remove("show"), 3000);
  closeEd(); render();
}

document.addEventListener("click", e => {
  const nb = e.target.closest(".nb"); if (nb) { tab = +nb.dataset.t; return render(); }
  const sb = e.target.closest(".sb"); if (sb) { page = +sb.dataset.p; cur = 0; return render(); }
  const nd = e.target.closest(".nd"); if (nd) { cur = +nd.dataset.i; return openEd(dayOf(cur)); }
  const go = e.target.closest("[data-go]"); if (go) return openEd(go.dataset.go);
  const mb = e.target.closest("#moods button"); if (mb) { mood = mb.dataset.m; document.querySelectorAll("#moods button").forEach(b => b.classList.toggle("on", b === mb)); return; }
  if (e.target.closest("#save")) return save();
  if (e.target.closest("#cl")) return closeEd();
  if (e.target.closest("#up")) $("up").classList.remove("show");
  if (e.target.id === "ed") closeEd();
});
document.addEventListener("mouseover", e => { const nd = e.target.closest(".nd"); if (nd && tab === 0) { cur = +nd.dataset.i; document.querySelectorAll(".nd").forEach(n => n.classList.toggle("cur", n === nd)); tipFor(cur); } });
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && $("ed").classList.contains("show")) { e.preventDefault(); return save(); }
  if (e.key === "Escape") { if ($("ed").classList.contains("show")) closeEd(); else $("up").classList.remove("show"); return; }
  if ($("ed").classList.contains("show") || /TEXTAREA|INPUT/.test(e.target.tagName)) return;
  if (e.key === "1" || e.key === "q") { tab = (tab + 2) % 3; return render(); }
  if (e.key === "3" || e.key === "e") { tab = (tab + 1) % 3; return render(); }
  if (tab !== 0) return;
  if (e.key === "Enter") return openEd(dayOf(cur));
  const dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key]; if (!dir) return;
  e.preventDefault(); const [cx, cy] = N[cur]; let best = -1, bs = 1e9;
  N.forEach(([x, y], i) => { if (i === cur) return; const dx = x - cx, dy = y - cy, along = dx * dir[0] + dy * dir[1]; if (along <= 0) return; const s = Math.hypot(dx, dy) + Math.abs(dx * dir[1] + dy * dir[0]) * 1.5; if (s < bs) { bs = s; best = i; } });
  if (best >= 0) { cur = best; document.querySelectorAll(".nd").forEach(n => n.classList.toggle("cur", +n.dataset.i === cur)); tipFor(cur); }
});
render();
</script>
</body>
</html>
