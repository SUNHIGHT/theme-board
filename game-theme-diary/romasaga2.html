<style>
  /* Classic-remake RPG battle: cave arena, diamond portrait + turn-order line top-left, black crescent command panel
     (tabs + skill list), party row with LP/HP/BP, overdrive gauge + chain, gold skill-name flare, glimmer bulb, RESULT screen */
  :root { --fm:'Shippori Mincho B1',serif; --fs:'Cinzel',serif; --fi:'Cormorant Garamond',serif;
    --gold:#e8c46a; --gold2:#b8903a; --goldd:#6a4a14; --ink:#07080b; --hp:#5fe0b0; --hpd:#1e8a68; --bp:#b47aff; --bpd:#5a2aa8; --od:#58b8ff; --weak:#ff6a4a; --txt:#f4ecd8; --mut:#a8a090; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body { font-family:var(--fm); color:var(--txt); background:#05060a; overflow:hidden; }
  button { font:inherit; color:inherit; }

  /* ---------- arena ---------- */
  .arena { position:fixed; inset:0; overflow:hidden; background:radial-gradient(ellipse at 50% 30%,#2a3236 0%,#141a1c 45%,#07090a 80%); }
  .rocks { position:absolute; left:-5%; right:-5%; top:0; height:58%; background:
      radial-gradient(ellipse at 12% 60%,#2e3a36 0 18%,transparent 19%), radial-gradient(ellipse at 30% 30%,#26302e 0 22%,transparent 23%),
      radial-gradient(ellipse at 74% 40%,#2a3432 0 24%,transparent 25%), radial-gradient(ellipse at 92% 70%,#1e2826 0 20%,transparent 21%),
      linear-gradient(180deg,#0c1012,#1a2422 70%,transparent); filter:blur(1px); }
  .rocks::after { content:""; position:absolute; inset:0; background:repeating-linear-gradient(100deg,transparent 0 60px,rgba(0,0,0,.25) 60px 64px), repeating-linear-gradient(10deg,transparent 0 80px,rgba(255,255,255,.03) 80px 84px); }
  .fall { position:absolute; top:0; width:var(--w); left:var(--x); height:52%; background:linear-gradient(90deg,transparent,rgba(170,210,220,.35) 30%,rgba(220,240,245,.55) 50%,rgba(170,210,220,.35) 70%,transparent); filter:blur(2px); overflow:hidden; }
  .fall::after { content:""; position:absolute; inset:-50% 0 0; background:repeating-linear-gradient(180deg,transparent 0 14px,rgba(255,255,255,.35) 14px 18px); animation:fall .6s linear infinite; }
  .moss { position:absolute; left:0; right:0; top:46%; height:10%; background:radial-gradient(ellipse at 20% 100%,#3a5a2a 0 30%,transparent 31%), radial-gradient(ellipse at 60% 100%,#2e4a22 0 34%,transparent 35%), radial-gradient(ellipse at 90% 100%,#3a5a2a 0 28%,transparent 29%); opacity:.8; }
  .ground { position:absolute; left:-20%; right:-20%; top:50%; bottom:-30%; border-radius:50%; background:radial-gradient(ellipse at 50% 30%,#c8a87a 0%,#8a7050 35%,#4a3c2c 65%,#1a1612 90%); box-shadow:0 -10px 40px rgba(0,0,0,.6) inset; }
  .ground::after { content:""; position:absolute; inset:0; border-radius:50%; background:repeating-radial-gradient(ellipse at 50% 30%,transparent 0 40px,rgba(0,0,0,.06) 40px 44px); }
  .mist { position:absolute; left:-10%; right:-10%; top:40%; height:30%; background:radial-gradient(ellipse,rgba(200,220,220,.12),transparent 60%); animation:mist 18s ease-in-out infinite alternate; }
  .spark { position:absolute; width:3px; height:3px; border-radius:50%; background:#cfe8a8; box-shadow:0 0 6px 2px rgba(200,240,160,.6); animation:spark var(--t) ease-in-out infinite alternate; opacity:.7; }
  .vig { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.7) 100%); pointer-events:none; }

  /* foes: unrecorded days as rune monoliths */
  .foes { position:fixed; z-index:2; right:15vw; top:22vh; width:44vw; height:38vh; display:flex; justify-content:flex-end; align-items:flex-end; gap:3vw; }
  .foe { all:unset; cursor:pointer; position:relative; width:min(15vh,9vw); display:flex; flex-direction:column; align-items:center; animation:hover 3s calc(var(--i) * -.7s) ease-in-out infinite; }
  .foe svg { width:100%; display:block; filter:drop-shadow(0 1.6vh 1vh rgba(0,0,0,.6)) drop-shadow(0 0 1.4vh rgba(255,140,60,.25)); }
  .foe .tag { margin-top:.6vh; text-align:center; text-shadow:0 1px 3px #000,0 0 6px #000; }
  .foe .tag b { display:flex; align-items:center; gap:.4vw; justify-content:center; font:700 min(1.7vh,1vw) var(--fm); }
  .foe .tag b i { width:min(1.8vh,1vw); aspect-ratio:1; border-radius:50%; background:#c83a2a; box-shadow:0 0 0 2px #2a0a06; }
  .foe .hpb { width:min(13vh,7.6vw); height:3px; margin:.4vh auto; background:#2a1010; } .foe .hpb i { display:block; height:100%; width:100%; background:#e84a3a; }
  .foe .wk { display:flex; align-items:center; gap:3px; justify-content:center; font:italic 700 min(1.4vh,.8vw) var(--fi); color:#ddd; }
  .foe .wk span { width:min(1.8vh,1vw); aspect-ratio:1; border:1px solid #6a5a3a; background:#1a1610; display:grid; place-items:center; font:700 min(1.1vh,.65vw) var(--fm); color:var(--gold); }
  .foe .wk span.hot { background:#c8501a; color:#fff; border-color:#ffb070; }
  .foe .arr { position:absolute; top:10%; width:100%; height:60%; pointer-events:none; display:none; }
  .foe.tgt .arr { display:block; }
  .foe .arr i { position:absolute; width:min(2.2vh,1.3vw); aspect-ratio:1; background:linear-gradient(135deg,#ffd27a,#ff7a1a); clip-path:polygon(0 0,100% 50%,0 100%,30% 50%); filter:drop-shadow(0 0 4px #ff8a2a); animation:poke .7s ease-in-out infinite; }
  .foe .arr i:nth-child(1) { left:-18%; top:20%; } .foe .arr i:nth-child(2) { right:-18%; top:20%; rotate:180deg; } .foe .arr i:nth-child(3) { left:-14%; bottom:0; rotate:-30deg; } .foe .arr i:nth-child(4) { right:-14%; bottom:0; rotate:210deg; }
  .foe .weak { position:absolute; top:-3vh; left:50%; translate:-50% 0; font:italic 700 min(2.2vh,1.2vw) var(--fi); color:var(--weak); text-shadow:0 1px 3px #000; display:none; }
  .foe.tgt .weak { display:block; }
  .foe.hit svg { animation:jolt .1s steps(2) 6; }
  .foe.dead { animation:dissolve .9s ease-in forwards; }
  .peace { position:fixed; z-index:2; right:14vw; top:34vh; font:700 min(2.6vh,1.4vw) var(--fm); text-shadow:0 2px 6px #000; text-align:center; line-height:1.8; }
  .peace small { display:block; font:italic 700 min(1.8vh,1vw) var(--fi); color:var(--gold); letter-spacing:.2em; }

  /* ---------- top-left portrait + turn order ---------- */
  .tl { position:fixed; z-index:6; left:1.2vw; top:1.6vh; display:flex; align-items:flex-start; gap:0; }
  .dia { position:relative; width:min(11vh,6vw); aspect-ratio:1; }
  .dia::before { content:""; position:absolute; inset:0; rotate:45deg; scale:.72; background:linear-gradient(135deg,#f4dc9a,var(--gold2) 50%,var(--goldd)); box-shadow:0 0 12px rgba(232,196,106,.45); }
  .dia .in { position:absolute; inset:0; rotate:45deg; scale:.62; overflow:hidden; background:var(--mc,#2a2c32); }
  .dia .in span { position:absolute; inset:0; rotate:-45deg; display:grid; place-items:center; font:900 min(3.6vh,2vw) var(--fs); color:#160f04; text-shadow:0 1px 0 rgba(255,255,255,.4); }
  .dia .in span small { position:absolute; bottom:22%; font:700 min(1.1vh,.6vw) var(--fs); letter-spacing:.15em; }
  .dia .in.empty span { color:#ddd; text-shadow:none; }
  .line { position:relative; margin-top:min(3vh,1.6vw); width:min(64vw,1100px); height:min(5vh,2.8vw); }
  .line::before { content:""; position:absolute; left:-1.2vw; right:0; top:42%; height:2px; background:linear-gradient(90deg,var(--gold),rgba(232,196,106,.6) 70%,transparent); box-shadow:0 0 6px rgba(232,196,106,.5); }
  .line::after { content:""; position:absolute; left:-1.2vw; top:42%; width:min(3vh,1.6vw); height:min(3vh,1.6vw); border-left:2px solid var(--gold); border-bottom:2px solid var(--gold); rotate:-45deg; translate:0 -85%; }
  .order { position:absolute; left:min(28vh,15vw); top:0; display:flex; align-items:center; gap:.3vw; }
  .ord { all:unset; cursor:pointer; position:relative; width:min(4.2vh,2.3vw); aspect-ratio:1; }
  .ord::before { content:""; position:absolute; inset:12%; rotate:45deg; background:var(--oc); border:2px solid var(--gold); box-shadow:0 0 4px rgba(0,0,0,.7); }
  .ord.en::before { background:#4a1410; border-color:#e84a3a; } .ord.fut::before { background:#1a1c20; border-color:#555; } .ord.now { scale:1.3; } .ord.now::before { box-shadow:0 0 10px var(--gold); }
  .ord span { position:absolute; inset:0; display:grid; place-items:center; font:700 min(1.4vh,.8vw) var(--fs); color:#160f04; } .ord.en span, .ord.fut span { color:#ddd; }
  .ord:focus-visible { outline:2px solid var(--gold); }
  .retreat { all:unset; cursor:pointer; position:fixed; z-index:6; left:1.4vw; top:calc(min(11vh,6vw) + 3vh); display:flex; align-items:center; gap:.6vw; padding:.3vh 2.4vw .3vh .4vw; background:linear-gradient(90deg,rgba(0,0,0,.75),transparent); font:700 min(1.7vh,.95vw) var(--fm); }
  .retreat i { font-style:normal; display:grid; place-items:center; width:min(2.4vh,1.3vw); aspect-ratio:1.3; border-radius:4px; background:var(--gold); color:#160f04; font:700 min(1.1vh,.6vw) var(--fs); }
  .retreat:hover, .retreat:focus-visible { color:var(--gold); outline:0; }

  /* minimap + objective */
  .obj { position:fixed; z-index:6; right:1.2vw; top:8.6vh; display:flex; align-items:center; gap:.6vw; padding:.5vh 1.4vw .5vh 1vw; background:linear-gradient(90deg,transparent,rgba(0,0,0,.8) 20%); font:700 min(1.7vh,.95vw) var(--fm); }
  .obj i { width:min(1.8vh,1vw); aspect-ratio:1; rotate:45deg; background:var(--gold); box-shadow:0 0 6px var(--gold); }
  .mm { position:fixed; z-index:6; right:1.6vw; top:14vh; width:min(17vh,9.4vw); aspect-ratio:1; border-radius:50%; background:radial-gradient(circle,#2a2a22,#0c0c0a 75%); box-shadow:0 0 0 2px var(--gold2), 0 0 0 5px #0c0c0a, 0 0 0 6px var(--goldd), 0 6px 14px rgba(0,0,0,.6); overflow:hidden; }
  .mm svg { width:100%; height:100%; display:block; }
  .mmtag { position:fixed; z-index:6; right:2.4vw; top:calc(14vh + min(17vh,9.4vw) + .6vh); font:700 min(1.6vh,.9vw) var(--fm); text-shadow:0 1px 3px #000; }
  .mmtag::before { content:"◉"; color:var(--gold); margin-right:.4em; font-size:.8em; }

  /* ---------- crescent command panel ---------- */
  .cres { position:fixed; z-index:4; left:-10vw; right:-10vw; bottom:-6vh; height:52vh; transition:transform .45s cubic-bezier(.2,.9,.3,1); pointer-events:none; }
  .cres::before { content:""; position:absolute; inset:0; background:radial-gradient(ellipse 60% 100% at 50% 100%,#05060a 0 70%,rgba(5,6,10,.9) 82%,transparent 83%); }
  .cres::after { content:""; position:absolute; left:20%; right:20%; top:17%; height:2px; background:linear-gradient(90deg,transparent,rgba(232,196,106,.6),transparent); border-radius:50%; }
  body.act .cres { transform:translateY(60%); }
  .menu { position:fixed; z-index:5; left:1.4vw; bottom:3vh; width:min(36vw,640px); transition:transform .4s, opacity .4s; }
  body.act .menu { transform:translateY(40vh); opacity:0; pointer-events:none; }
  .tabs { display:flex; align-items:center; gap:0; margin-bottom:.8vh; }
  .tabs kbd { font:700 min(1.2vh,.7vw) var(--fs); padding:.2vh .4vw; border:1px solid #777; border-radius:4px; color:#ddd; margin:0 .4vw; }
  .tab { all:unset; cursor:pointer; flex:1; text-align:center; padding:.6vh 0; font:800 min(2.2vh,1.2vw) var(--fm); color:#d8d0bc; background:linear-gradient(180deg,rgba(255,255,255,.04),transparent); border-bottom:2px solid #3a3426; }
  .tab.on { color:#160f04; background:linear-gradient(180deg,#ffe8a0,var(--gold) 60%,var(--gold2)); border-bottom-color:#fff3c4; box-shadow:0 0 12px rgba(232,196,106,.4); }
  .tab:focus-visible { outline:2px solid var(--gold); }
  .lhd { display:flex; justify-content:space-between; font:700 min(1.3vh,.75vw) var(--fm); color:var(--mut); padding:0 1vw .3vh; border-bottom:1px solid #2a2620; }
  .list { list-style:none; padding:0; height:min(24vh,13.4vw); overflow:hidden; display:flex; flex-direction:column; }
  .it { all:unset; box-sizing:border-box; cursor:pointer; width:100%; display:grid; grid-template-columns:min(2.4vh,1.3vw) 1fr auto; align-items:center; gap:.8vw; padding:.55vh 1vw; font:700 min(1.9vh,1.05vw) var(--fm); border-bottom:1px solid rgba(255,255,255,.05); }
  .it i { width:100%; aspect-ratio:1; rotate:45deg; scale:.7; background:var(--ic,#5a5040); border:1px solid #c8a85a; }
  .it .tx { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .it b { font:700 min(1.9vh,1.05vw) var(--fs); color:#ddd; }
  .it.cur { background:linear-gradient(90deg,rgba(232,196,106,.32),rgba(232,196,106,.06)); box-shadow:inset 3px 0 0 var(--gold); }
  .it.dim .tx { color:#8a8270; }
  .desc { margin-top:.6vh; min-height:2.6em; padding:.4vh 1vw; font:700 min(1.6vh,.9vw)/1.6 var(--fm); color:#d8d0bc; border-top:1px solid #2a2620; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .desc::before { content:"◇"; color:var(--gold); margin-right:.5em; }

  /* party */
  .party { position:fixed; z-index:5; right:1.4vw; bottom:6.4vh; width:min(54vw,980px); display:grid; grid-template-columns:repeat(5,1fr); gap:.8vw; }
  .pm { all:unset; cursor:pointer; position:relative; display:grid; grid-template-columns:auto 1fr; gap:0 .5vw; padding:.4vh .4vw .4vh .2vw; }
  .pm .nm { grid-column:1 / -1; font:700 min(1.4vh,.8vw) var(--fm); color:#e8dcc0; text-shadow:0 1px 2px #000; padding-left:.4vw; }
  .pm .lp { display:flex; align-items:baseline; gap:.2vw; font:700 min(1.4vh,.8vw) var(--fs); color:var(--gold); } .pm .lp b { font:700 min(3vh,1.7vw)/1 var(--fs); color:#fff; text-shadow:0 2px 3px #000; }
  .pm .pic { position:absolute; right:0; top:0; width:min(5.4vh,3vw); aspect-ratio:1; }
  .pm .pic::before { content:""; position:absolute; inset:0; rotate:45deg; scale:.7; background:var(--mc,#2a2c32); border:2px solid var(--gold2); }
  .pm .pic span { position:absolute; inset:0; display:grid; place-items:center; font:900 min(1.8vh,1vw) var(--fs); color:#160f04; } .pm.empty .pic span { color:#ccc; }
  .pm .bars { grid-column:1 / -1; display:grid; grid-template-columns:auto 1fr; gap:0 .3vw; align-items:center; font:700 min(1.2vh,.7vw) var(--fs); }
  .pm .bars .l { color:var(--hp); } .pm .bars .l.bp { color:var(--bp); }
  .pm .bars .v { text-align:right; font:700 min(1.7vh,.95vw) var(--fs); color:#fff; text-shadow:0 1px 2px #000; } .pm .bars .v small { font-size:.7em; color:#ccc; }
  .pm .bar { grid-column:1 / -1; height:min(.8vh,.45vw); background:#0c1a16; margin:.1vh 0 .3vh; }
  .pm .bar i { display:block; height:100%; width:var(--v); background:linear-gradient(90deg,var(--hpd),var(--hp)); transition:width .8s; }
  .pm .bar.bp i { background:linear-gradient(90deg,var(--bpd),var(--bp)); }
  .pm.cur::after { content:""; position:absolute; inset:-.3vh -.2vw; border:1px solid rgba(232,196,106,.7); background:linear-gradient(180deg,rgba(232,196,106,.18),transparent 60%); pointer-events:none; clip-path:polygon(0 0,100% 0,100% 100%,6% 100%,0 85%); }
  .pm:focus-visible { outline:2px solid var(--gold); }
  .od { position:fixed; z-index:5; right:1.4vw; bottom:1.6vh; width:min(54vw,980px); display:flex; align-items:center; gap:.8vw; }
  .od em { font:italic 700 min(2.2vh,1.2vw) var(--fi); font-style:italic; color:#e8dcc0; text-shadow:0 1px 3px #000; }
  .od .gauge { flex:1; position:relative; height:min(1.2vh,.7vw); background:#0a1018; clip-path:polygon(1% 0,100% 0,99% 100%,0 100%); box-shadow:inset 0 0 0 1px #2a3a4a; }
  .od .gauge i { position:absolute; inset:0 auto 0 0; width:var(--v); background:linear-gradient(90deg,#1a5a9a,var(--od) 80%,#d8f0ff); transition:width 1s; }
  .od .ch { display:flex; align-items:baseline; gap:.2vw; font:900 italic min(4.6vh,2.6vw)/1 var(--fi); color:#cfe8ff; text-shadow:0 0 8px rgba(88,184,255,.8), 0 2px 3px #000; }
  .od .ch small { font:700 min(1.1vh,.6vw) var(--fs); letter-spacing:.1em; color:#9fd0ff; }
  .od .ch.bump { animation:bump .4s; }

  /* ---------- action fx ---------- */
  .flare { position:fixed; z-index:8; left:8vw; right:8vw; top:9vh; height:min(7vh,4vw); display:grid; place-items:center; pointer-events:none; opacity:0; }
  .flare::before { content:""; position:absolute; inset:30% 0; background:linear-gradient(90deg,transparent,rgba(255,170,40,.2) 15%,rgba(255,190,70,.9) 45%,#fff2c0 50%,rgba(255,190,70,.9) 55%,rgba(255,170,40,.2) 85%,transparent); filter:blur(1px); }
  .flare b { position:relative; font:800 min(4.4vh,2.4vw) var(--fm); color:#fff; letter-spacing:.2em; text-shadow:0 0 10px #ff9a2a, 0 2px 4px #000; }
  .flare small { position:absolute; top:105%; font:700 min(1.8vh,1vw) var(--fm); color:#d8f0b8; text-shadow:0 1px 3px #000; }
  .flare small::before { content:"❖"; color:#7ad87a; margin-right:.4em; }
  .flare.on { animation:flareIn 2.2s ease-out forwards; }
  .bulb { position:fixed; z-index:9; left:22vw; top:22vh; width:min(18vh,10vw); pointer-events:none; opacity:0; }
  .bulb svg { width:100%; filter:drop-shadow(0 0 2vh #ffe27a) drop-shadow(0 0 5vh rgba(255,200,80,.8)); }
  .bulb::before { content:""; position:absolute; left:50%; top:40%; width:300%; aspect-ratio:1; translate:-50% -50%; background:repeating-conic-gradient(rgba(255,230,140,.35) 0 4deg,transparent 4deg 16deg); border-radius:50%; -webkit-mask:radial-gradient(circle,#000 20%,transparent 65%); mask:radial-gradient(circle,#000 20%,transparent 65%); }
  .bulb.on { animation:bulb 1.6s ease-out forwards; }
  .bulb.on::before { animation:spin 1.6s linear; }
  .bulbtxt { position:fixed; z-index:9; left:22vw; top:calc(22vh + min(18vh,10vw)); width:min(18vh,10vw); text-align:center; font:800 min(2.4vh,1.3vw) var(--fm); color:#fff2c0; text-shadow:0 0 8px #ff9a2a, 0 2px 3px #000; white-space:nowrap; opacity:0; pointer-events:none; }
  .bulbtxt.on { animation:bulb 1.6s ease-out forwards; }

  const t = e.target.closest(".tab"); if (t) { tab = +t.dataset.t; cur = 0; return renderMenu(); }
  const it = e.target.closest(".it"); if (it) { cur = +it.dataset.i; renderMenu(); return runItem(cur); }
  const pm = e.target.closest(".pm"); if (pm) { act = +pm.dataset.m; return render(); }
  const og = e.target.closest(".ord"); if (og) { const k = og.dataset.go; if (k <= ymd(new Date())) jumpTo(k); return; }
  const fo = e.target.closest(".foe"); if (fo) { jumpTo(fo.dataset.k); return openEd(fo.dataset.k); }
  const cd = e.target.closest("[data-cal]"); if (cd) { calSel = cd.dataset.cal; closeCal(); jumpTo(calSel); return openEd(calSel); }
  const sb = e.target.closest("#styles button"); if (sb) return setMood(mood === sb.dataset.m ? null : sb.dataset.m);
  if (e.target.closest("#save")) return save();
  if (e.target.closest("#cl") || e.target.id === "ed") return closeEd();
  if (e.target.closest("[data-close]") || e.target.id === "cal") return closeCal();
  if (e.target.closest("#cPrev")) { const d = new Date(calSel + "T00:00:00"); d.setDate(1); d.setMonth(d.getMonth() - 1); calSel = ymd(d); return openCal("cal"); }
  if (e.target.closest("#cNext")) { const d = new Date(calSel + "T00:00:00"); d.setDate(1); d.setMonth(d.getMonth() + 1); calSel = ymd(d) > ymd(new Date()) ? ymd(new Date()) : ymd(d); return openCal("cal"); }
  if (e.target.closest("#lead")) return openEd(memDay(act));
  if (e.target.closest("#retreat")) { location.href = "index.html"; return; }
});
document.addEventListener("mouseover", e => {
  if (busy) return;
  const it = e.target.closest(".it"); if (it && +it.dataset.i !== cur) { cur = +it.dataset.i; renderMenu(); }
});
document.addEventListener("keydown", e => {
  const k = e.key, edOpen = $("ed").classList.contains("show"), calOpen = $("cal").classList.contains("show"), resOpen = $("res").classList.contains("show");
  if (resOpen) { if (k === "Escape" || k === "Enter" || k === " ") { e.preventDefault(); closeResult(); } return; }
  if (busy) return;
  if (edOpen && (e.ctrlKey || e.metaKey) && k === "Enter") { e.preventDefault(); return save(); }
  if (k === "Escape") { if (edOpen) return closeEd(); if (calOpen) return closeCal(); if (page) { page = 0; act = 0; return render(); } return; }
  if (edOpen) {
    if (e.target.tagName !== "TEXTAREA" && (k === "ArrowLeft" || k === "ArrowRight")) {
      e.preventDefault(); const dir = k === "ArrowRight" ? 1 : -1, i = MOODS.indexOf(mood);
      setMood(MOODS[i < 0 ? (dir > 0 ? 0 : MOODS.length - 1) : (i + dir + MOODS.length) % MOODS.length]); document.querySelector(`#styles button[data-m="${mood}"]`).focus();
    }
    return;
  }
  if (calOpen) {
    if (calMode !== "cal") return;
    const mv = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[k];
    if (mv) { e.preventDefault(); const d = new Date(calSel + "T00:00:00"); d.setDate(d.getDate() + mv); if (ymd(d) <= ymd(new Date())) { calSel = ymd(d); openCal("cal"); } return; }
    if ((k === "Enter" || k === " ") && e.target.tagName !== "BUTTON") { e.preventDefault(); closeCal(); jumpTo(calSel); return openEd(calSel); }
    return;
  }
  const n = $("list").children.length;
  if (k === "q" || k === "Q") { tab = (tab + 2) % 3; cur = 0; return renderMenu(); }
  if (k === "e" || k === "E") { tab = (tab + 1) % 3; cur = 0; return renderMenu(); }
  if (k === "ArrowUp") { e.preventDefault(); if (cur > 0) cur--; else if (tab === 1 && hpage) { hpage--; cur = 5; } return renderMenu(); }
  if (k === "ArrowDown") { e.preventDefault(); if (cur < n - 1) cur++; else if (tab === 1) { hpage++; cur = 0; } return renderMenu(); }
  if (k === "ArrowLeft") { e.preventDefault(); act = (act + PLEN - 1) % PLEN; return render(); }
  if (k === "ArrowRight") { e.preventDefault(); act = (act + 1) % PLEN; return render(); }
  if ((k === "Enter" || k === " ") && e.target.tagName !== "BUTTON") { e.preventDefault(); return runItem(cur); }
});

$("falls").innerHTML = [[14, 5], [26, 3], [68, 4]].map(([x, w]) => `<i class="fall" style="left:${x}%;--x:${x}%;--w:${w}%"></i>`).join("");
$("sparks").innerHTML = Array.from({ length: 16 }, (_, i) => `<i class="spark" style="left:${(i * 41) % 96 + 2}%;top:${(i * 29) % 40 + 40}%;--t:${3 + i % 5}s"></i>`).join("");
render();
</script>
