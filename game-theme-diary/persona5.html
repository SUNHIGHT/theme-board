<style>
  :root { --red:#e60012; --dark:#0b0b0b; --white:#fff; --gray:#1c1c1c; }
  * { box-sizing:border-box; margin:0; }
  body {
    background:var(--red); color:var(--white); min-height:100vh;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Impact,sans-serif; font-weight:900;
    overflow-x:hidden;
  }
  /* diagonal black shapes in the background */
  body::before, body::after { content:""; position:fixed; z-index:0; background:var(--dark); }
  body::before { left:-10%; top:-20%; width:70%; height:80%; transform:rotate(-12deg) skewX(-20deg); }
  body::after  { right:-15%; bottom:-25%; width:75%; height:60%; transform:rotate(-12deg) skewX(-20deg); }
  main { position:relative; z-index:1; max-width:880px; margin:0 auto; padding:20px 16px 60px; }

  .tag { display:inline-block; background:var(--white); color:var(--dark); padding:2px 14px;
    transform:skew(-14deg) rotate(-2deg); font-size:14px; letter-spacing:.15em; }
  h1 { font-size:clamp(40px,10vw,84px); line-height:1; font-style:italic; letter-spacing:-.02em;
    text-shadow:5px 5px 0 var(--dark); transform:rotate(-3deg); margin:8px 0 18px; }
  h1 span { color:var(--dark); background:var(--white); padding:0 10px; text-shadow:none; display:inline-block; transform:skew(-10deg); }

  .panel { background:var(--dark); border:3px solid var(--white); padding:16px 20px; margin-bottom:22px;
    clip-path:polygon(0 0,100% 6px,calc(100% - 14px) 100%,10px calc(100% - 6px)); }
  .stats { display:flex; flex-wrap:wrap; gap:14px; }
  .stat { flex:1 1 140px; background:var(--white); color:var(--dark); padding:8px 14px;
    transform:skew(-8deg); }
  .stat b { display:block; font-size:12px; color:var(--red); letter-spacing:.15em; }
  .stat i { font-style:italic; font-size:34px; line-height:1.1; }
  .bar { height:14px; background:#444; margin-top:4px; }
  .bar div { height:100%; background:var(--red); width:0; transition:width .6s; }

  label.h { display:block; margin:12px 0 6px; font-size:14px; letter-spacing:.2em; color:var(--red);
    background:var(--white); width:max-content; padding:0 12px; transform:skew(-14deg); }
  .moods { display:flex; gap:8px; flex-wrap:wrap; }
  .moods button { font:inherit; cursor:pointer; border:2px solid var(--white); background:var(--dark); color:var(--white);
    padding:6px 14px; transform:skew(-12deg); transition:.12s; }
  .moods button:hover { background:var(--gray); }
  .moods button.on { background:var(--red); transform:skew(-12deg) scale(1.12); }
  textarea, input[type=text] { width:100%; background:var(--white); color:var(--dark); border:0; padding:12px;
    font-size:16px; line-height:1.7; font-family:inherit; font-weight:700; resize:vertical; outline:3px solid transparent; }
  textarea { min-height:160px; }
  textarea:focus, input:focus { outline-color:var(--red); }

  .save { display:block; margin:18px 0 0 auto; font:inherit; font-size:26px; font-style:italic; cursor:pointer;
    background:var(--red); color:var(--white); border:3px solid var(--white); padding:8px 38px;
    transform:skew(-12deg) rotate(-2deg); box-shadow:6px 6px 0 var(--white); transition:.1s; }
  .save:hover { transform:skew(-12deg) rotate(-2deg) translate(-2px,-2px); box-shadow:9px 9px 0 var(--white); }

  h2 { font-size:28px; font-style:italic; margin:6px 0 12px; text-shadow:3px 3px 0 var(--dark); transform:rotate(-1.5deg); }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal div { aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:13px;
    background:#2a2a2a; transform:skew(-8deg); }
  .cal .dow { aspect-ratio:auto; background:none; color:var(--red); }
  .cal .done { background:var(--red); }
  .cal .today { outline:3px solid var(--white); }
  .cal .sel { box-shadow:inset 0 0 0 3px var(--white); }

  .entry { background:var(--white); color:var(--dark); padding:12px 18px; margin-bottom:14px;
    transform:skew(-2deg); border-left:14px solid var(--red); }
  .entry small { color:var(--red); letter-spacing:.15em; }
  .entry p { white-space:pre-wrap; font-weight:700; margin-top:4px; }

  /* "all out attack" style stamp */
  #stamp { position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.75); }
  #stamp.show { display:flex; }
  #stamp .box { background:var(--red); border:6px solid var(--white); padding:24px 50px; text-align:center;
    transform:skew(-12deg) rotate(-4deg); animation:pop .5s cubic-bezier(.2,1.8,.4,1); box-shadow:12px 12px 0 var(--dark); }
  #stamp .big { font-size:clamp(40px,12vw,90px); font-style:italic; line-height:1; text-shadow:5px 5px 0 var(--dark); }
  #stamp .sub { font-size:20px; margin-top:8px; background:var(--dark); padding:2px 12px; }
  @keyframes pop { from { transform:skew(-12deg) rotate(-30deg) scale(.1); } }
  .hint { font-size:12px; opacity:.7; margin-top:6px; }

  /* ===== animation ===== */
  @keyframes bgA { from { transform:translateX(-130%) rotate(-12deg) skewX(-20deg); } }
  @keyframes bgB { from { transform:translateX(130%) rotate(-12deg) skewX(-20deg); } }
  @keyframes slam { 0% { opacity:0; transform:translateY(-90px) rotate(-7deg) scale(1.35); } 70% { opacity:1; transform:translateY(6px) rotate(.8deg) scale(.98); } }
  @keyframes titleIn { 0% { opacity:0; transform:scale(3) rotate(-18deg); } 70% { opacity:1; transform:scale(.94) rotate(-1deg); } }
  @keyframes tagIn { from { opacity:0; transform:translateX(-80px) skew(-14deg) rotate(-2deg); } }
  @keyframes popIn { from { opacity:0; transform:skew(-8deg) scale(.2) rotate(12deg); } }
  @keyframes throb { 50% { transform:skew(-12deg) rotate(-2deg) scale(1.06); } }
  @keyframes jitter { 25% { transform:skew(-12deg) rotate(-3.5deg) translate(-2px,1px); } 75% { transform:skew(-12deg) rotate(-.5deg) translate(2px,-1px); } }
  @keyframes pick { 0% { transform:skew(-12deg) scale(1.6) rotate(-6deg); } }
  @keyframes entryIn { from { opacity:0; transform:skew(-2deg) translateX(-60px); } }
  @keyframes h2In { from { opacity:0; transform:rotate(-1.5deg) translateX(-60px); } }
  @keyframes sweepBlack { 0% { transform:translateX(-110%) skewX(-20deg); } 55% { transform:translateX(0) skewX(-20deg); } 100% { transform:translateX(110%) skewX(-20deg); } }
  @keyframes shake { 20% { transform:translate(-8px,4px); } 40% { transform:translate(7px,-5px); } 60% { transform:translate(-4px,3px); } 80% { transform:translate(3px,-2px); } }
  @keyframes fade { from { opacity:0; } }
  body::before { animation:bgA .7s cubic-bezier(.2,.9,.3,1) both; }
  body::after  { animation:bgB .7s .1s cubic-bezier(.2,.9,.3,1) both; }
  .tag { animation:tagIn .5s .2s cubic-bezier(.2,.9,.3,1) both; }
  h1 { animation:titleIn .7s .3s cubic-bezier(.2,.9,.3,1) both; }
  main > .panel, main > h2 { animation:slam .55s cubic-bezier(.2,.9,.3,1) both; }
  main > .panel:nth-of-type(1) { animation-delay:.5s; }
  main > .panel:nth-of-type(2) { animation-delay:.65s; }
  main > h2:nth-of-type(1), main > .panel:nth-of-type(3) { animation-delay:.8s; }
  main > h2 { animation-name:h2In; animation-delay:.8s; }
  .stat { animation:popIn .45s backwards; }
  .stat:nth-child(1) { animation-delay:.7s; } .stat:nth-child(2) { animation-delay:.8s; } .stat:nth-child(3) { animation-delay:.9s; }
  .moods button.on { animation:pick .25s cubic-bezier(.2,1.6,.5,1); }
  .save { animation:throb 1.6s ease-in-out infinite; }
  .save:hover { animation:jitter .2s linear infinite; }
  .cal div[data-d] { animation:popIn .35s calc(var(--i) * 20ms + .8s) cubic-bezier(.3,1.6,.5,1) backwards; }
  .cal div[data-d]:hover { background:#fff; color:var(--red); transform:skew(-8deg) scale(1.2); }
  .entry { animation:entryIn .4s calc(var(--i) * 70ms) cubic-bezier(.2,.9,.3,1) backwards; }
  #stamp.show { animation:fade .15s; }
  #stamp::before { content:""; position:absolute; inset:-10% -20%; background:var(--dark); pointer-events:none; animation:sweepBlack .55s ease-in-out forwards; }
  #stamp .box { animation:pop .5s .2s cubic-bezier(.2,1.8,.4,1) backwards; }
  #stamp .big { display:inline-block; animation:shake .4s .55s; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }

  /* ===== typography ===== */
  body { font-family:"Dela Gothic One","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; font-weight:400; }
  h1, h2, .tag, .stat i, .save, #stamp .big, .stat b, label.h, .entry small, .cal { font-family:Anton,"Dela Gothic One",Impact,sans-serif; font-weight:400; }
  textarea, input[type=text], .entry p, .moods button, .hint { font-family:"Dela Gothic One","Hiragino Kaku Gothic ProN",sans-serif; font-weight:400; }
  h1 { font-size:clamp(46px,12vw,104px); letter-spacing:.02em; text-shadow:none; line-height:1.05; }
  h1 .c { display:inline-block; padding:0 .04em; color:var(--white); background:var(--dark); margin-right:.03em;
    transform:rotate(calc((var(--n) - 2.5) * 2.4deg)) translateY(calc((var(--n) - 2.5) * -.04em)) skewX(-8deg);
    box-shadow:.05em .05em 0 var(--white); }
  h1 .c:nth-child(2n) { background:var(--white); color:var(--dark); box-shadow:.05em .05em 0 var(--dark); }
  h1 .c:nth-child(3n) { font-size:1.18em; }
  h2 { font-size:38px; letter-spacing:.06em; }
  .stat i { font-size:52px; letter-spacing:.02em; }
  .stat b, label.h { letter-spacing:.2em; }
  .tag { letter-spacing:.2em; }
  .save { font-size:34px; letter-spacing:.08em; }
  #stamp .big { font-size:clamp(54px,15vw,120px); letter-spacing:.04em; -webkit-text-stroke:2px var(--dark); }
  .cal { gap:5px; } .cal div { font-size:17px; }
  .entry p { font-size:15px; line-height:1.8; }
</style>

<body>
<!-- seo-noscript:start -->
<noscript><p style="font:14px/1.7 sans-serif;padding:16px;color:#fff;background:#111">このテーマは JavaScript を使います。<a href="../" style="color:#9fd8ff">Game Theme Diary(テーマ一覧)</a>から、ほかのテーマも選べます。</p></noscript>
<!-- seo-noscript:end -->
<main>
  <span class="tag">DAILY LOG ─ 日記</span>
  <h1 aria-label="TAKE YOUR DIARY"><span class="c" style="--n:0">T</span><span class="c" style="--n:1">A</span><span class="c" style="--n:2">K</span><span class="c" style="--n:3">E</span> <span class="c" style="--n:5">Y</span><span class="c" style="--n:0">O</span><span class="c" style="--n:1">U</span><span class="c" style="--n:2">R</span>  <span class="c" style="--n:4">D</span><span class="c" style="--n:5">I</span><span class="c" style="--n:0">A</span><span class="c" style="--n:1">R</span><span class="c" style="--n:2">Y</span></h1>

  <section class="panel">
    <div class="stats">
      <div class="stat"><b>LEVEL</b><i id="lv">1</i><div class="bar"><div id="xp"></div></div></div>
      <div class="stat"><b>STREAK 連続</b><i id="streak">0</i></div>
      <div class="stat"><b>TOTAL 記録</b><i id="total">0</i></div>
    </div>
  </section>

  <section class="panel">
    <label class="h" for="date">DATE</label>
    <input type="text" id="date" readonly>
    <label class="h">MOOD 今日の気分</label>
    <div class="moods" id="moods"></div>
    <label class="h" for="body">TODAY'S STORY</label>
    <textarea id="body" placeholder="今日はどんな一日だった？"></textarea>
    <div class="hint" id="hint"></div>
    <button class="save" id="save">SAVE!</button>
  </section>

  <h2>CALENDAR</h2>
  <section class="panel">
    <div class="cal" id="cal"></div>
  </section>

  <h2>MEMORIES</h2>
  <div id="list"></div>
</main>

<div id="stamp"><div class="box"><div class="big" id="stampBig">RECORDED!</div><div class="sub" id="stampSub"></div></div></div>

<script src="theme-switch.js" data-theme="p5"></script>
<script>
const KEY = "diary-shared-v1";
const MOODS = ["最高","良い","普通","微妙","最悪"];
const XP_PER = 100, XP_BONUS_PER_STREAK = 10; // level up every 100xp
const $ = id => document.getElementById(id);
const countUp = (el, to) => {
  const from = parseInt(el.dataset.v || "0", 10); el.dataset.v = to;
  if (from === to || matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = to; return; }
  const t0 = performance.now();
  const tick = t => { const p = Math.min((t - t0) / 600, 1); el.textContent = Math.round(from + (to - from) * (1 - (1 - p) ** 3)); if (p < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
};
let stampTimer;


const LEGACY = ["persona-diary-v1", "persona3-diary-v1"];
const load = () => {
  try {
    let d = JSON.parse(localStorage.getItem(KEY));
    if (!d) { d = {}; for (const k of LEGACY) { const o = JSON.parse(localStorage.getItem(k) || "{}"); for (const day in o) if (!d[day]) d[day] = o[day]; } }
    return d;
  } catch { return {}; }
};
const store = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let data = load();            // { "YYYY-MM-DD": {mood, text} }
let selected = ymd(new Date());
let mood = null;

function streakCount() {
  let n = 0, d = new Date();
  if (!data[ymd(d)]) d.setDate(d.getDate() - 1); // today not written yet: count up to yesterday
  while (data[ymd(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function totalXp() {
  // 100xp per entry + small bonus that grows with the streak at the time of writing
  const days = Object.keys(data).sort();
  let xp = 0, run = 0, prev = null;
  for (const k of days) {
    const cur = new Date(k + "T00:00:00");
    run = prev && (cur - prev) / 864e5 === 1 ? run + 1 : 1;
    xp += XP_PER + Math.min(run, 30) * XP_BONUS_PER_STREAK;
    prev = cur;
  }
  return xp;
}
const levelOf = xp => 1 + Math.floor(xp / 300);

function render() {
  const xp = totalXp();
  countUp($("lv"), levelOf(xp));
  $("xp").style.width = (xp % 300) / 3 + "%";
  countUp($("streak"), streakCount());
  countUp($("total"), Object.keys(data).length);

  $("date").value = selected;
  const e = data[selected];
  $("body").value = e ? e.text : "";
  mood = e ? e.mood : null;
  $("moods").innerHTML = MOODS.map(m => `<button data-m="${m}" class="${m===mood?"on":""}">${m}</button>`).join("");
  $("hint").textContent = selected === ymd(new Date()) ? "" : "過去の日付を編集中（カレンダーで日付を選べます）";

  // calendar (current month)
  const now = new Date(), y = now.getFullYear(), mo = now.getMonth();
  const first = new Date(y, mo, 1).getDay(), last = new Date(y, mo + 1, 0).getDate();
  let h = "SMTWTFS".split("").map(c => `<div class="dow">${c}</div>`).join("");
  h += "<div style='visibility:hidden'></div>".repeat(first);
  for (let d = 1; d <= last; d++) {
    const k = ymd(new Date(y, mo, d));
    h += `<div data-d="${k}" style="cursor:pointer;--i:${d}" class="${data[k]?"done":""} ${k===ymd(now)?"today":""} ${k===selected?"sel":""}">${d}</div>`;
  }
  $("cal").innerHTML = h;

  const keys = Object.keys(data).sort().reverse();
  $("list").innerHTML = keys.length ? keys.map((k, i) =>
    `<div class="entry" style="--i:${Math.min(i, 12)}"><small>${k} ／ MOOD: ${esc(data[k].mood||"-")}</small><p>${esc(data[k].text)}</p></div>`).join("")
    : `<div class="entry"><p>まだ記録がありません。最初の一行を書こう。</p></div>`;
}

$("moods").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  mood = b.dataset.m;
  [...$("moods").children].forEach(x => x.classList.toggle("on", x === b));
};
$("cal").onclick = e => {
  const c = e.target.closest("[data-d]"); if (!c) return;
  selected = c.dataset.d; render();
};
$("save").onclick = () => {
  const text = $("body").value.trim();
  if (!text) { $("body").focus(); return; }
  const before = levelOf(totalXp()), isNew = !data[selected];
  data[selected] = { mood, text };
  store(data);
  const lvUp = levelOf(totalXp()) > before;
  $("stampBig").textContent = lvUp ? "LEVEL UP!" : "RECORDED!";
  $("stampSub").textContent = isNew ? `${streakCount()}日連続 ／ +XP` : "更新しました";
  $("stamp").classList.remove("show"); void $("stamp").offsetWidth; $("stamp").classList.add("show");
  clearTimeout(stampTimer); stampTimer = setTimeout(() => $("stamp").classList.remove("show"), 2000);
  render();
};
$("stamp").onclick = () => $("stamp").classList.remove("show");
render();
</script>
</body>
</html>
