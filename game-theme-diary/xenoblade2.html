<style>

  .bg .t1 { right:6%; top:0; width:22%; height:24%; background:repeating-linear-gradient(60deg,#2fb4a8 0 14px,#d6a82a 14px 28px,#c23a8a 28px 42px); opacity:.55; }

  #ov.show { visibility:visible; pointer-events:auto; cursor:pointer; animation:ovIn .3s both, ovOut .4s 2.5s forwards; }
  #ov svg { width:110px; height:124px; margin:0 auto 10px; filter:drop-shadow(0 0 18px #9bb4ff); animation:spin 1.2s cubic-bezier(.2,.9,.3,1) both; }

  @keyframes down { from { opacity:0; transform:translateY(-24px); } } @keyframes up { from { opacity:0; transform:translateY(24px); } } @keyframes pan { from { opacity:0; transform:translateY(24px) scale(.98); } }
  @keyframes rowIn { from { opacity:0; transform:translateX(-30px); } } @keyframes ovIn { from { opacity:0; } } @keyframes ovOut { to { opacity:0; visibility:hidden; } }

  @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration:.01s !important; animation-delay:0s !important; } }
  @media (max-width:860px) {
    body { overflow-y:auto; overflow-x:hidden; } .app { height:auto; min-height:100%; } .main { grid-template-columns:1fr; padding:10px 8px; } .hd { padding:10px 14px; gap:12px; } .emb { width:44px; height:50px; } .ban { padding-left:20px; }
    .rows { max-height:330px; } .row { padding:0 18px; font-size:15px; } .L .cols, .L .row { grid-template-columns:1fr 50px 70px; } .R .cols, .R .row { grid-template-columns:1fr 50px 50px 96px; } .cols { padding:6px 14px 2px; font-size:11px; } .foot { flex-wrap:wrap; gap:14px; justify-content:center; padding:8px 8px 80px; font-size:15px; }

<script>
const KEY = "diary-shared-v1";
const LEGACY = ["persona-diary-v1", "persona3-diary-v1"];
const MOODS = [["最高", "EXCELLENT", "g", "✦"], ["良い", "GOOD", "c", "◈"], ["普通", "NORMAL", "", "◇"], ["微妙", "TIRED", "p", "▽"], ["最悪", "SLUMP", "r", "✕"]];
const XP_PER = 100, XP_BONUS_PER_STREAK = 10, XP_PER_RANK = 300;
const DOW = ["日","月","火","水","木","金","土"];
const $ = id => document.getElementById(id);
const load = () => {
  try {
    let d = JSON.parse(localStorage.getItem(KEY));
    if (!d) { d = {}; for (const k of LEGACY) { const o = JSON.parse(localStorage.getItem(k) || "{}"); for (const day in o) if (!d[day]) d[day] = o[day]; } }
    return d;
  } catch { return {}; }
};
const store = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let data = load(), newest = true, extra = null, selected = ymd(new Date()), mood = null, ovTimer;
const today = () => ymd(new Date());

function streakAt(k) { let n = 0; const d = new Date(k + "T00:00:00"); while (data[ymd(d)]) { n++; d.setDate(d.getDate() - 1); } return n; }
function streakCount() { const d = new Date(); if (!data[ymd(d)]) d.setDate(d.getDate() - 1); return streakAt(ymd(d)); }
function totalXp() {
  let xp = 0, run = 0, prev = null;
  for (const k of Object.keys(data).sort()) {
    const c = new Date(k + "T00:00:00");
    run = prev && (c - prev) / 864e5 === 1 ? run + 1 : 1;
    xp += XP_PER + Math.min(run, 30) * XP_BONUS_PER_STREAK;
    prev = c;
  }
  return xp;
}
function items() {
  const s = new Set(Object.keys(data)); s.add(today()); if (extra) s.add(extra);
  const a = [...s].sort(); return newest ? a.reverse() : a;
}
const diaClass = m => (MOODS.find(x => x[0] === m) || [])[2] || "";

function render(scroll) {
  const its = items(), e = data[selected];
  $("rows").innerHTML = its.map((k, i) => {
    const en = data[k], d = new Date(k + "T00:00:00");
    return `<button class="row ${k === selected ? "cur" : ""}" data-k="${k}" style="--i:${Math.min(i, 10)}"><span class="nm"><span class="ic">${en ? (MOODS.find(m => m[0] === en.mood) || [,,,"◆"])[3] : "＋"}</span><b>${d.getMonth()+1}/${d.getDate()}（${DOW[d.getDay()]}）${en ? esc(en.text.replace(/\s+/g, " ")) : "未記録"}${k === today() ? " ★" : ""}</b></span>
      <span><i class="dia ${en ? diaClass(en.mood) : ""}" style="${en ? "" : "opacity:.35"}"></i></span><span class="num">${en ? en.text.length : 0}<small>/99</small></span></button>`;
  }).join("") + Array.from({ length: Math.max(0, 8 - its.length) }, () => `<div class="row empty"><span></span><span></span><span></span></div>`).join("");
  if (scroll) { const c = $("rows").querySelector(".cur"); if (c) c.scrollIntoView({ block: "nearest" }); }

  const ta = $("body"); if (document.activeElement !== ta || ta.dataset.k !== selected) { ta.value = e ? e.text : ""; ta.dataset.k = selected; }
  const sd = new Date(selected + "T00:00:00");
  $("dInfo").textContent = `${selected.replace(/-/g, ".")}（${DOW[sd.getDay()]}）` + (e ? ` ／ 連続 ${streakAt(selected)}` : " ／ NEW");
  $("hint").textContent = selected === today() ? "" : "過去の日付を編集中";

  const cnt = m => Object.values(data).filter(x => x.mood === m).length;
  $("moods").innerHTML = MOODS.map(([m, tag, c, ic], i) => `<button class="row ${m === mood ? "cur" : ""}" data-m="${m}" style="--i:${i}"><span class="nm"><span class="ic">${ic}</span><b>${m}　<small style="font:italic 700 12px var(--fn);opacity:.7">${tag}</small></b></span><span><i class="dia ${c}"></i></span><span class="num">${cnt(m)}</span>
    <span class="lr"><kbd>L</kbd><b>${m === mood ? 1 : 0}</b><kbd class="${m === mood ? "on" : ""}">R</kbd></span></button>`).join("");

  const xp = totalXp(), into = xp % XP_PER_RANK, left = XP_PER_RANK - into;
  $("bn").textContent = `${left}/${XP_PER_RANK}`; $("bb").style.width = (into / XP_PER_RANK * 100) + "%";
  $("rk").textContent = `RANK ${Math.floor(xp / XP_PER_RANK) + 1}`;
  $("sortB").textContent = "並び順 " + (newest ? "新しい順" : "古い順");
}

function pick(k) { selected = k; mood = data[k] ? data[k].mood : null; render(true); }
function save() {
  const text = $("body").value.trim(); if (!text) { $("body").focus(); return; }
  const before = Math.floor(totalXp() / XP_PER_RANK), isNew = !data[selected];
  data[selected] = { mood, text }; store(data);
  const up = Math.floor(totalXp() / XP_PER_RANK) > before;
  $("ovT").textContent = up ? "ランクアップ！" : "記録しました"; $("ovS").textContent = isNew ? `${streakCount()} DAYS ─ BUILD COMPLETE` : "UPDATED ─ BUILD COMPLETE";
  const o = $("ov"); o.classList.remove("show"); void o.offsetWidth; o.classList.add("show");
  clearTimeout(ovTimer); ovTimer = setTimeout(() => o.classList.remove("show"), 3000);
  render(true);
}
function move(d) { const its = items(), i = its.indexOf(selected), n = Math.max(0, Math.min(its.length - 1, i + d)); if (n !== i) pick(its[n]); }

document.addEventListener("click", e => {
  const r = e.target.closest("#rows .row[data-k]"); if (r) return pick(r.dataset.k);
  const m = e.target.closest("#moods .row"); if (m) { mood = mood === m.dataset.m ? null : m.dataset.m; return render(false); }
  if (e.target.closest("#save") || e.target.closest("#bA")) return save();
  if (e.target.closest("#sortB") || e.target.closest("#bL")) { newest = !newest; return render(true); }
  if (e.target.closest("#bP")) return move(1);
  if (e.target.closest("#bB")) { extra = null; return pick(today()); }
  if (e.target.closest("#ov")) $("ov").classList.remove("show");
});
$("pick").onchange = e => { if (e.target.value) { extra = e.target.value; pick(extra); } };
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); return save(); }
  if (e.key === "Escape") { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); $("ov").classList.remove("show"); return; }
  if (/TEXTAREA|INPUT/.test(e.target.tagName)) return;
  if (e.key === "ArrowDown") { e.preventDefault(); move(1); } else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
  else if (e.key === "l" || e.key === "L") { newest = !newest; render(true); }
  else if (/^[1-5]$/.test(e.key)) { mood = MOODS[+e.key - 1][0]; render(false); }
  else if (e.key === "Enter") { $("body").focus(); e.preventDefault(); }
});
pick(today());
</script>
</body>
