<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earth Defense Force Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#06121b;--fg:#8fdcf0;--hi:#e9fbff;--acc:#5ee0ff;--acc2:#46d36a;--line:rgba(94,224,255,.7);--panel:rgba(5,20,32,.9);--sel:rgba(70,211,106,.34);--glow:rgba(94,224,255,.5);--warn:#ffd23f;--fb:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN',sans-serif;--fh:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN',sans-serif; }

  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; color:var(--fg); overflow-x:hidden; font-family:var(--fb); background:var(--bg); }
  main { position:relative; z-index:1; max-width:860px; margin:0 auto; padding:26px 16px 70px; }
  header { position:relative; border-bottom:2px solid var(--line); padding-bottom:12px; margin-bottom:24px; animation:typeIn .8s both; }
  .op { font-size:12px; letter-spacing:.4em; color:var(--acc); }
  h1 { font-family:var(--fh); font-weight:700; font-size:clamp(34px,8.5vw,66px); letter-spacing:.05em; line-height:1.05; color:var(--hi); margin:4px 0; }
  h1 small { display:block; font-size:.4em; letter-spacing:.35em; color:var(--fg); font-family:var(--fb); font-weight:400; }
  .clock { display:flex; flex-wrap:wrap; gap:22px; font-size:15px; letter-spacing:.15em; margin-top:8px; }
  .clock b { color:var(--acc); font-weight:400; margin-right:6px; }
  .blink { animation:blink 1s steps(1) infinite; }
  .panel { position:relative; background:var(--panel); border:1px solid var(--line); padding:22px 22px 18px; margin-bottom:30px; }
  .ttl { display:inline-block; font-family:var(--fh); font-size:15px; letter-spacing:.25em; color:var(--bg); background:var(--acc); padding:2px 14px; margin:-36px 0 12px -8px; }
  .gauge { margin-bottom:12px; }
  .gauge b { font-weight:400; display:flex; justify-content:space-between; letter-spacing:.2em; font-size:14px; }
  .gauge b em { font-style:normal; font-family:var(--fh); font-size:20px; color:var(--hi); }
  .track { height:16px; border:1px solid var(--line); padding:2px; background:rgba(0,0,0,.45); }
  .track div { height:100%; width:0; transition:width .9s cubic-bezier(.2,.9,.3,1); background:repeating-linear-gradient(90deg,var(--c) 0 8px,transparent 8px 10px); }
  .life div { --c:var(--acc); } .stam div { --c:var(--acc2); }
  .row3 { display:flex; gap:26px; flex-wrap:wrap; margin-top:14px; }
  .row3 div { flex:1 1 130px; border-top:1px solid var(--line); padding-top:6px; }
  .row3 b { display:block; font-weight:400; font-size:12px; letter-spacing:.25em; color:var(--acc); }
  .row3 i { font-style:normal; font-family:var(--fh); font-size:38px; color:var(--hi); line-height:1.1; }
  .moods { list-style:none; padding:0; margin-bottom:18px; }
  .moods button { width:100%; text-align:left; font:inherit; font-size:17px; cursor:pointer; color:var(--fg); background:transparent; border:0;
    border-bottom:1px dashed var(--line); padding:8px 8px 8px 30px; position:relative; display:flex; justify-content:space-between; transition:.1s; }
  .moods button span { font-size:12px; letter-spacing:.2em; opacity:.7; }
  .moods button:hover { color:var(--acc); }
  .moods button.on { background:var(--sel); color:var(--hi); animation:fade .25s; }
  .moods button.on::before { content:"▶"; position:absolute; left:8px; color:var(--acc); animation:blink .8s steps(1) infinite; }
  textarea { width:100%; min-height:180px; resize:vertical; padding:12px 14px; font:inherit; font-size:16px; line-height:1.9; color:var(--hi);
    background:rgba(255,255,255,.05); border:1px solid var(--line); outline:none; }
  textarea:focus { border-color:var(--acc); box-shadow:0 0 12px var(--glow); }
  textarea::placeholder { color:var(--fg); opacity:.45; }
  .hint { font-size:12px; color:var(--acc); margin-top:6px; min-height:1.2em; }
  .save { display:block; margin:14px 0 0 auto; font-family:var(--fh); font-weight:700; font-size:24px; letter-spacing:.3em; cursor:pointer;
    color:var(--bg); background:var(--acc); border:0; padding:8px 34px; transition:.1s; }
  .save:hover { background:var(--hi); box-shadow:0 0 18px var(--glow); }
  .save:active { transform:scale(.95); }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal div { aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:16px; border:1px solid var(--line); transition:.15s; }
  .cal .dow { aspect-ratio:auto; border:0; color:var(--acc); font-size:12px; letter-spacing:.2em; }
  .cal .done { color:var(--bg); font-weight:700; background:var(--acc); }
  .cal .today { outline:2px solid var(--hi); outline-offset:2px; }
  .cal .sel { box-shadow:0 0 0 3px var(--acc2); }
  .cal div[data-d]:hover { background:var(--sel); transform:scale(1.12); }
  h2 { font-family:var(--fh); font-size:22px; letter-spacing:.3em; color:var(--hi); margin:6px 0 14px; }
  .entry { background:var(--panel); border:1px solid var(--line); border-left:6px solid var(--acc); padding:12px 18px; margin-bottom:12px; }
  .entry small { color:var(--acc); letter-spacing:.2em; font-size:12px; }
  .entry p { white-space:pre-wrap; margin-top:4px; line-height:1.8; color:var(--hi); }
  #stamp { position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.72); }
  #stamp.show { display:flex; animation:fade .2s; }
  #stamp .bars::before, #stamp .bars::after { content:""; position:absolute; left:0; right:0; height:16vh; background:#000; z-index:1; }
  #stamp .bars::before { top:0; animation:barT .5s ease-out; } #stamp .bars::after { bottom:0; animation:barB .5s ease-out; }
  @keyframes barT { from { transform:translateY(-100%); } } @keyframes barB { from { transform:translateY(100%); } }
  #stamp .box { text-align:center; position:relative; z-index:2; padding:0 16px; }
  #bang { font-family:var(--fh); font-weight:700; font-size:clamp(110px,28vw,230px); line-height:1; color:var(--warn); text-shadow:0 0 30px var(--warn), 5px 5px 0 #000; animation:bang .45s cubic-bezier(.2,2,.4,1); }
  @keyframes bang { from { transform:scale(.1) rotate(-25deg); opacity:0; } }
  #stampBig { font-family:var(--fh); font-size:clamp(22px,5.5vw,40px); letter-spacing:.2em; color:var(--hi); min-height:1.4em; }
  #stampBig::after { content:"█"; animation:blink .6s steps(1) infinite; color:var(--acc); }
  #stampSub { margin-top:6px; letter-spacing:.3em; font-size:14px; color:var(--acc); }
  @keyframes blink { 50% { opacity:0; } }
  @keyframes fade { from { opacity:0; } }
  @keyframes typeIn { from { opacity:0; transform:translateX(-30px); } }
  @keyframes panelIn { 0% { opacity:0; transform:translateY(24px); } 40% { opacity:.4; } 55% { opacity:.1; } 70% { opacity:1; } }
  @keyframes rise { from { opacity:0; transform:scale(.6); } }
  @keyframes entryIn { from { opacity:0; transform:translateX(-30px); } }
  main > .panel { animation:panelIn .7s both; }
  main > .panel:nth-of-type(1) { animation-delay:.25s; } main > .panel:nth-of-type(2) { animation-delay:.45s; } main > .panel:nth-of-type(3) { animation-delay:.65s; }
  .cal div[data-d] { animation:rise .3s calc(var(--i) * 16ms + .8s) backwards; }
  .entry { animation:entryIn .45s calc(var(--i) * 70ms) ease-out backwards; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }


  body { background:
      radial-gradient(circle at 54px 54px, transparent 0 20px, rgba(94,224,255,.22) 20px 22px, transparent 22px 34px, rgba(94,224,255,.16) 34px 36px, transparent 36px 52px, rgba(94,224,255,.1) 52px 54px, transparent 54px),
      radial-gradient(circle at calc(100% - 70px) calc(100% - 70px), transparent 0 30px, rgba(94,224,255,.18) 30px 32px, transparent 32px 50px, rgba(94,224,255,.12) 50px 52px, transparent 52px),
      linear-gradient(rgba(94,224,255,.06) 1px, transparent 1px) 0 0/30px 30px,
      linear-gradient(90deg, rgba(94,224,255,.06) 1px, transparent 1px) 0 0/30px 30px,
      radial-gradient(ellipse at 30% 0%, #0f3a4c, #06121b 65%) fixed; }
  body::before { content:""; position:fixed; left:0; right:0; height:90px; z-index:0; pointer-events:none; background:linear-gradient(transparent, rgba(94,224,255,.09), transparent); animation:roll 8s linear infinite; }
  @keyframes roll { from { top:-100px; } to { top:100%; } }
  body::after { content:""; position:fixed; inset:0; z-index:40; pointer-events:none; background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6) 100%); }
  main { max-width:900px; }
  header { border-bottom:0; position:relative; }
  .op { display:block; font-size:15px; letter-spacing:.14em; color:#0b1b24; font-weight:700; padding:3px 16px; margin:0 0 14px;
    background:linear-gradient(#e2e8eb,#a9b6bd); clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%); }
  h1 { font-weight:900; font-size:clamp(40px,10vw,84px); letter-spacing:.08em; line-height:1.05; color:var(--hi); text-shadow:0 0 18px var(--glow), 3px 3px 0 #02080c; }
  h1 small { text-shadow:none; font-size:.2em; letter-spacing:.3em; color:var(--acc); font-weight:700; }
  .clock { color:var(--fg); } .clock b { color:var(--warn); font-size:12px; letter-spacing:.18em; }
  .clock #enemy { font-weight:900; font-size:24px; color:var(--hi); text-shadow:0 0 10px var(--glow); }
  .unit { position:absolute; right:0; top:44px; width:230px; display:flex; flex-direction:column; gap:4px; }
  .unit div { display:flex; justify-content:space-between; padding:3px 12px; border:1px solid var(--line); background:linear-gradient(90deg,rgba(94,224,255,.2),rgba(5,20,32,.9)); }
  .unit b { color:var(--hi); font-weight:700; } .unit span { color:var(--acc); font-weight:700; }
  @media (max-width:640px) { .unit { position:static; width:auto; margin-top:12px; } }
  .panel { border:1px solid var(--line); border-radius:0; padding:22px 22px 18px; clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px)); box-shadow:inset 0 0 40px rgba(94,224,255,.08); }
  .panel .ttl { display:block; margin:0 -22px 14px !important; padding:3px 22px; background:linear-gradient(#e2e8eb,#a9b6bd); color:#0b1b24; font-size:15px; font-weight:700; letter-spacing:.14em; }
  .panel > .ttl:first-child { margin-top:-22px !important; }
  .panel .ttl ~ .ttl { margin-top:20px !important; }
  .wi { display:grid; gap:2px; margin-bottom:14px; padding:8px 12px; border:1px solid rgba(94,224,255,.35); background:rgba(94,224,255,.05); }
  .wi div { display:grid; grid-template-columns:5em 8em 1fr; gap:6px; align-items:baseline; font-size:15px; }
  .wi i { font-style:normal; color:var(--warn); } .wi b { color:var(--hi); font-weight:500; } .wi span { color:var(--acc); }
  .gauge b { color:var(--hi); font-weight:500; } .gauge b em { font-weight:700; color:var(--acc); }
  .track { border-radius:0; border:1px solid var(--line); } .life div { --c:#46d36a; } .stam div { --c:#5ee0ff; }
  .row3 { display:none; }
  .moods li { list-style:none; }
  .moods button { display:grid; grid-template-columns:1fr auto; border-bottom:1px solid rgba(94,224,255,.3); color:var(--fg); font-size:17px; padding:7px 10px 7px 32px; }
  .moods button span { color:var(--warn); opacity:1; letter-spacing:.06em; font-size:14px; }
  .moods button:hover { background:rgba(94,224,255,.1); color:var(--hi); }
  .moods button.on { background:linear-gradient(90deg,#2f9c4e,#1f6d36); color:#fff; } .moods button.on span { color:#fff; } .moods button.on::before { color:#fff; }
  textarea { background:rgba(2,12,20,.8); border:1px solid var(--line); color:var(--acc); font-size:16px; line-height:1.9; }
  textarea::placeholder { color:var(--fg); opacity:.5; }
  .save { background:linear-gradient(#37b058,#1f6d36); color:#fff; font-weight:900; font-size:26px; letter-spacing:.2em; border:1px solid #9bf0b4; clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%); padding:8px 48px 8px 36px; }
  .save:hover { background:linear-gradient(#4ac96c,#27853f); }
  .cal div { border:1px solid rgba(94,224,255,.4); border-radius:0; color:var(--fg); background:rgba(5,20,32,.6); }
  .cal .dow { background:none; border:0; color:var(--warn); }
  .cal div[data-d].done { background:linear-gradient(135deg,#2f9c4e,#1f6d36); color:#fff; border-color:#9bf0b4; }
  .cal .today { outline:2px solid var(--warn); }
  h2 { color:var(--hi); font-size:18px; letter-spacing:.2em; background:linear-gradient(#e2e8eb,#a9b6bd); color:#0b1b24; padding:3px 16px; display:inline-block; clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%); padding-right:30px; }
  .entry { background:rgba(5,20,32,.9); border:1px solid var(--line); border-left:6px solid var(--acc2); } .entry p { color:var(--acc); } .entry small { color:var(--warn); }
  #stamp { background:rgba(2,10,16,.9); }
  #bang { font-weight:900; font-size:clamp(100px,26vw,220px); letter-spacing:.04em; font-style:italic; color:var(--hi); text-shadow:0 0 30px var(--acc), 6px 6px 0 #0b3a4c; animation:edf .7s cubic-bezier(.2,2,.4,1); }
  @keyframes edf { from { transform:scale(3) rotate(-8deg); opacity:0; } }
  #stampBig { color:var(--acc); font-weight:700; } #stampSub::before { content:"EDF ─ "; }
  
</style>
</head>
<body>
<main>
  <header>
    <div class="op">兵科日誌選択　　日記作成</div>
    <h1>地球防衛軍<small>EARTH DEFENSE FORCE 6 ─ 戦場日誌</small></h1>
    <div class="clock"><span><b>DATE</b><span id="d"></span></span><span><b>DAY</b><span id="dow"></span></span><span><b>REMAINING ENEMY</b><span id="enemy">1000</span></span></div>
    <div class="unit"><div><b>兵科</b><span id="cls">レンジャー</span></div><div><b>Armor</b><span id="arm">100</span></div></div>
  </header>

  <section class="panel">
    <span class="ttl">日誌データ ─ 詳細</span>
    <div class="wi" id="wi"></div>
    <div class="gauge life"><b>ARMOR ─ 連続日数 <em id="streakTxt">0</em></b><div class="track"><div id="lifeBar"></div></div></div>
    <div class="gauge stam"><b>RANK ─ 次の階級まで <em id="xpTxt">0%</em></b><div class="track"><div id="xp"></div></div></div>
    <div class="row3">
      <div><b>RANK 階級</b><i id="lv">-</i></div>
      <div><b>STREAK 連続</b><i id="streak">0</i></div>
      <div><b>TOTAL 記録</b><i id="total">0</i></div>
    </div>
  </section>

  <section class="panel">
    <span class="ttl">コンディション選択</span>
    <ul class="moods" id="moods"></ul>
    <span class="ttl" style="margin-top:6px">戦闘報告 ─ テキスト入力</span>
    <textarea id="body" placeholder="本日の戦況を報告せよ…"></textarea>
    <div class="hint" id="hint"></div>
    <button class="save" id="save">出撃!</button>
  </section>

  <section class="panel">
    <span class="ttl">作戦カレンダー</span>
    <div class="cal" id="cal"></div>
  </section>

  <h2>戦闘記録 ─ 過去の報告</h2>
  <div id="list"></div>
</main>

<div id="stamp"><div class="bars"></div><div class="box"><div id="bang">EDF!</div><div id="stampBig"></div><div id="stampSub"></div></div></div>

<script src="theme-switch.js" data-theme="edf6"></script>
<script>
const KEY = "diary-shared-v1";
const LEGACY = ["persona-diary-v1", "persona3-diary-v1"];
const MOODS = [["最高", "Lv 8　☆8"], ["良い", "Lv 6　☆6"], ["普通", "Lv 4　☆4"], ["微妙", "Lv 2　☆2"], ["最悪", "Lv 0　☆1"]];
const RANKS = ["新兵", "二等兵", "一等兵", "軍曹", "曹長", "少尉", "隊長"];
let MSG_FILED = "MISSION COMPLETE ─ ミッション完了", MSG_PROMO = "階級が上がった! ─ RANK UP";
const XP_PER = 100, XP_BONUS_PER_STREAK = 10, XP_PER_RANK = 300;
const $ = id => document.getElementById(id);

const load = () => {
  try {
    let d = JSON.parse(localStorage.getItem(KEY));
    if (!d) { d = {}; for (const k of LEGACY) { const o = JSON.parse(localStorage.getItem(k) || "{}"); for (const day in o) if (!d[day]) d[day] = o[day]; } }
    return d;
  } catch { return {}; }
};
const store = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const countUp = (el, to) => {
  const from = parseInt(el.dataset.v || "0", 10); el.dataset.v = to;
  if (from === to || matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = to; return; }
  const t0 = performance.now();
  const tick = t => { const p = Math.min((t - t0) / 600, 1); el.textContent = Math.round(from + (to - from) * (1 - (1 - p) ** 3)); if (p < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
};

let data = load(), selected = ymd(new Date()), mood = null, stampTimer, typeTimer;

function streakCount() {
  let n = 0, d = new Date();
  if (!data[ymd(d)]) d.setDate(d.getDate() - 1);
  while (data[ymd(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function totalXp() {
  let xp = 0, run = 0, prev = null;
  for (const k of Object.keys(data).sort()) {
    const cur = new Date(k + "T00:00:00");
    run = prev && (cur - prev) / 864e5 === 1 ? run + 1 : 1;
    xp += XP_PER + Math.min(run, 30) * XP_BONUS_PER_STREAK;
    prev = cur;
  }
  return xp;
}
const rankOf = xp => Math.min(Math.floor(xp / XP_PER_RANK), RANKS.length - 1);

function typewrite(text) {
  clearInterval(typeTimer); let i = 0;
  const el = $("stampBig"); el.textContent = "";
  typeTimer = setInterval(() => { el.textContent = text.slice(0, ++i); if (i >= text.length) clearInterval(typeTimer); }, 55);
}

function render() {
  const sd = new Date(selected + "T00:00:00");
  $("d").textContent = selected.replace(/-/g, ".");
  $("dow").textContent = ["SUN","MON","TUE","WED","THU","FRI","SAT"][sd.getDay()];

  const xp = totalXp(), rk = rankOf(xp), st = streakCount();
  const pct = rk >= RANKS.length - 1 ? 100 : Math.round((xp % XP_PER_RANK) / XP_PER_RANK * 100);
  $("lv").textContent = RANKS[rk];
  $("xp").style.width = pct + "%"; $("xpTxt").textContent = pct + "%";
  $("lifeBar").style.width = Math.min(st / 30, 1) * 100 + "%"; $("streakTxt").textContent = st;
  countUp($("streak"), st);
  countUp($("total"), Object.keys(data).length);
  const _total = Object.keys(data).length, _s = n => Math.max(1, Math.min(8, n)), _md = (data[selected] || {}).mood;
  $("wi").innerHTML = [
    ["★", _s(1 + Math.floor(st / 4)), "連続日数", st + " 日"],
    ["☆", _s(1 + Math.floor(_total / 6)), "記録数", _total + " 件"],
    ["★", _s(1 + rk), "階級", RANKS[rk]],
    ["☆", _md ? _s(8 - MOODS.findIndex(x => x[0] === _md) * 2) : 1, "今日の状態", _md || "未記録"]
  ].map(([t, n, l, v]) => `<div><i>(${t}${n})</i><b>${l}</b><span>: ${v}</span></div>`).join("");
  $("cls").textContent = ["レンジャー", "ウイングダイバー", "エアレイダー", "フェンサー"][_total % 4];
  $("arm").textContent = 100 + st * 10 + _total * 5;
  $("enemy").textContent = Math.max(0, 1000 - _total * 10);

  const e = data[selected];
  $("body").value = e ? e.text : "";
  mood = e ? e.mood : null;
  $("moods").innerHTML = MOODS.map(([m, tag, c]) => `<li><button data-m="${m}" style="--r:${c||""}" class="${m===mood?"on":""}">${m}<span>${tag}</span></button></li>`).join("");
  $("hint").textContent = selected === ymd(new Date()) ? "" : "過去の日付を編集中（カレンダーで日付を選べます）";

  const now = new Date(), y = now.getFullYear(), mo = now.getMonth();
  const first = new Date(y, mo, 1).getDay(), last = new Date(y, mo + 1, 0).getDate();
  let h = "SMTWTFS".split("").map(c => `<div class="dow">${c}</div>`).join("");
  h += "<div style='visibility:hidden'></div>".repeat(first);
  for (let d = 1; d <= last; d++) {
    const k = ymd(new Date(y, mo, d));
    h += `<div data-d="${k}" style="cursor:pointer;--i:${d}" class="${data[k]?"done":""} ${k===ymd(now)?"today":""} ${k===selected?"sel":""}">${d}</div>`;
  }
  $("cal").innerHTML = h;

  const keys = Object.keys(data).sort().reverse();
  $("list").innerHTML = keys.length ? keys.map((k, i) =>
    `<div class="entry" style="--i:${Math.min(i, 12)}"><small>${k} ／ ${esc(data[k].mood||"-")}</small><p>${esc(data[k].text)}</p></div>`).join("")
    : `<div class="entry" style="--i:1"><p>戦闘記録なし。最初の作戦に出撃せよ。</p></div>`;
}

$("moods").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  mood = b.dataset.m;
  
  document.querySelectorAll("#moods button").forEach(x => x.classList.toggle("on", x === b));
};
$("cal").onclick = e => {
  const c = e.target.closest("[data-d]"); if (!c) return;
  selected = c.dataset.d; render();
};
$("save").onclick = () => {
  const text = $("body").value.trim();
  if (!text) { $("body").focus(); return; }
  const before = rankOf(totalXp()), isNew = !data[selected];
  data[selected] = { mood, text };
  store(data);
  const up = rankOf(totalXp()) > before;
  
  $("stamp").classList.remove("show"); void $("stamp").offsetWidth; $("stamp").classList.add("show");
  $("bang").style.animation = "none"; void $("bang").offsetWidth; $("bang").style.animation = "";
  setTimeout(() => typewrite(up ? MSG_PROMO : MSG_FILED), 450);
  $("stampSub").textContent = isNew ? `${streakCount()} DAYS` : "UPDATED";
  clearTimeout(stampTimer); stampTimer = setTimeout(() => $("stamp").classList.remove("show"), 2800);
  render();
};
$("stamp").onclick = () => $("stamp").classList.remove("show");

render();
</script>
</body>
</html>
