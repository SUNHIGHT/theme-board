# Cloudflare Worker for the diary sync API.
# Before `wrangler deploy`: run `wrangler d1 create diary-sync` and paste the printed database_id below.
name = "diary-sync"
main = "src/index.js"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "diary-sync"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

[vars]
# Comma-separated list of origins allowed to call the API from a browser. "*" allows any origin (the token still protects the data).
ALLOWED_ORIGINS = "*"

# The shared secret is NOT stored here. Set it with:  wrangler secret put SYNC_TOKEN
